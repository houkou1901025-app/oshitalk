<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OshiTalk English - 推し活×英語学習</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-leo: #f59e0b;
            --accent-hugh: #3b82f6;
            --accent-liam: #10b981;
            --accent-color: var(--accent-leo);
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .header p {
            margin: 4px 0 0;
            font-size: 0.85rem;
            color: var(--text-sub);
        }

        /* キャラクター選択 */
        .char-selector {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }

        .char-card {
            flex: 1;
            background: rgba(15, 23, 42, 0.6);
            border: 2px solid transparent;
            border-radius: 16px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .char-card.active {
            border-color: var(--accent-color);
            background: rgba(255, 255, 255, 0.05);
        }

        .char-card img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 6px;
        }

        .char-card .name {
            font-weight: 600;
            font-size: 0.9rem;
        }

        /* 好感度バー */
        .love-level-box {
            background: rgba(15, 23, 42, 0.4);
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .love-level-box img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
        }

        .love-info {
            flex: 1;
        }

        .love-title {
            font-size: 0.8rem;
            color: var(--text-sub);
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 15%;
            background: var(--accent-color);
            transition: width 0.3s ease, background-color 0.3s ease;
        }

        /* チャットエリア */
        .chat-area {
            height: 280px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
            padding-right: 4px;
        }

        .msg-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .msg-row.user {
            flex-direction: row-reverse;
        }

        .msg-row img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
        }

        .bubble {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .msg-row.ai .bubble {
            background: rgba(255, 255, 255, 0.1);
            border-bottom-left-radius: 4px;
        }

        .msg-row.user .bubble {
            background: var(--accent-color);
            color: #000;
            font-weight: 500;
            border-bottom-right-radius: 4px;
        }

        .jp-sub {
            font-size: 0.75rem;
            color: var(--text-sub);
            margin-top: 4px;
            display: block;
        }

        /* クイックアクション */
        .quick-actions {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .quick-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            white-space: nowrap;
            cursor: pointer;
            transition: background 0.2s;
        }

        .quick-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* 入力フォーム */
        .input-area {
            display: flex;
            gap: 8px;
        }

        .input-area input {
            flex: 1;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 10px 16px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }

        .input-area input:focus {
            border-color: var(--accent-color);
        }

        .btn {
            background: var(--accent-color);
            border: none;
            color: #000;
            font-weight: bold;
            padding: 0 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-mic {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-mic.recording {
            background: #ef4444;
            color: #fff;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>OshiTalk English</h1>
        <p>推しと話しながら、自然な英語を学ぼう！</p>
    </div>

    <!-- キャラクター選択 -->
    <div class="char-selector">
        <div class="char-card active" onclick="selectChar('leo')" id="card-leo">
            <img src="https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=100&h=100&fit=crop" alt="Leo">
            <div class="name">Leo</div>
        </div>
        <div class="char-card" onclick="selectChar('hugh')" id="card-hugh">
            <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100&h=100&fit=crop" alt="Hugh">
            <div class="name">Hugh</div>
        </div>
        <div class="char-card" onclick="selectChar('liam')" id="card-liam">
            <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=100&h=100&fit=crop" alt="Liam">
            <div class="name">Liam</div>
        </div>
    </div>

    <!-- 好感度表示 -->
    <div class="love-level-box">
        <img id="love-avatar" src="https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=100&h=100&fit=crop" alt="Current Oshi">
        <div class="love-info">
            <div class="love-title">
                <span id="char-title-name">Leo (俺様・クール系)</span>
                <span>Love Lv. <span id="love-lv">1</span> (15%)</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="love-progress"></div>
            </div>
        </div>
    </div>

    <!-- チャットログ -->
    <div class="chat-area" id="chat-area">
        <!-- 初期メッセージ -->
    </div>

    <!-- クイック発言 -->
    <div class="quick-actions">
        <button class="quick-btn" onclick="sendQuick('Good morning!')">挨拶（朝）</button>
        <button class="quick-btn" onclick="sendQuick('How was your day?')">今日どうだった？</button>
        <button class="quick-btn" onclick="sendQuick('I missed you!')">逢いたかった！</button>
        <button class="quick-btn" onclick="sendQuick('Good night, sweet dreams!')">おやすみ</button>
    </div>

    <!-- 入力領域 -->
    <div class="input-area">
        <button class="btn btn-mic" id="mic-btn" onclick="toggleSpeech()">🎤</button>
        <input type="text" id="user-input" placeholder="英語でメッセージを入力..." onkeypress="handleKey(event)">
        <button class="btn" onclick="sendMessage()">送信</button>
    </div>
</div>

<script>
    // キャラクター定義
    const CHARS = {
        leo: {
            name: 'Leo',
            desc: '俺様・クール系',
            avatar: 'https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=100&h=100&fit=crop',
            color: '#f59e0b',
            greet: 'Good morning, sweetheart. Did you sleep well? I was hoping you\'d come talk to me today.',
            greetJp: 'おはよう。よく眠れた？今日も君が話しに来てくれるのを待っていたよ。'
        },
        hugh: {
            name: 'Hugh',
            desc: '包容力・大人お兄さん系',
            avatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100&h=100&fit=crop',
            color: '#3b82f6',
            greet: 'Hello there. You worked hard today. Take a deep breath and relax with me, okay?',
            greetJp: 'やあ、お疲れ様。深呼吸して、僕と一緒にゆっくり過ごそうね。'
        },
        liam: {
            name: 'Liam',
            desc: '年下・わんこ系',
            avatar: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=100&h=100&fit=crop',
            color: '#10b981',
            greet: 'Hey! I\'m so happy to see you! Tell me everything about your day!',
            greetJp: 'ねえねえ！会えてすごく嬉しいよ！今日の出来事、全部教えて！'
        }
    };

    let currentChar = 'leo';
    let recognition = null;
    let isRecording = false;

    // 初期化
    window.onload = () => {
        selectChar('leo');
        initSpeech();
    };

    // キャラクター切り替え機能 (③の不具合修正)
    function selectChar(key) {
        currentChar = key;
        const char = CHARS[key];

        // UI切り替え
        document.querySelectorAll('.char-card').forEach(card => card.classList.remove('active'));
        document.getElementById(`card-${key}`).classList.add('active');

        // テーマカラー更新
        document.documentElement.style.setProperty('--accent-color', char.color);

        // 好感度表示欄の変更 (★修正: アイコンと名前を正確に変更)
        document.getElementById('love-avatar').src = char.avatar;
        document.getElementById('char-title-name').innerText = `${char.name} (${char.desc})`;

        // チャット初期化
        const chatArea = document.getElementById('chat-area');
        chatArea.innerHTML = '';
        addBubble('ai', char.greet, char.greetJp);
    }

    // メッセージ追加
    function addBubble(sender, text, subText = '') {
        const chatArea = document.getElementById('chat-area');
        const row = document.createElement('div');
        row.className = `msg-row ${sender}`;

        const char = CHARS[currentChar];
        const avatarUrl = sender === 'ai' ? char.avatar : 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop';

        row.innerHTML = `
            <img src="${avatarUrl}" alt="icon">
            <div class="bubble">
                ${text}
                ${subText ? `<span class="jp-sub">${subText}</span>` : ''}
            </div>
        `;
        chatArea.appendChild(row);
        chatArea.scrollTop = chatArea.scrollHeight;

        // AIの返答を読み上げ
        if (sender === 'ai') {
            speakText(text);
        }
    }

    // 送信処理
    async function sendMessage() {
        const input = document.getElementById('user-input');
        const text = input.value.trim();
        if (!text) return;

        addBubble('user', text);
        input.value = '';

        // API通信（失敗時は定型応答）
        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ character: currentChar, message: text })
            });
            const data = await response.json();
            
            if (data.reply) {
                addBubble('ai', data.reply, data.translation || '');
            } else {
                throw new Error('API返答なし');
            }
        } catch (e) {
            // フォールバック（API未設定・接続エラー時）
            const fallback = getSmartReply(text);
            addBubble('ai', fallback.en, fallback.jp);
        }
    }

    // クイック送信 (④, ⑤の不具合修正)
    function sendQuick(text) {
        addBubble('user', text);
        // ユーザーの発言を読み上げ（⑤の対応）
        speakText(text);

        // 少し間を置いてからAIの返答
        setTimeout(async () => {
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ character: currentChar, message: text })
                });
                const data = await response.json();
                if (data.reply) {
                    addBubble('ai', data.reply, data.translation || '');
                } else {
                    throw new Error('API返答なし');
                }
            } catch (e) {
                const fallback = getSmartReply(text);
                addBubble('ai', fallback.en, fallback.jp);
            }
        }, 800);
    }

    // 定型応答用ロジック (④の修正: 「おやすみ」を正しく認識するように強化)
    function getSmartReply(text) {
        const lower = text.toLowerCase();
        
        if (lower.includes('night') || lower.includes('sleep') || lower.includes('おやすみ')) {
            return {
                en: "Good night. Sleep tight, and I'll be right here in your dreams.",
                jp: "おやすみ。良い夢を。夢の中でも僕がそばにいるよ。"
            };
        }
        if (lower.includes('morning') || lower.includes('おはよう')) {
            return {
                en: "Good morning! Seeing your message makes my day starting so bright.",
                jp: "おはよう！きみのメッセージを見れて、最高の1日のスタートになったよ。"
            };
        }
        if (lower.includes('miss')) {
            return {
                en: "I missed you too! I was thinking about you all day long.",
                jp: "僕も逢いたかったよ！一日中きみのことばかり考えてたんだ。"
            };
        }
        return {
            en: "I love talking with you! Tell me more about what you like.",
            jp: "きみとおしゃべりするのは楽しいな！もっといろんなことを教えて？"
        };
    }

    // 音声認識 (②の不具合修正)
    function initSpeech() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            console.warn("このブラウザは音声認識に対応していません。");
            return;
        }

        recognition = new SpeechRecognition();
        recognition.lang = 'en-US'; // 英語認識に設定
        recognition.interimResults = false;
        recognition.continuous = false;

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            document.getElementById('user-input').value = transcript;
            stopSpeech();
        };

        recognition.onerror = (event) => {
            console.error("音声認識エラー:", event.error);
            stopSpeech();
        };

        recognition.onend = () => {
            stopSpeech();
        };
    }

    function toggleSpeech() {
        if (!recognition) {
            alert("お使いのブラウザ（または環境）では音声認識機能がサポートされていません。Chrome等の利用をお試しください。");
            return;
        }

        if (isRecording) {
            stopSpeech();
        } else {
            try {
                recognition.start();
                isRecording = true;
                const micBtn = document.getElementById('mic-btn');
                micBtn.classList.add('recording');
                micBtn.innerText = '🔴';
            } catch (e) {
                console.error("開始エラー:", e);
            }
        }
    }

    function stopSpeech() {
        if (recognition && isRecording) {
            recognition.stop();
        }
        isRecording = false;
        const micBtn = document.getElementById('mic-btn');
        if (micBtn) {
            micBtn.classList.remove('recording');
            micBtn.innerText = '🎤';
        }
    }

    // 読み上げ (TTS)
    function speakText(text) {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel(); // 連続再生防止

        const uttr = new SpeechSynthesisUtterance(text);
        uttr.lang = 'en-US';
        uttr.rate = 0.9; // 聴き取りやすいスピード
        window.speechSynthesis.speak(uttr);
    }

    function handleKey(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }
</script>

</body>
</html>
