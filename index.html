<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oshitalk English - 推し活×英会話</title>
<style>
:root {
  --bg-color: #0f172a;
  --card-bg: rgba(30, 41, 59, 0.85);
  --text-main: #f8fafc;
  --text-sub: #cbd5e1;
  --accent-leo: #f59e0b;
  --accent-noah: #8b5cf6;
  --accent-liam: #10b981;
  --accent-color: var(--accent-leo);
}

body {
  margin: 0; padding: 20px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background-color: var(--bg-color); color: var(--text-main);
  display: flex; justify-content: center; align-items: center; min-height: 100vh;
  box-sizing: border-box;
}

.container {
  width: 100%; max-width: 540px; background: var(--card-bg);
  backdrop-filter: blur(16px); border-radius: 28px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  box-shadow: 0 25px 35px -5px rgba(0, 0, 0, 0.6); position: relative;
  padding: 24px;
}

.header { text-align: center; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
.header h1 {
  margin: 0; font-size: 1.5rem; font-weight: 800;
  background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.subscribe-btn {
  background: linear-gradient(135deg, #f59e0b, #ec4899);
  color: #fff; border: none; padding: 6px 14px; border-radius: 16px;
  font-size: 0.88rem; font-weight: bold; cursor: pointer;
  box-shadow: 0 3px 10px rgba(245, 158, 11, 0.4);
}

.love-level-box {
  background: rgba(15, 23, 42, 0.65); border-radius: 14px;
  padding: 8px 14px; margin-bottom: 12px; display: flex; align-items: center;
  gap: 12px; font-size: 0.88rem; border: 1px solid rgba(255, 255, 255, 0.08);
}
.love-badge {
  background: var(--accent-color); color: #0f172a; font-weight: bold;
  padding: 3px 10px; border-radius: 12px; white-space: nowrap; font-size: 0.85rem;
}
.love-bar-bg { flex: 1; height: 10px; background: rgba(255, 255, 255, 0.12); border-radius: 5px; overflow: hidden; }
.love-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent-color), #ec4899); width: 0%; transition: width 0.4s ease; }

.char-selector { display: flex; gap: 10px; margin-bottom: 14px; }
.char-card {
  flex: 1; background: rgba(15, 23, 42, 0.6); border: 2px solid transparent;
  border-radius: 18px; padding: 8px; text-align: center; cursor: pointer; transition: all 0.3s;
}
.char-card.active { border-color: var(--accent-color); background: rgba(255, 255, 255, 0.1); }
.char-card img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255, 255, 255, 0.25); }
.char-card .name { font-weight: 700; font-size: 0.95rem; margin-top: 2px; }

/* ① 感情別アニメーション定義 */
.anim-happy { animation: bounce 1.2s infinite alternate ease-in-out; }
.anim-blush { animation: heartPulse 1.5s infinite ease-in-out; }
.anim-angry { animation: shake 0.5s infinite; }
.anim-sad { animation: floatSlow 2.5s infinite ease-in-out; }

@keyframes bounce { 0% { transform: translateY(0); } 100% { transform: translateY(-10px) scale(1.05); } }
@keyframes heartPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px) rotate(-2deg); } 75% { transform: translateX(4px) rotate(2deg); } }
@keyframes floatSlow { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(6px); } }

.control-panel {
  background: rgba(15, 23, 42, 0.55); border-radius: 14px; padding: 10px 14px;
  margin-bottom: 14px; display: flex; flex-direction: column; gap: 8px; font-size: 0.85rem;
}
.control-row { display: flex; justify-content: space-between; align-items: center; }
.step-btns { display: flex; gap: 6px; }
.step-btn { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; padding: 4px 10px; border-radius: 12px; cursor: pointer; font-size: 0.8rem; }
.step-btn.active { background: var(--accent-color); color: #0f172a; font-weight: bold; }
select, input[type="date"], input[type="text"].user-icon-input { background: #1e293b; color: #fff; border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 8px; padding: 4px 8px; font-size: 0.85rem; }

.chat-area { height: 260px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; margin-bottom: 12px; padding-right: 4px; }
.msg-row { display: flex; gap: 10px; align-items: flex-start; }
.msg-row.user { flex-direction: row-reverse; }
.msg-row img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex-shrink: 0; cursor: pointer; }
.bubble-container { max-width: 82%; display: flex; flex-direction: column; gap: 4px; }
.bubble { padding: 10px 14px; border-radius: 16px; font-size: 0.98rem; line-height: 1.45; }
.msg-row.ai .bubble { background: rgba(255, 255, 255, 0.12); border-top-left-radius: 2px; }
.msg-row.user .bubble { background: var(--accent-color); color: #0f172a; font-weight: 600; border-top-right-radius: 2px; }

/* ③ 訳文のスタイル強化 */
.jp-sub { font-size: 0.82rem; color: #cbd5e1; margin-top: 2px; display: block; }
.msg-row.user .jp-sub { color: #94a3b8; text-align: right; }

.english-tip { font-size: 0.8rem; background: rgba(0, 0, 0, 0.4); border-left: 3px solid var(--accent-color); padding: 6px 10px; border-radius: 0 8px 8px 0; color: #e2e8f0; margin-top: 4px; }
.replay-btn { align-self: flex-start; background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; border-radius: 12px; padding: 3px 10px; font-size: 0.75rem; cursor: pointer; margin-top: 3px; }

.quick-toggle-container { margin-bottom: 14px; background: rgba(15, 23, 42, 0.65); border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.1); overflow: hidden; }
.quick-toggle-header { padding: 10px 14px; font-size: 0.88rem; font-weight: bold; background: rgba(255, 255, 255, 0.05); display: flex; justify-content: space-between; align-items: center; cursor: pointer; color: var(--accent-color); }
.quick-categories { display: flex; gap: 6px; overflow-x: auto; padding: 8px; scrollbar-width: none; background: rgba(0,0,0,0.25); }
.cat-tab { padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; white-space: nowrap; cursor: pointer; background: rgba(255, 255, 255, 0.08); color: var(--text-main); }
.cat-tab.active { background: var(--accent-color); color: #0f172a; font-weight: bold; }
.quick-phrase-list { display: none; padding: 10px; gap: 8px; overflow-x: auto; background: rgba(15, 23, 42, 0.85); }
.quick-phrase-list.open { display: flex; }
.quick-btn { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.18); color: var(--text-main); padding: 6px 12px; border-radius: 16px; font-size: 0.82rem; white-space: nowrap; cursor: pointer; flex-shrink: 0; }

.input-area { display: flex; gap: 8px; }
.input-area input { flex: 1; background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 20px; padding: 10px 16px; color: #fff; font-size: 0.95rem; outline: none; }
.btn { background: var(--accent-color); border: none; color: #0f172a; font-weight: bold; padding: 0 18px; border-radius: 20px; cursor: pointer; font-size: 0.9rem; }
.btn-mic { background: rgba(255, 255, 255, 0.12); color: #fff; border: 1px solid rgba(255, 255, 255, 0.25); width: 44px; font-size: 1.1rem; }
.btn-mic.recording { background: #ef4444; animation: pulse 1s infinite; }
@keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

.modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(12px); display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; z-index: 999; }
.modal-overlay.active { opacity: 1; pointer-events: auto; }
.modal-card { width: 88%; max-width: 360px; background: rgba(30, 41, 59, 0.95); border: 2px solid var(--accent-color); border-radius: 24px; padding: 24px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.8); transition: all 0.3s ease; position: relative; }

/* 通話風UI（Call Mode） */
.modal-card.call-mode {
  width: 100vw !important; height: 100vh !important; max-width: 100vw !important; border-radius: 0 !important;
  border: none !important; background: linear-gradient(180deg, #0f172a 0%, #1e1b4b 100%) !important;
  display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 20px 16px !important; box-sizing: border-box;
  overflow-y: auto;
}
.call-header { display: none; font-size: 1rem; color: #10b981; font-weight: bold; margin-bottom: 4px; }
.modal-card.call-mode .call-header { display: block; }
.modal-card.call-mode img {
  width: 120px !important; height: 120px !important;
  border-radius: 50% !important; border: 3px solid #10b981 !important; box-shadow: 0 0 25px rgba(16, 185, 129, 0.5) !important;
  margin-bottom: 4px; flex-shrink: 0;
}

.wave-animation { display: none; justify-content: center; align-items: center; gap: 6px; height: 24px; margin: 4px 0; }
.modal-card.call-mode .wave-animation { display: flex; }
.wave-bar { width: 5px; height: 20px; background: #10b981; border-radius: 3px; transform-origin: center; animation: wave 1.2s infinite ease-in-out; }
.wave-bar:nth-child(2) { animation-delay: 0.2s; }
.wave-bar:nth-child(3) { animation-delay: 0.4s; }
@keyframes wave { 0%, 100% { transform: scaleY(0.3); } 50% { transform: scaleY(1.1); } }

/* ③ 通話モード内の会話テキストエリア（自分と相手の両方＋日本語訳を表示） */
.call-dialog-container {
  display: none; width: 100%; max-width: 440px; background: rgba(15, 23, 42, 0.65); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px; padding: 10px; box-sizing: border-box; max-height: 150px; overflow-y: auto; text-align: left; margin-bottom: 6px;
}
.modal-card.call-mode .call-dialog-container { display: flex; flex-direction: column; gap: 8px; }
.call-msg { font-size: 0.88rem; line-height: 1.35; padding: 6px 10px; border-radius: 12px; }
.call-msg.ai { background: rgba(255, 255, 255, 0.12); color: #fff; border-top-left-radius: 2px; }
.call-msg.user { background: var(--accent-color); color: #0f172a; font-weight: 600; align-self: flex-end; border-top-right-radius: 2px; }
.call-msg-sub { font-size: 0.76rem; opacity: 0.8; display: block; margin-top: 2px; }

/* ④ 動的返答ヒント */
.call-assist-box {
  display: none; width: 100%; max-width: 440px; background: rgba(15, 23, 42, 0.75); border: 1px solid rgba(16, 185, 129, 0.4);
  border-radius: 16px; padding: 8px 12px; margin: 4px 0; text-align: left; box-sizing: border-box;
}
.modal-card.call-mode .call-assist-box { display: block; }
.call-assist-title { font-size: 0.78rem; color: #10b981; font-weight: bold; margin-bottom: 4px; display: flex; justify-content: space-between; }
.call-assist-item {
  background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 10px;
  padding: 5px 10px; margin-bottom: 4px; font-size: 0.82rem; cursor: pointer; transition: background 0.2s;
}
.call-assist-item:hover { background: rgba(16, 185, 129, 0.2); }
.call-assist-item:last-child { margin-bottom: 0; }

.call-control-container { display: none; width: 100%; max-width: 440px; flex-direction: column; gap: 6px; }
.modal-card.call-mode .call-control-container { display: flex; }

.call-mode-toggle { display: flex; justify-content: center; gap: 12px; font-size: 0.8rem; color: #cbd5e1; }
.call-mode-toggle label { display: flex; align-items: center; gap: 4px; cursor: pointer; }

.call-transcribe-preview {
  background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.2); border-radius: 12px;
  padding: 6px 10px; font-size: 0.88rem; color: #fff; min-height: 32px; text-align: left; word-break: break-all;
}

.call-btn-group { display: flex; gap: 6px; justify-content: center; }
.call-action-btn {
  flex: 1; padding: 7px 0; border-radius: 12px; border: none; font-size: 0.8rem; font-weight: bold; cursor: pointer; color: #fff;
}
.btn-mic-start { background: #10b981; }
.btn-mic-stop { background: #f59e0b; }
.btn-mic-clear { background: #64748b; }
.btn-mic-send { background: #3b82f6; }

.modal-card img { width: 110px; height: 110px; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent-color); margin-bottom: 6px; transition: all 0.3s ease; }
.modal-name { font-size: 1.1rem; font-weight: bold; color: var(--accent-color); margin-bottom: 2px; }
.modal-btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 6px; }
.modal-btn { background: var(--accent-color); color: #0f172a; border: none; padding: 7px 14px; border-radius: 16px; font-weight: bold; cursor: pointer; font-size: 0.82rem; }
.modal-btn.sec { background: rgba(255, 255, 255, 0.18); color: #fff; }
.modal-btn.call { background: #10b981; color: #fff; }

.plan-card { background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; padding: 14px; margin: 12px 0; text-align: left; font-size: 0.88rem; }
.plan-title { color: #f59e0b; font-weight: bold; display: flex; justify-content: space-between; font-size: 0.98rem; }
.pay-btn { background: linear-gradient(135deg, #ec4899, #8b5cf6); color: #fff; border: none; width: 100%; padding: 12px; border-radius: 14px; font-weight: bold; cursor: pointer; margin-top: 12px; font-size: 0.95rem; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Oshitalk English</h1>
    <button class="subscribe-btn" onclick="openPayModal()">✨ Premium</button>
  </div>

  <div class="love-level-box">
    <span class="love-badge" id="love-level-badge">Lv.1 Sweetheart</span>
    <div class="love-bar-bg">
      <div class="love-bar-fill" id="love-bar-fill"></div>
    </div>
    <span id="love-exp-text" style="font-size:0.78rem; color: #cbd5e1;">0/100</span>
  </div>

  <div class="char-selector">
    <div class="char-card active" onclick="selectChar('leo')" id="card-leo">
      <img id="avatar-leo" src="leo.jpg" alt="Leo"><div class="name">Leo</div>
    </div>
    <div class="char-card" onclick="selectChar('noah')" id="card-noah">
      <img id="avatar-noah" src="noah.jpg" alt="Noah"><div class="name">Noah</div>
    </div>
    <div class="char-card" onclick="selectChar('liam')" id="card-liam">
      <img id="avatar-liam" src="liam.jpg" alt="Liam"><div class="name">Liam</div>
    </div>
  </div>

  <div class="control-panel">
    <div class="control-row">
      <span>会話ステップ:</span>
      <div class="step-btns">
        <button class="step-btn" id="step-1" onclick="setStep(1)">Step 1 (初級)</button>
        <button class="step-btn" id="step-2" onclick="setStep(2)">Step 2 (中級)</button>
        <button class="step-btn" id="step-3" onclick="setStep(3)">Step 3 (長文)</button>
      </div>
    </div>
    <!-- ② 修正: 自分のアイコン設定 -->
    <div class="control-row">
      <span>My Icon URL:</span>
      <input type="text" class="user-icon-input" id="user-icon-url" placeholder="画像URLを入力..." onchange="saveUserIcon(this.value)">
    </div>
    <div class="control-row">
      <span>履歴保存:</span>
      <select id="history-retention" onchange="saveHistorySetting(this.value)">
        <option value="1">1日間保存</option>
        <option value="7" selected>1週間保存</option>
        <option value="999">無制限に保持</option>
      </select>
    </div>
    <div class="control-row">
      <span>My Birthday:</span>
      <input type="date" id="user-birthday" onchange="saveBirthday(this.value)">
    </div>
  </div>

  <div class="chat-area" id="chat-area"></div>

  <div class="quick-toggle-container">
    <div class="quick-toggle-header" onclick="toggleQuickPanel()">
      <span>トピック別クイック発言 (100パターン)</span>
      <span id="toggle-icon">▲</span>
    </div>
    <div class="quick-categories" id="quick-cats"></div>
    <div class="quick-phrase-list open" id="quick-phrase-list"></div>
  </div>

  <div class="input-area">
    <button class="btn btn-mic" id="mic-btn" onclick="toggleSpeech()">🎤</button>
    <input type="text" id="user-input" placeholder="英語でメッセージを入力..." onkeypress="handleKey(event)">
    <button class="btn" onclick="sendMessage()">送信</button>
  </div>
</div>

<!-- 推しモーダル / 通話モード -->
<div class="modal-overlay" id="oshi-modal" onclick="closeModal()">
  <div class="modal-card" id="modal-card-box" onclick="event.stopPropagation()">
    <div class="call-header" id="call-header">📞 音声通話中...</div>
    <!-- ① アニメーション付与用の画像 -->
    <img id="modal-img" src="leo.jpg" alt="Oshi" class="anim-happy">
    
    <div class="wave-animation">
      <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
    </div>

    <div class="modal-name" id="modal-name">Leo</div>
    
    <!-- ③ 修正: 通話モード用ダイアログ履歴（英語＋日本語訳） -->
    <div class="call-dialog-container" id="call-dialog-container"></div>

    <!-- ④ 修正: 会話に連動した動的ヒント -->
    <div class="call-assist-box">
      <div class="call-assist-title">
        <span>💡 返答ヒント (タップして入力)</span>
        <span style="font-weight:normal; opacity:0.8;" id="assist-step-label">Step 2</span>
      </div>
      <div id="call-assist-list"></div>
    </div>

    <!-- 通話モードコントロール -->
    <div class="call-control-container">
      <div class="call-mode-toggle">
        <label><input type="radio" name="callSendMode" value="auto" checked onchange="changeCallSendMode('auto')"> ① 4秒後に自動送信</label>
        <label><input type="radio" name="callSendMode" value="manual" onchange="changeCallSendMode('manual')"> ② 手動で送信操作</label>
      </div>

      <div class="call-transcribe-preview" id="call-transcribe-preview">音声を入力してください...</div>

      <div class="call-btn-group">
        <button class="call-action-btn btn-mic-start" id="call-btn-start" onclick="toggleSpeech()">🎙️ 音声入力</button>
        <button class="call-action-btn btn-mic-stop" id="call-btn-stop" onclick="stopSpeech()" style="display:none;">⏹️ 録音終了</button>
        <button class="call-action-btn btn-mic-clear" onclick="clearSpeechText()">🗑️ 削除</button>
        <button class="call-action-btn btn-mic-send" onclick="sendCallMessage()">📤 送信</button>
      </div>
    </div>

    <div class="modal-btns">
      <button class="modal-btn sec" onclick="replayCurrentModalVoice()">🔊 もう一度聞く</button>
      <button class="modal-btn call" id="btn-toggle-call" onclick="toggleCallMode()">通話モード切替</button>
      <button class="modal-btn" onclick="closeModal()">切断して閉じる</button>
    </div>
  </div>
</div>

<!-- Premium登録モーダル -->
<div class="modal-overlay" id="pay-modal" onclick="closePayModal()">
  <div class="modal-card" onclick="event.stopPropagation()">
    <div class="modal-name" style="color: #ec4899;">Oshitalk Premium</div>
    <p style="font-size: 0.88rem; color: #cbd5e1;">推しとの特別な会話体験を解禁！</p>
    
    <div class="plan-card">
      <div class="plan-title"><span>月額 Premium プラン</span> <span>¥980 / 月</span></div>
      <p style="font-size: 0.78rem; color: #94a3b8; margin: 6px 0 0 0;">
        ・ハンズフリー通話モード完全解放<br>
        ・ボイス再生＆感情アニメーション無制限<br>
        ・回答例アシスト機能＆誕生日イベント
      </p>
    </div>

    <button class="pay-btn" onclick="processPayment()">✨ 今すぐ登録する（7日間無料）</button>
    <button class="modal-btn sec" style="margin-top: 10px; width: 100%;" onclick="closePayModal()">キャンセル</button>
  </div>
</div>

<script>
const CHARS = {
  leo: {
    name: 'Leo', color: '#f59e0b', pitch: 0.75, rate: 0.95,
    greet: 'Good morning, sweetheart. I was thinking about you.',
    greetJp: 'おはよう。今日も君に会えて嬉しいよ。',
    expressions: { default: 'leo.jpg', happy: 'leo_happy.jpg', blush: 'leo_blush.jpg', angry: 'leo_angry.jpg', sad: 'leo_sad.jpg' }
  },
  noah: {
    name: 'Noah', color: '#8b5cf6', pitch: 0.6, rate: 0.9,
    greet: "You're here. So, what do you want to talk about today?",
    greetJp: '来たんだ。で、今日は何話すの？',
    expressions: { default: 'noah.jpg', happy: 'noah_happy.jpg', blush: 'noah_blush.jpg', angry: 'noah_angry.jpg', sad: 'noah_sad.jpg' }
  },
  liam: {
    name: 'Liam', color: '#10b981', pitch: 0.85, rate: 1.0,
    greet: "Hey! I'm so happy to talk with you today!",
    greetJp: 'やっほー！今日もお喋りできてめっちゃ嬉しい！',
    expressions: { default: 'liam.jpg', happy: 'liam_happy.jpg', blush: 'liam_blush.jpg', angry: 'liam_angry.jpg', sad: 'liam_sad.jpg' }
  }
};

const QUICK_DATA = {
  life: { title: '生活', phrases: [

/* ② ユーザーアイコンの設定と読み込み */
function saveUserIcon(val) {
  if (val.trim()) {
    userIcon = val.trim();
    localStorage.setItem('oshitalk_user_icon', userIcon);
    renderChatHistory();
  }
}
function loadUserIcon() {

    document.getElementById('user-icon-url').value = saved;

/* ① アニメーション付きで表情を切替 */
function setExpression(expr) {
  currentExpression = expr || 'default';
  const char = CHARS[currentChar];
  const imgSrc = char.expressions[currentExpression] || char.expressions.default;
  
  const charImg = document.querySelector(`#card-${currentChar} img`);
  if (charImg) charImg.src = imgSrc;
  
  const modalImg = document.getElementById('modal-img');
  if (modalImg) {
    modalImg.src = imgSrc;
    // ① アニメーションクラスを一度解除して付け直す
    modalImg.className = '';
    setTimeout(() => {
      if (currentExpression === 'happy') modalImg.className = 'anim-happy';
      else if (currentExpression === 'blush') modalImg.className = 'anim-blush';
      else if (currentExpression === 'angry') modalImg.className = 'anim-angry';
      else if (currentExpression === 'sad') modalImg.className = 'anim-sad';
      else modalImg.className = 'anim-happy';
    }, 10);
  }
}

function detectExpression(text, category = '') {
  const lower = text.toLowerCase();
  if (category === 'angry' || lower.includes('angry') || lower.includes('late') || lower.includes('jealous')) return 'angry';
  if (category === 'support' || lower.includes('sad') || lower.includes('tired') || lower.includes('lonely')) return 'sad';
  if (category === 'feeling' || lower.includes('love') || lower.includes('miss') || lower.includes('sweetheart')) return 'blush';
  if (lower.includes('happy') || lower.includes('fun') || lower.includes('great') || lower.includes('smile')) return 'happy';
  return 'default';
}

function addLoveExp(pts) {
  loveExp += pts;
  const maxExp = loveLevel * 100;
  if (loveExp >= maxExp) {
    loveExp = maxExp;
    loveLevel++;
    alert(`🎉 Level Up! 好感度が Lv.${loveLevel} に上がりました！`);
  }
  saveLoveLevel();
  updateLoveUI();
}

function updateLoveUI() {
  const maxExp = loveLevel * 100;
  const pct = Math.min(100, Math.floor((loveExp / maxExp) * 100));
  document.getElementById('love-bar-fill').style.width = pct + '%';
  document.getElementById('love-exp-text').innerText = `${loveExp}/${maxExp}`;
  const titles = ["Sweetheart", "Close Friend", "Special One", "Soulmate", "Forever Love"];
  const title = titles[Math.min(titles.length - 1, loveLevel - 1)];
  document.getElementById('love-level-badge').innerText = `Lv.${loveLevel} ${title}`;
}

function saveLoveLevel() {
  localStorage.setItem('oshitalk_love_exp', loveExp);
  localStorage.setItem('oshitalk_love_lvl', loveLevel);
}

function loadLoveLevel() {
  loveExp = parseInt(localStorage.getItem('oshitalk_love_exp') || '0');
  loveLevel = parseInt(localStorage.getItem('oshitalk_love_lvl') || '1');
  updateLoveUI();
}

function saveBirthday(val) { localStorage.setItem('oshitalk_user_birthday', val); }
function loadBirthday() { const b = localStorage.getItem('oshitalk_user_birthday'); if (b) document.getElementById('user-birthday').value = b; }
function checkBirthday() {
  const b = localStorage.getItem('oshitalk_user_birthday');
  if (!b) return;
  const today = new Date();
  const bDate = new Date(b);
  if (today.getMonth() === bDate.getMonth() && today.getDate() === bDate.getDate()) {
    setTimeout(() => {
      setExpression('blush');
      addBubble('ai', "Happy Birthday, my love!", "誕生日おめでとう！特別な日を一緒に祝えて嬉しいよ！", "今日は特別な1日！", true, true, true);
    }, 1000);
  }
}

function setStep(s) {
  currentStep = s;
  localStorage.setItem('oshitalk_saved_step', s);
  document.querySelectorAll('.step-btn').forEach(btn => btn.classList.remove('active'));
  document.getElementById(`step-${s}`).classList.add('active');
  const label = document.getElementById('assist-step-label');
  if (label) label.innerText = `Step ${s}`;
  updateCallAssistList(lastAIText);
}
function loadStepSetting() {
  const savedStep = localStorage.getItem('oshitalk_saved_step');
  if (savedStep) { setStep(parseInt(savedStep)); } else { setStep(2); }
}

/* ④ 修正: 最新の会話にぴったり連動した動的返答ヒントの生成 */
function updateCallAssistList(aiText = '') {

  assistContainer.innerHTML = '';

  let samples = [];
  const textLower = aiText.toLowerCase();

  // 会話の文脈（文言）を精密判定
  if (textLower.includes('morning') || textLower.includes('woke up')) {
    samples = [
      { en: "Good morning! Did you sleep well?", jp: "おはよう！よく眠れた？" },
      { en: "I'm still a bit sleepy...", jp: "まだちょっと眠いよ..." },
      { en: "Have a wonderful day today!", jp: "今日も良い一日を過ごしてね！" }
    ];
  } else if (textLower.includes('food') || textLower.includes('eat') || textLower.includes('lunch') || textLower.includes('dinner')) {
    samples = [
      { en: "I ate delicious pasta today!", jp: "今日美味しいパスタを食べたよ！" },
      { en: "What is your favorite food?", jp: "一番好きな食べ物はなに？" },
      { en: "Let's go eat together next time!", jp: "今度一緒に食べに行こうよ！" }
    ];
  } else if (textLower.includes('love') || textLower.includes('miss') || textLower.includes('sweetheart') || textLower.includes('thinking about you')) {
    samples = [
      { en: "I love you so much too!", jp: "私もあなたのこと大大好き！" },
      { en: "You always make my heart race.", jp: "いつも胸がドキドキするよ。" },
      { en: "Stop making me blush!", jp: "照れさせないでよ！" }
    ];
  } else if (textLower.includes('tired') || textLower.includes('work') || textLower.includes('busy')) {
    samples = [
      { en: "You worked so hard today! Great job!", jp: "今日も一日がんばったね！えらい！" },
      { en: "Please get a good rest tonight.", jp: "今夜はゆっくり休んでね。" },
      { en: "I'm always here to support you.", jp: "いつでも味方だからね。" }
    ];
  } else {
    if (currentStep === 1) {
      samples = [
        { en: "That's so cool!", jp: "それすごくかっこいい！" },
        { en: "I agree with you.", jp: "私も同感だよ。" },
        { en: "Tell me more about it!", jp: "もっと詳しく教えて！" }
      ];
    } else if (currentStep === 2) {
      samples = [
        { en: "I really love talking with you like this.", jp: "こうしてあなたとお話しするの本当に好き。" },
        { en: "That sounds like a wonderful idea!", jp: "それすごく素敵なアイディアだね！" },
        { en: "What should we do next time?", jp: "次は何しようか？" }
      ];
    } else {
      samples = [
        { en: "Hearing your voice always brightens up my whole day.", jp: "あなたの声を聞くと1日中元気になるよ。" },
        { en: "I'd love to know more about what you like to do.", jp: "あなたの好きなことについてもっと教えてほしいな。" },
        { en: "Whenever I'm with you, time just flies by so fast.", jp: "あなたと一緒にいると時間がすぐ過ぎちゃうね。" }
      ];
    }
  }

  samples.forEach(s => {
    const div = document.createElement('div');
    div.className = 'call-assist-item';
    div.innerHTML = `<strong>${s.en}</strong> <span style="font-size:0.75rem; color:#cbd5e1;">(${s.jp})</span>`;
    div.onclick = () => { setTranscribeText(s.en); };
    assistContainer.appendChild(div);
  });
}

  if (isCallMode) {

    updateCallAssistList(lastAIText);

    cardBox.classList.remove('call-mode');

function closeModal() {
  document.getElementById('oshi-modal').classList.remove('active');
  if (isCallMode) toggleCallMode();
  stopSpeech();
}

function initQuickPanel() {
  const catContainer = document.getElementById('quick-cats');
  catContainer.innerHTML = '';
  Object.keys(QUICK_DATA).forEach(key => {
    const cat = QUICK_DATA[key];
    const btn = document.createElement('div');
    btn.className = `cat-tab ${key === currentCat ? 'active' : ''}`;
    btn.innerText = cat.title;
    btn.onclick = (e) => selectCategory(key, e);
    catContainer.appendChild(btn);
  });
  renderPhrases();
}

function selectCategory(key, event) {
  currentCat = key;
  document.querySelectorAll('.cat-tab').forEach(tab => tab.classList.remove('active'));
  if (event && event.target) event.target.classList.add('active');
  renderPhrases();
}

function renderPhrases() {
  const list = document.getElementById('quick-phrase-list');
  list.innerHTML = '';
  const phrases = QUICK_DATA[currentCat].phrases;
  phrases.forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'quick-btn';
    btn.innerText = p.jp;
    btn.onclick = () => sendQuick(p.en, p.jp, currentCat);
    list.appendChild(btn);
  });
}

function toggleQuickPanel() {
  isQuickOpen = !isQuickOpen;
  const list = document.getElementById('quick-phrase-list');
  const cats = document.getElementById('quick-cats');
  const icon = document.getElementById('toggle-icon');
  if (isQuickOpen) {
    list.classList.add('open');
    cats.style.display = 'flex';
    icon.innerText = '▲';
  } else {
    list.classList.remove('open');
    cats.style.display = 'none';
    icon.innerText = '▼';
  }
}

function selectChar(key) {
  window.speechSynthesis.cancel();
  currentChar = key;
  const char = CHARS[key];
  document.querySelectorAll('.char-card').forEach(card => card.classList.remove('active'));
  document.getElementById(`card-${key}`).classList.add('active');
  document.documentElement.style.setProperty('--accent-color', char.color);
  setExpression('default');
  renderChatHistory();
}

function renderChatHistory() {
  const chatArea = document.getElementById('chat-area');
  chatArea.innerHTML = '';
  const callContainer = document.getElementById('call-dialog-container');
  if (callContainer) callContainer.innerHTML = '';

  const history = chatHistories[currentChar];
  if (!history || history.length == 0) {
    const char = CHARS[currentChar];
    addBubble('ai', char.greet, char.greetJp, `「${char.name}」との会話をスタートしよう！`, false, false, false);
  } else {
    history.forEach(item => {
      addBubble(item.sender, item.text, item.subText, item.tipText, false, false, false);
    });
  }
}

/* ③ 修正: 日本語訳がしっかり画面に表示される吹き出し生成 */
function addBubble(sender, text, subText = '', tipText = '', showPopup = true, save = true, autoSpeak = true) {
  const chatArea = document.getElementById('chat-area');
  const row = document.createElement('div');
  row.className = `msg-row ${sender}`;
  const char = CHARS[currentChar];
  
  // ② 自分のアイコンURLを適用
  const avatarUrl = sender === 'ai' ? (char.expressions[currentExpression] || char.expressions.default) : userIcon;
  
  if (sender === 'ai') {
    lastAIText = text;
    lastAIJpText = subText;
    updateCallAssistList(text);
  }
  
  row.innerHTML = `
    <img src="${avatarUrl}" onclick="openModal('${avatarUrl}', '${char.name}', '${text.replace(/'/g, "\\'")}', '${subText.replace(/'/g, "\\'")}')">
    <div class="bubble-container">
      <div class="bubble">${text}</div>
      ${subText ? `<span class="jp-sub">訳: ${subText}</span>` : ''}
      ${tipText ? `<div class="english-tip"><strong>${char.name}'s Tip:</strong> ${tipText}</div>` : ''}
      ${sender === 'ai' ? `<button class="replay-btn" onclick="speakText('${text.replace(/'/g, "\\'")}')">🔊 もう一度聞く</button>` : ''}
    </div>
  `;
  chatArea.appendChild(row);
  chatArea.scrollTop = chatArea.scrollHeight;

  // ③ 通話モード内のダイアログにも英語＋日本語訳をセットで追加
  const callContainer = document.getElementById('call-dialog-container');
  if (callContainer) {
    const callMsg = document.createElement('div');
    callMsg.className = `call-msg ${sender}`;
    callMsg.innerHTML = `
      <strong>${sender === 'ai' ? char.name : 'You'}:</strong> ${text}
      ${subText ? `<span class="call-msg-sub">(${subText})</span>` : ''}
    `;
    callContainer.appendChild(callMsg);
    callContainer.scrollTop = callContainer.scrollHeight;
  }

  if (save) {
    if (!chatHistories[currentChar]) chatHistories[currentChar] = [];
    chatHistories[currentChar].push({ sender, text, subText, tipText, time: Date.now() });
    saveHistories();
  }
  if (sender === 'ai' && autoSpeak) {
    speakText(text);
    if (showPopup && !isCallMode) openModal(avatarUrl, char.name, text, subText);
  }
}

function setTranscribeText(text) {
  document.getElementById('user-input').value = text;
  const preview = document.getElementById('call-transcribe-preview');
  if (preview) preview.innerText = text || '音声を入力してください...';
}

function clearSpeechText() {
  setTranscribeText('');
}

function setupSpeechRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) return;
  recognition = new SpeechRecognition();
  recognition.lang = 'en-US';
  recognition.interimResults = true;
  recognition.continuous = true;

  recognition.onstart = () => {
    isRecording = true;
    document.getElementById('mic-btn').classList.add('recording');
    const startBtn = document.getElementById('call-btn-start');
    const stopBtn = document.getElementById('call-btn-stop');
    if (startBtn) startBtn.style.display = 'none';
    if (stopBtn) stopBtn.style.display = 'block';
  };

  recognition.onresult = (event) => {
    let transcript = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      transcript += event.results[i][0].transcript;
    }
    if (transcript.trim()) {
      setTranscribeText(transcript);
      clearTimeout(silenceTimer);
      if (callSendMode === 'auto') {
        silenceTimer = setTimeout(() => {
          const currentVal = document.getElementById('user-input').value.trim();
          if (currentVal && isRecording) {
            stopSpeech();
            sendMessage();
          }
        }, 4000);
      }
    }
  };
  
  recognition.onerror = () => { stopSpeech(); };
  recognition.onend = () => { if (isRecording) stopSpeech(); };
}

function toggleSpeech() {
  if (!recognition) { alert("お使いのブラウザは音声入力に対応していません。"); return; }
  if (isRecording) stopSpeech();
  else {
    setTranscribeText('');
    try { recognition.start(); } catch (err) { stopSpeech(); }
  }
}

function stopSpeech() {
  isRecording = false;
  clearTimeout(silenceTimer);
  document.getElementById('mic-btn').classList.remove('recording');
  const startBtn = document.getElementById('call-btn-start');
  const stopBtn = document.getElementById('call-btn-stop');
  if (startBtn) startBtn.style.display = 'block';
  if (stopBtn) stopBtn.style.display = 'none';
  if (recognition) { try { recognition.stop(); } catch(e) {} }
}

function sendCallMessage() {
  stopSpeech();
  sendMessage();
}

async function sendMessage() {
  const input = document.getElementById('user-input');
  const text = input.value.trim();
  if (!text) return;

  const expr = detectExpression(text);
  setExpression(expr);
  // ③ 自分の発言にも簡易的に日本語訳テキストを表示
  addBubble('user', text, 'あなたが送信したメッセージ', '', false, true, false);
  setTranscribeText('');
  addLoveExp(15);
  await getAIReply(text);
}

function sendQuick(text, jpText = '', catKey = '') {
  window.speechSynthesis.cancel();
  const expr = detectExpression(text, catKey);
  setExpression(expr);
  addBubble('user', text, jpText, '', false, true, false);
  addLoveExp(10);
  setTimeout(async () => { await getAIReply(text); }, 400);
}

async function getAIReply(userText) {
  try {
    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ character: currentChar, message: userText, step: currentStep })
    });
    const data = await response.json();
    if (data.reply) {
      const aiExpr = detectExpression(data.reply);
      setExpression(aiExpr);
      addBubble('ai', data.reply, data.translation || '会話を楽しんでね！', data.tip || '', true, true, true);
    }
  } catch (e) {
    const fallbackExpr = detectExpression(userText);
    setExpression(fallbackExpr);
    addBubble('ai', "I loved hearing from you!", "言葉を聞けてすごく嬉しかったよ！", "「I loved hearing from you」で「連絡くれて嬉しかった」という意味だよ！", true, true, true);
  }
}

function speakText(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const uttr = new SpeechSynthesisUtterance(text);
  const char = CHARS[currentChar];
  uttr.lang = 'en-US';
  uttr.pitch = char.pitch;
  uttr.rate = char.rate;
  window.speechSynthesis.speak(uttr);
}

function replayCurrentModalVoice() { if (lastAIText) speakText(lastAIText); }

function saveHistories() { localStorage.setItem('oshitalk_histories', JSON.stringify(chatHistories)); }
function loadHistories() {
  const data = localStorage.getItem('oshitalk_histories');
  const days = parseInt(document.getElementById('history-retention').value || '7');
  if (data) {
    const parsed = JSON.parse(data);
    const now = Date.now();
    const cutoff = now - (days * 24 * 60 * 60 * 1000);
    Object.keys(parsed).forEach(k => { parsed[k] = parsed[k].filter(item => item.time > cutoff); });
    chatHistories = parsed;
  }
}
function saveHistorySetting() { loadHistories(); renderChatHistory(); }
function handleKey(e) { if (e.key === 'Enter') sendMessage(); }
