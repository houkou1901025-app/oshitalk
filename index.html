<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oshitalk English - 推し活×英会話</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.75);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-leo: #f59e0b;
            --accent-noah: #8b5cf6;
            --accent-liam: #10b981;
            --accent-color: var(--accent-leo);
        }

        body {
            margin: 0; padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color); color: var(--text-main);
            display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box;
        }

        .container {
            width: 100%; max-width: 480px; background: var(--card-bg);
            backdrop-filter: blur(12px); border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1); padding: 18px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); position: relative;
        }

        .header { text-align: center; margin-bottom: 10px; }
        .header h1 {
            margin: 0; font-size: 1.3rem; font-weight: 700;
            background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        /* キャラクター選択 */
        .char-selector { display: flex; gap: 8px; margin-bottom: 10px; }
        .char-card {
            flex: 1; background: rgba(15, 23, 42, 0.6);
            border: 2px solid transparent; border-radius: 16px;
            padding: 6px; text-align: center; cursor: pointer; transition: all 0.3s ease;
        }
        .char-card.active { border-color: var(--accent-color); background: rgba(255, 255, 255, 0.08); }
        .char-card img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255, 255, 255, 0.2); }
        .char-card .name { font-weight: 700; font-size: 0.8rem; }

        /* 設定バー（Step選択 & 履歴保存期間） */
        .control-panel {
            background: rgba(15, 23, 42, 0.5); border-radius: 12px; padding: 8px 12px;
            margin-bottom: 10px; display: flex; flex-direction: column; gap: 6px; font-size: 0.75rem;
        }
        .control-row { display: flex; justify-content: space-between; align-items: center; }
        .step-btns { display: flex; gap: 4px; }
        .step-btn {
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff; padding: 2px 8px; border-radius: 10px; cursor: pointer; font-size: 0.7rem;
        }
        .step-btn.active { background: var(--accent-color); color: #0f172a; font-weight: bold; }
        select { background: #1e293b; color: #fff; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; padding: 2px 4px; }

        /* チャットエリア */
        .chat-area { height: 260px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; padding-right: 4px; }
        .msg-row { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
        .msg-row.user { flex-direction: row-reverse; }
        .msg-row img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
        .bubble-container { max-width: 80%; display: flex; flex-direction: column; gap: 3px; }
        .bubble { padding: 8px 12px; border-radius: 14px; font-size: 0.85rem; line-height: 1.4; }
        .msg-row.ai .bubble { background: rgba(255, 255, 255, 0.1); border-top-left-radius: 2px; }
        .msg-row.user .bubble { background: var(--accent-color); color: #0f172a; font-weight: 600; border-top-right-radius: 2px; }
        .jp-sub { font-size: 0.73rem; color: #cbd5e1; margin-top: 2px; }
        .english-tip { font-size: 0.72rem; background: rgba(0, 0, 0, 0.35); border-left: 3px solid var(--accent-color); padding: 6px 8px; border-radius: 0 6px 6px 0; color: #e2e8f0; margin-top: 3px; }

        /* クイックアクション */
        .quick-actions { display: flex; gap: 6px; margin-bottom: 10px; overflow-x: auto; padding-bottom: 4px; }
        .quick-btn { background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.12); color: var(--text-main); padding: 5px 10px; border-radius: 14px; font-size: 0.75rem; white-space: nowrap; cursor: pointer; }

        /* 入力エリア */
        .input-area { display: flex; gap: 6px; }
        .input-area input { flex: 1; background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 18px; padding: 8px 14px; color: #fff; font-size: 0.85rem; outline: none; }
        .btn { background: var(--accent-color); border: none; color: #0f172a; font-weight: bold; padding: 0 14px; border-radius: 18px; cursor: pointer; }
        .btn-mic { background: rgba(255, 255, 255, 0.1); color: #fff; border: 1px solid rgba(255, 255, 255, 0.2); width: 38px; }
        .btn-mic.recording { background: #ef4444; animation: pulse 1s infinite; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* Popup モーダル */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; z-index: 999; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-card { width: 85%; max-width: 320px; background: rgba(30, 41, 59, 0.95); border: 2px solid var(--accent-color); border-radius: 20px; padding: 18px; text-align: center; }
        .modal-card img { width: 130px; height: 130px; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent-color); margin-bottom: 10px; }
        .modal-name { font-size: 1rem; font-weight: bold; color: var(--accent-color); margin-bottom: 6px; }
        .modal-text-en { font-size: 0.9rem; font-weight: 600; line-height: 1.3; margin-bottom: 4px; }
        .modal-text-jp { font-size: 0.78rem; color: #cbd5e1; margin-bottom: 12px; }
        .modal-close-btn { background: var(--accent-color); color: #0f172a; border: none; padding: 6px 20px; border-radius: 16px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Oshitalk English</h1>
    </div>

    <div class="char-selector">
        <div class="char-card active" onclick="selectChar('leo')" id="card-leo">
            <img src="leo.jpg" alt="Leo"><div class="name">Leo</div>
        </div>
        <div class="char-card" onclick="selectChar('noah')" id="card-noah">
            <img src="noah.jpg" alt="Noah"><div class="name">Noah</div>
        </div>
        <div class="char-card" onclick="selectChar('liam')" id="card-liam">
            <img src="liam.jpg" alt="Liam"><div class="name">Liam</div>
        </div>
    </div>

    <!-- コントロールパネル -->
    <div class="control-panel">
        <div class="control-row">
            <span>📈 会話ステップ:</span>
            <div class="step-btns">
                <button class="step-btn" id="step-1" onclick="setStep(1)">Step 1 (初級)</button>
                <button class="step-btn active" id="step-2" onclick="setStep(2)">Step 2 (中級)</button>
                <button class="step-btn" id="step-3" onclick="setStep(3)">Step 3 (長文)</button>
            </div>
        </div>
        <div class="control-row">
            <span>💾 履歴保存期間:</span>
            <select id="history-retention" onchange="saveHistorySetting(this.value)">
                <option value="1">1日間保存</option>
                <option value="7" selected>1週間保存</option>
                <option value="999">無制限に保持</option>
            </select>
        </div>
    </div>

    <div class="chat-area" id="chat-area"></div>

    <div class="quick-actions">
        <button class="quick-btn" onclick="sendQuick('Good morning!')">☀️ 朝の挨拶</button>
        <button class="quick-btn" onclick="sendQuick('How was your day?')">💬 今日どうだった？</button>
        <button class="quick-btn" onclick="sendQuick('I missed you so much!')">💖 逢いたかった！</button>
        <button class="quick-btn" onclick="sendQuick('Can you encourage me?')">🥺 励まして！</button>
        <button class="quick-btn" onclick="sendQuick('I did my best today!')">🔥 今日がんばったよ！</button>
    </div>

    <div class="input-area">
        <button class="btn btn-mic" id="mic-btn" onclick="toggleSpeech()">🎤</button>
        <input type="text" id="user-input" placeholder="英語でメッセージを入力..." onkeypress="handleKey(event)">
        <button class="btn" onclick="sendMessage()">送信</button>
    </div>
</div>

<!-- 推しモーダル Popup -->
<div class="modal-overlay" id="oshi-modal" onclick="closeModal()">
    <div class="modal-card" onclick="event.stopPropagation()">
        <img id="modal-img" src="leo.jpg" alt="Oshi">
        <div class="modal-name" id="modal-name">Leo</div>
        <div class="modal-text-en" id="modal-text-en"></div>
        <div class="modal-text-jp" id="modal-text-jp"></div>
        <button class="modal-close-btn" onclick="closeModal()">閉じる</button>
    </div>
</div>

<script>
    // キャラクター定義 (Leoのピッチを1.05に上げて声を若返らせました)
    const CHARS = {
        leo: { name: 'Leo', avatar: 'leo.jpg', color: '#f59e0b', pitch: 1.05, rate: 0.95, greet: 'Good morning, sweetheart. I was thinking about you.', greetJp: 'おはよう。君のことを考えていたよ。' },
        noah: { name: 'Noah', avatar: 'noah.jpg', color: '#8b5cf6', pitch: 0.9, rate: 1.0, greet: 'You\'re here. So, what do you want to talk about today?', greetJp: '来たんだ。で、今日は何を話すの？' },
        liam: { name: 'Liam', avatar: 'liam.jpg', color: '#10b981', pitch: 1.2, rate: 1.05, greet: 'Hey! I\'m so happy to talk with you today!', greetJp: 'ねえねえ！今日もお話しできてすごく嬉しいよ！' }
    };

    let currentChar = 'leo';
    let currentStep = 2;
    let chatHistories = { leo: [], noah: [], liam: [] };
    let isRecording = false;
    let recognition = null;

    window.onload = () => {
        loadHistories();
        selectChar('leo');
        setupSpeechRecognition();
    };

    function setStep(s) {
        currentStep = s;
        document.querySelectorAll('.step-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`step-${s}`).classList.add('active');
    }

    function selectChar(key) {
        currentChar = key;
        const char = CHARS[key];
        document.querySelectorAll('.char-card').forEach(card => card.classList.remove('active'));
        document.getElementById(`card-${key}`).classList.add('active');
        document.documentElement.style.setProperty('--accent-color', char.color);

        renderChatHistory();
    }

    function renderChatHistory() {
        const chatArea = document.getElementById('chat-area');
        chatArea.innerHTML = '';
        const history = chatHistories[currentChar];

        if (!history || history.length === 0) {
            const char = CHARS[currentChar];
            addBubble('ai', char.greet, char.greetJp, `「${char.name}」との会話をスタートしよう！`, false, false);
        } else {
            history.forEach(item => {
                addBubble(item.sender, item.text, item.subText, item.tipText, false, false);
            });
        }
    }

    function addBubble(sender, text, subText = '', tipText = '', showPopup = true, save = true) {
        const chatArea = document.getElementById('chat-area');
        const row = document.createElement('div');
        row.className = `msg-row ${sender}`;
        const char = CHARS[currentChar];
        const avatarUrl = sender === 'ai' ? char.avatar : 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop';

        row.innerHTML = `
            <img src="${avatarUrl}">
            <div class="bubble-container">
                <div class="bubble">${text}</div>
                ${subText ? `<span class="jp-sub">${subText}</span>` : ''}
                ${tipText ? `<div class="english-tip">💡 <strong>${char.name}'s Tip:</strong> ${tipText}</div>` : ''}
            </div>
        `;

        row.onclick = () => openModal(char.avatar, char.name, text, subText);
        chatArea.appendChild(row);
        chatArea.scrollTop = chatArea.scrollHeight;

        if (save) {
            if (!chatHistories[currentChar]) chatHistories[currentChar] = [];
            chatHistories[currentChar].push({ sender, text, subText, tipText, time: Date.now() });
            saveHistories();
        }

        if (sender === 'ai') {
            speakText(text);
            if (showPopup) openModal(char.avatar, char.name, text, subText);
        }
    }

    // 🌟 音声入力 (Speech Recognition) 設定
    function setupSpeechRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            console.warn("Speech Recognition not supported in this browser.");
            return;
        }
        recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.interimResults = false;

        recognition.onstart = () => {
            isRecording = true;
            document.getElementById('mic-btn').classList.add('recording');
        };

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            document.getElementById('user-input').value = transcript;
            stopSpeech();
            sendMessage();
        };

        recognition.onerror = () => stopSpeech();
        recognition.onend = () => stopSpeech();
    }

    function toggleSpeech() {
        if (!recognition) {
            alert("お使いのブラウザは音声入力に対応していません。(ChromeやSafariでお試しください)");
            return;
        }
        if (isRecording) stopSpeech();
        else recognition.start();
    }

    function stopSpeech() {
        isRecording = false;
        document.getElementById('mic-btn').classList.remove('recording');
        if (recognition) recognition.stop();
    }

    async function sendMessage() {
        const input = document.getElementById('user-input');
        const text = input.value.trim();
        if (!text) return;
        addBubble('user', text, '', '', false, true);
        input.value = '';
        await getAIReply(text);
    }

    function sendQuick(text) {
        window.speechSynthesis.cancel();
        addBubble('user', text, '', '', false, true);
        setTimeout(async () => { await getAIReply(text); }, 400);
    }

    async function getAIReply(userText) {
        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ character: currentChar, message: userText, step: currentStep })
            });
            const data = await response.json();
            if (data.reply) {
                addBubble('ai', data.reply, data.translation || '', data.tip || '', true, true);
            }
        } catch (e) {
            addBubble('ai', "I loved hearing from you!", "君からの言葉、すごく嬉しかったよ！", "【解説】「I loved hearing from you」で「あなたから連絡/言葉をもらえて嬉しかった」という意味になります！", true, true);
        }
    }

    function speakText(text) {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const uttr = new SpeechSynthesisUtterance(text);
        const char = CHARS[currentChar];
        uttr.lang = 'en-US'; uttr.pitch = char.pitch; uttr.rate = char.rate;
        window.speechSynthesis.speak(uttr);
    }

    function openModal(imgSrc, name, enText, jpText) {
        document.getElementById('modal-img').src = imgSrc;
        document.getElementById('modal-name').innerText = name;
        document.getElementById('modal-text-en').innerText = enText;
        document.getElementById('modal-text-jp').innerText = jpText || '';
        document.getElementById('oshi-modal').classList.add('active');
    }

    function closeModal() { document.getElementById('oshi-modal').classList.remove('active'); }

    function saveHistories() { localStorage.setItem('oshitalk_histories', JSON.stringify(chatHistories)); }

    function loadHistories() {
        const data = localStorage.getItem('oshitalk_histories');
        const days = parseInt(document.getElementById('history-retention').value || '7');
        if (data) {
            const parsed = JSON.parse(data);
            const now = Date.now();
            const cutoff = now - (days * 24 * 60 * 60 * 1000);

            // 期限切れデータのフィルタリング
            Object.keys(parsed).forEach(k => {
                parsed[k] = parsed[k].filter(item => item.time > cutoff);
            });
            chatHistories = parsed;
        }
    }

    function saveHistorySetting(val) { loadHistories(); renderChatHistory(); }
    function handleKey(e) { if (e.key === 'Enter') sendMessage(); }
</script>
</body>
</html>
