<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oshitalk English - 推し活×英会話</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.75);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-leo: #f59e0b;
            --accent-noah: #8b5cf6;
            --accent-liam: #10b981;
            --accent-color: var(--accent-leo);
        }

        body {
            margin: 0; padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color); color: var(--text-main);
            display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box;
        }

        .container {
            width: 100%; max-width: 480px; background: var(--card-bg);
            backdrop-filter: blur(12px); border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1); padding: 18px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); position: relative;
        }

        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 10px; 
        }
        .header h1 {
            margin: 0; font-size: 1.3rem; font-weight: 700;
            background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .btn-call-trigger {
            background: #2ed573; color: #fff; border: none;
            padding: 6px 12px; border-radius: 18px; font-size: 0.75rem;
            font-weight: bold; cursor: pointer;
            box-shadow: 0 2px 8px rgba(46, 213, 115, 0.4); transition: transform 0.2s;
        }
        .btn-call-trigger:active { transform: scale(0.95); }

        /* キャラクター選択 */
        .char-selector { display: flex; gap: 8px; margin-bottom: 10px; }
        .char-card {
            flex: 1; background: rgba(15, 23, 42, 0.6);
            border: 2px solid transparent; border-radius: 16px;
            padding: 6px; text-align: center; cursor: pointer; transition: all 0.3s ease;
        }
        .char-card.active { border-color: var(--accent-color); background: rgba(255, 255, 255, 0.08); }
        .char-card img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255, 255, 255, 0.2); }
        .char-card .name { font-weight: 700; font-size: 0.8rem; }

        /* コントロールパネル */
        .control-panel {
            background: rgba(15, 23, 42, 0.5); border-radius: 12px; padding: 8px 12px;
            margin-bottom: 10px; display: flex; flex-direction: column; gap: 6px; font-size: 0.75rem;
        }
        .control-row { display: flex; justify-content: space-between; align-items: center; }
        .step-btns { display: flex; gap: 4px; }
        .step-btn {
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff; padding: 2px 8px; border-radius: 10px; cursor: pointer; font-size: 0.7rem;
        }
        .step-btn.active { background: var(--accent-color); color: #0f172a; font-weight: bold; }
        select { background: #1e293b; color: #fff; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; padding: 2px 4px; }

        /* チャットエリア */
        .chat-area { height: 240px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; padding-right: 4px; scroll-behavior: smooth; }
        .msg-row { display: flex; gap: 8px; align-items: flex-start; }
        .msg-row.user { flex-direction: row-reverse; }
        .msg-row img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; flex-shrink: 0; cursor: pointer; }
        .bubble-container { max-width: 80%; display: flex; flex-direction: column; gap: 3px; }
        .bubble { padding: 8px 12px; border-radius: 14px; font-size: 0.85rem; line-height: 1.4; }
        .msg-row.ai .bubble { background: rgba(255, 255, 255, 0.1); border-top-left-radius: 2px; }
        .msg-row.user .bubble { background: var(--accent-color); color: #0f172a; font-weight: 600; border-top-right-radius: 2px; }
        .jp-sub { font-size: 0.73rem; color: #cbd5e1; margin-top: 2px; }
        .english-tip { font-size: 0.72rem; background: rgba(0, 0, 0, 0.35); border-left: 3px solid var(--accent-color); padding: 6px 8px; border-radius: 0 6px 6px 0; color: #e2e8f0; margin-top: 3px; }

        .replay-btn {
            align-self: flex-start; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff; border-radius: 12px; padding: 2px 8px; font-size: 0.68rem; cursor: pointer; margin-top: 2px; display: flex; align-items: center; gap: 4px;
        }

        /* クイックフレーズ */
        .quick-toggle-container { margin-bottom: 10px; background: rgba(15, 23, 42, 0.6); border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); overflow: hidden; }
        .quick-toggle-header {
            padding: 8px 12px; font-size: 0.75rem; font-weight: bold; background: rgba(255, 255, 255, 0.05);
            display: flex; justify-content: space-between; align-items: center; cursor: pointer; color: var(--accent-color);
        }
        .quick-categories { display: flex; gap: 4px; overflow-x: auto; padding: 6px; scrollbar-width: none; background: rgba(0,0,0,0.2); }
        .quick-categories::-webkit-scrollbar { display: none; }
        .cat-tab {
            padding: 3px 8px; border-radius: 10px; font-size: 0.7rem; white-space: nowrap; cursor: pointer;
            background: rgba(255, 255, 255, 0.08); color: var(--text-main); border: 1px solid transparent;
        }
        .cat-tab.active { background: var(--accent-color); color: #0f172a; font-weight: bold; }

        .quick-phrase-list {
            display: none; padding: 8px; gap: 6px; overflow-x: auto; scrollbar-width: none;
            background: rgba(15, 23, 42, 0.8); border-top: 1px solid rgba(255,255,255,0.05);
        }
        .quick-phrase-list.open { display: flex; }
        .quick-btn {
            background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15); color: var(--text-main);
            padding: 5px 10px; border-radius: 14px; font-size: 0.72rem; white-space: nowrap; cursor: pointer; flex-shrink: 0;
        }
        .quick-btn:hover { background: rgba(255, 255, 255, 0.15); }

        /* 入力エリア */
        .input-area { display: flex; gap: 6px; }
        .input-area input { flex: 1; background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 18px; padding: 8px 14px; color: #fff; font-size: 0.85rem; outline: none; }
        .btn { background: var(--accent-color); border: none; color: #0f172a; font-weight: bold; padding: 0 14px; border-radius: 18px; cursor: pointer; }
        .btn-mic { background: rgba(255, 255, 255, 0.1); color: #fff; border: 1px solid rgba(255, 255, 255, 0.2); width: 38px; }
        .btn-mic.recording { background: #ef4444; animation: pulse 1s infinite; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* モーダル Popup */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(12px);
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease; z-index: 999;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal-card {
            width: 85%; max-width: 320px; background: rgba(30, 41, 59, 0.95);
            border: 2px solid var(--accent-color); border-radius: 20px; padding: 20px;
            text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8); transition: all 0.3s ease;
        }
        .modal-card img { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent-color); margin-bottom: 10px; }
        .modal-name { font-size: 1.1rem; font-weight: bold; color: var(--accent-color); margin-bottom: 6px; }
        .modal-text-en { font-size: 0.95rem; font-weight: 600; line-height: 1.4; margin-bottom: 6px; }
        .modal-text-jp { font-size: 0.8rem; color: #cbd5e1; margin-bottom: 14px; }
        .modal-btns { display: flex; gap: 8px; justify-content: center; }
        .modal-btn { background: var(--accent-color); color: #0f172a; border: none; padding: 8px 18px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 0.8rem; }
        .modal-btn.sec { background: rgba(255,255,255,0.15); color: #fff; }

        /* =======================================
           📞 通話モード（改良版）
        ======================================= */
        .call-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(180deg, #0f172a 0%, #0284c7 100%);
            z-index: 1000;
            flex-direction: column;
            justify-content: space-between;
            padding: 12px 16px;
            box-sizing: border-box;
            color: white;
        }
        .call-modal.active { display: flex; }

        .call-header { text-align: center; }
        .call-timer { font-size: 12px; color: #38bdf8; font-weight: bold; }

        /* ②通話モードのアイコン（直径3cm = 約80px に変更） */
        .call-avatar-wrap { text-align: center; margin: 2px 0; }
        .call-avatar {
            width: 80px; height: 80px;
            border-radius: 50%;
            border: 3px solid var(--accent-color);
            box-shadow: 0 0 15px var(--accent-color);
            object-fit: cover;
        }

        /* 通話中の履歴表示 */
        .call-chat-history {
            flex: 1;
            max-height: 25vh;
            overflow-y: auto;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 12px;
            padding: 8px;
            margin: 4px 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
            scroll-behavior: smooth;
        }

        /* 💡 返事Hint エリア */
        .call-hint-box {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid var(--accent-color);
            border-radius: 12px;
            padding: 6px 10px;
            margin-bottom: 4px;
        }
        .call-hint-title {
            font-size: 0.7rem; font-weight: bold; color: var(--accent-color);
            margin-bottom: 4px; display: flex; justify-content: space-between; align-items: center;
        }
        .call-hint-list { display: flex; flex-direction: column; gap: 4px; }
        .call-hint-item {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px; padding: 4px 8px;
            font-size: 0.73rem; cursor: pointer; text-align: left;
            transition: background 0.2s; display: flex; justify-content: space-between; align-items: center;
        }
        .call-hint-item:hover { background: rgba(255, 255, 255, 0.2); }
        .call-hint-en { font-weight: 600; color: #fff; }
        .call-hint-jp { font-size: 0.65rem; color: #cbd5e1; }

        /* ⑤通話モード内の専用テキスト入力＆文字起こし欄 */
        .call-input-container {
            display: flex; gap: 6px; margin-bottom: 6px;
        }
        .call-input-container input {
            flex: 1; background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--accent-color); border-radius: 16px;
            padding: 8px 12px; color: #fff; font-size: 0.8rem; outline: none;
        }

        /* ④送信モード切替スイッチ */
        .mode-toggle-btn {
            font-size: 0.68rem; padding: 2px 6px; border-radius: 8px;
            background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255,255,255,0.3);
            color: #fff; cursor: pointer;
        }

        .call-controls { display: flex; flex-direction: column; gap: 4px; }
        .call-btn-row { display: flex; gap: 4px; }
        .call-btn {
            flex: 1; padding: 8px 4px; border: none; border-radius: 10px;
            font-size: 11px; font-weight: bold; cursor: pointer; text-align: center;
        }

        .btn-voice { background-color: #10b981; color: white; }
        .btn-clear { background-color: #64748b; color: white; }
        .btn-call-send { background-color: #2563eb; color: white; }
        .btn-repeat { background-color: #3b82f6; color: white; }
        .btn-normal { background-color: #06b6d4; color: white; }
        .btn-hangup { background-color: #ef4444; color: white; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Oshitalk English</h1>
        <button class="btn-call-trigger" onclick="startCallMode()">📞 通話モード</button>
    </div>

    <div class="char-selector">
        <div class="char-card active" onclick="selectChar('leo')" id="card-leo">
            <img src="leo.jpg" alt="Leo"><div class="name">Leo</div>
        </div>
        <div class="char-card" onclick="selectChar('noah')" id="card-noah">
            <img src="noah.jpg" alt="Noah"><div class="name">Noah</div>
        </div>
        <div class="char-card" onclick="selectChar('liam')" id="card-liam">
            <img src="liam.jpg" alt="Liam"><div class="name">Liam</div>
        </div>
    </div>

    <div class="control-panel">
        <div class="control-row">
            <span>📈 会話ステップ:</span>
            <div class="step-btns">
                <button class="step-btn" id="step-1" onclick="setStep(1)">Step 1 (初級)</button>
                <button class="step-btn active" id="step-2" onclick="setStep(2)">Step 2 (中級)</button>
                <button class="step-btn" id="step-3" onclick="setStep(3)">Step 3 (長文)</button>
            </div>
        </div>
        <div class="control-row">
            <span>💾 履歴保存期間:</span>
            <select id="history-retention" onchange="saveHistorySetting(this.value)">
                <option value="1">1日間保存</option>
                <option value="7" selected>1週間保存</option>
                <option value="999">無制限に保持</option>
            </select>
        </div>
    </div>

    <div class="chat-area" id="chat-area"></div>

    <div class="quick-toggle-container">
        <div class="quick-toggle-header" onclick="toggleQuickPanel()">
            <span>💬 トピック別クイック発言</span>
            <span id="toggle-icon">▲</span>
        </div>
        <div class="quick-categories" id="quick-cats"></div>
        <div class="quick-phrase-list open" id="quick-phrase-list"></div>
    </div>

    <div class="input-area">
        <button class="btn btn-mic" id="mic-btn" onclick="toggleSpeech('normal')">🎤</button>
        <input type="text" id="user-input" placeholder="英語でメッセージを入力..." onkeypress="handleKey(event, 'normal')">
        <button class="btn" onclick="sendMessage('normal')">送信</button>
    </div>
</div>

<!-- モーダル Popup -->
<div class="modal-overlay premium" id="oshi-modal" onclick="closeModal()">
    <div class="modal-card" onclick="event.stopPropagation()">
        <img id="modal-img" src="leo.jpg" alt="Oshi">
        <div class="modal-name" id="modal-name">Leo</div>
        <div class="modal-text-en" id="modal-text-en"></div>
        <div class="modal-text-jp" id="modal-text-jp"></div>
        <div class="modal-btns">
            <button class="modal-btn sec" onclick="replayCurrentModalVoice()">🔊 もう一度聞く</button>
            <button class="modal-btn" onclick="closeModal()">閉じる</button>
        </div>
    </div>
</div>

<!-- 📞 通話モード Modal (完全改良版) -->
<div class="call-modal" id="callModal">
    <div class="call-header">
        <h2 id="callCharName" style="margin: 0; font-size: 1.1rem;">Leo</h2>
        <div class="call-timer" id="callTimer">📞 通話中... 00:00</div>
    </div>
    
    <!-- ②直径3cm（80px）の推しアイコン -->
    <div class="call-avatar-wrap">
        <img src="leo.jpg" id="callAvatarImg" class="call-avatar" alt="Call Avatar">
    </div>

    <!-- ③文脈の繋がる通話チャット履歴 -->
    <div class="call-chat-history" id="callChatHistory"></div>

    <!-- 💡⑥返事Hint (動的生成) -->
    <div class="call-hint-box">
        <div class="call-hint-title">
            <span>💡 返事Hint（タップで送信）</span>
            <!-- ④送信モード切り替え -->
            <button class="mode-toggle-btn" id="autoSendToggleBtn" onclick="toggleAutoSendMode()">モード: ⚡️ 4秒自動送信</button>
        </div>
        <div class="call-hint-list" id="callHintList"></div>
    </div>

    <!-- ⑤通話モード内 専用テキスト入力・文字起こし欄 -->
    <div class="call-input-container">
        <input type="text" id="call-user-input" placeholder="音声認識テキスト/入力..." onkeypress="handleKey(event, 'call')">
    </div>

    <!-- 操作ボタン群 -->
    <div class="call-controls">
        <div class="call-btn-row">
            <button class="call-btn btn-voice" id="call-mic-btn" onclick="toggleSpeech('call')">🎤 音声入力</button>
            <button class="call-btn btn-clear" onclick="clearCallInput()">🗑 削除</button>
            <button class="call-btn btn-call-send" onclick="sendMessage('call')">📩 送信</button>
        </div>
        <div class="call-btn-row">
            <button class="call-btn btn-repeat" onclick="replayCurrentModalVoice()">🔊 もう一度聞く</button>
            <button class="call-btn btn-normal" onclick="endCallMode()">通常表示に戻す</button>
            <button class="call-btn btn-hangup" onclick="endCallMode()">切断して閉じる</button>
        </div>
    </div>
</div>

<script>
    const CHARS = {
        leo: { name: 'Leo', avatar: 'leo.jpg', color: '#f59e0b', pitch: 0.75, rate: 0.95, greet: 'Good morning, sweetheart. I was thinking about you.', greetJp: 'おはよう。今日も君に会えて嬉しいよ。' },
        noah: { name: 'Noah', avatar: 'noah.jpg', color: '#8b5cf6', pitch: 0.6, rate: 0.9, greet: 'You\'re here. So, what do you want to talk about today?', greetJp: '来たんだ。で、今日は何話すの？' },
        liam: { name: 'Liam', avatar: 'liam.jpg', color: '#10b981', pitch: 0.85, rate: 1.0, greet: 'Hey! I\'m so happy to talk with you today!', greetJp: 'やっほー！今日もお喋りできてめっちゃ嬉しい！' }
    };

    const QUICK_DATA = {
        life: {
            title: '🏠 生活',
            phrases: [
                { en: "Good morning!", jp: "☀️ 朝の挨拶" },
                { en: "I just woke up.", jp: "🥱 今起きたよ" },
                { en: "It's raining today.", jp: "☔ 今日は雨が降ってる" },
                { en: "I'm cleaning my room.", jp: "🧹 部屋の掃除をしてる" },
                { en: "I need to go grocery shopping.", jp: "🛒 お買い物に行かなきゃ" },
                { en: "I'm going to take a bath.", jp: "🛁 お風呂に入ってくるね" },
                { en: "What are your plans for tonight?", jp: "🌙 今夜の予定は？" },
                { en: "I'm so sleepy now.", jp: "😴 すごく眠いよ" },
                { en: "I'm staying home today.", jp: "🏠 今日はおうちで過ごすよ" },
                { en: "Good night, sweet dreams!", jp: "💤 おやすみ、良い夢を" }
            ]
        },
        work: {
            title: '💼 仕事',
            phrases: [
                { en: "I have a lot of work today.", jp: "💻 今日は仕事が山積み" },
                { en: "Finally finished my work!", jp: "🎉 やっと仕事が終わった！" },
                { en: "I'm taking a coffee break.", jp: "☕ コーヒー休憩中" },
                { en: "I have a meeting now.", jp: "📅 今から会議だよ" },
                { en: "I worked overtime today.", jp: "🌙 今日は残業だったよ" },
                { en: "Wish me luck on my presentation!", jp: "🔥 発表応援してね！" },
                { en: "I'm so busy this week.", jp: "💦 今週はすごく忙しい" },
                { en: "Tomorrow is my day off!", jp: "✨ 明日はお休み！" },
                { en: "My boss praised me today!", jp: "👏 今日上司に褒められた！" },
                { en: "I did my best at work!", jp: "🌟 お仕事頑張ったよ！" }
            ]
        },
        feeling: {
            title: '💖 感情',
            phrases: [
                { en: "I missed you so much!", jp: "💖 すごく会いたかったよ！" },
                { en: "I love talking with you!", jp: "🎨 あなたと話すのが大好き" },
                { en: "Praise me please!", jp: "🍰 褒めてほしいな！" },
                { en: "You always make me happy.", jp: "🥰 いつも幸せにしてくれるね" },
                { en: "I was thinking about you all day.", jp: "💭 1日中あなたのこと考えてた" },
                { en: "I'm so lucky to have you.", jp: "✨ あなたに会えて幸運だよ" },
                { en: "Your smile is the best!", jp: "😊 あなたの笑顔が1番！" },
                { en: "I want to stay with you forever.", jp: "💍 ずっと一緒にいたいな" },
                { en: "You mean everything to me.", jp: "🌟 私の全てだよ" },
                { en: "I love you so much!", jp: "❤️ 大大好きだよ！" }
            ]
        }
    };

    let currentChar = 'leo';
    let currentStep = 2;
    let currentCat = 'life';
    let isQuickOpen = true;
    let chatHistories = { leo: [], noah: [], liam: [] };
    let isRecording = false;
    let recognition = null;
    let silenceTimer = null;
    let lastAIText = '';
    let activeInputSource = 'normal'; // 'normal' または 'call'

    // ④自動送信モード（デフォルト：true = 4秒後自動送信）
    let isAutoSendMode = true;

    // 通話タイマー
    let callTimerInterval = null;
    let secondsElapsed = 0;

    window.onload = () => {
        loadHistories();
        selectChar('leo');
        setupSpeechRecognition();
        initQuickPanel();
    };

    function initQuickPanel() {
        const catContainer = document.getElementById('quick-cats');
        catContainer.innerHTML = '';
        Object.keys(QUICK_DATA).forEach(key => {
            const cat = QUICK_DATA[key];
            const btn = document.createElement('div');
            btn.className = `cat-tab ${key === currentCat ? 'active' : ''}`;
            btn.innerText = cat.title;
            btn.onclick = (e) => selectCategory(key, e);
            catContainer.appendChild(btn);
        });
        renderPhrases();
    }

    function selectCategory(key, event) {
        currentCat = key;
        document.querySelectorAll('.cat-tab').forEach(tab => tab.classList.remove('active'));
        if (event && event.target) event.target.classList.add('active');
        renderPhrases();
    }

    function renderPhrases() {
        const list = document.getElementById('quick-phrase-list');
        list.innerHTML = '';
        const phrases = QUICK_DATA[currentCat].phrases;
        phrases.forEach(p => {
            const btn = document.createElement('button');
            btn.className = 'quick-btn';
            btn.innerText = p.jp;
            btn.onclick = () => sendQuick(p.en);
            list.appendChild(btn);
        });
    }

    function toggleQuickPanel() {
        isQuickOpen = !isQuickOpen;
        const list = document.getElementById('quick-phrase-list');
        const cats = document.getElementById('quick-cats');
        const icon = document.getElementById('toggle-icon');
        if (isQuickOpen) {
            list.classList.add('open');
            cats.style.display = 'flex';
            icon.innerText = '▲';
        } else {
            list.classList.remove('open');
            cats.style.display = 'none';
            icon.innerText = '▼';
        }
    }

    function setStep(s) {
        currentStep = s;
        document.querySelectorAll('.step-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`step-${s}`).classList.add('active');
        updateCallHints(lastAIText);
    }

    function selectChar(key) {
        window.speechSynthesis.cancel();
        currentChar = key;
        const char = CHARS[key];
        document.querySelectorAll('.char-card').forEach(card => card.classList.remove('active'));
        document.getElementById(`card-${key}`).classList.add('active');
        document.documentElement.style.setProperty('--accent-color', char.color);
        renderChatHistory();

        document.getElementById('callCharName').innerText = char.name;
        document.getElementById('callAvatarImg').src = char.avatar;
    }

    function renderChatHistory() {
        const chatArea = document.getElementById('chat-area');
        chatArea.innerHTML = '';
        const history = chatHistories[currentChar];

        if (!history || history.length === 0) {
            const char = CHARS[currentChar];
            // ①英語学習に役立つTipに変更
            const initialTip = "【Tip】「thinking about you」は「君のことを思っていたよ」という愛情を伝える定番表現だよ！";
            addBubble('ai', char.greet, char.greetJp, initialTip, false, false, false);
        } else {
            history.forEach(item => {
                addBubble(item.sender, item.text, item.subText, item.tipText, false, false, false);
            });
        }
    }

    function addBubble(sender, text, subText = '', tipText = '', showPopup = true, save = true, autoSpeak = true) {
        const chatArea = document.getElementById('chat-area');
        const row = document.createElement('div');
        row.className = `msg-row ${sender}`;
        const char = CHARS[currentChar];
        const avatarUrl = sender === 'ai' ? char.avatar : 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop';

        const isAI = sender === 'ai';
        if (isAI) lastAIText = text;

        row.innerHTML = `
            <img src="${avatarUrl}" onclick="openModal('${char.avatar}', '${char.name}', '${text}', '${subText}')">
            <div class="bubble-container">
                <div class="bubble">${text}</div>
                ${subText ? `<span class="jp-sub">${subText}</span>` : ''}
                ${tipText ? `<div class="english-tip">💡 <strong>${char.name}'s Tip:</strong> ${tipText}</div>` : ''}
                ${isAI ? `<button class="replay-btn" onclick="speakText('${text.replace(/'/g, "\\'")}')">🔊 もう一度聞く</button>` : ''}
            </div>
        `;

        chatArea.appendChild(row);
        scrollToBottom();

        if (save) {
            if (!chatHistories[currentChar]) chatHistories[currentChar] = [];
            chatHistories[currentChar].push({ sender, text, subText, tipText, time: Date.now() });
            saveHistories();
        }

        if (isAI) {
            if (autoSpeak) speakText(text);
            if (showPopup && !document.getElementById('callModal').classList.contains('active')) {
                openModal(char.avatar, char.name, text, subText);
            }
            updateCallHints(text);
        }
    }

    function scrollToBottom() {
        const chatArea = document.getElementById('chat-area');
        const callChatHistory = document.getElementById('callChatHistory');
        if (chatArea) chatArea.scrollTop = chatArea.scrollHeight;
        if (callChatHistory) {
            callChatHistory.innerHTML = chatArea.innerHTML;
            callChatHistory.scrollTop = callChatHistory.scrollHeight;
        }
    }

    /* 💡⑥文脈に応じた返事Hint（3文）の動的生成 */
    function updateCallHints(aiMsg = '') {
        const hintList = document.getElementById('callHintList');
        if (!hintList) return;

        let hints = [];
        const lowerMsg = aiMsg.toLowerCase();

        // AIの言動に合わせた動的ヒント
        if (lowerMsg.includes('how are you') || lowerMsg.includes('what') || lowerMsg.includes('?')) {
            hints = [
                { en: "I'm doing great, thank you!", jp: "すごく元気に過ごしてるよ！" },
                { en: "I'm a bit busy today.", jp: "今日はちょっと忙しいんだ。" },
                { en: "How about you?", jp: "あなたはどうですか？" }
            ];
        } else if (lowerMsg.includes('love') || lowerMsg.includes('think') || lowerMsg.includes('sweet')) {
            hints = [
                { en: "You always make my day!", jp: "あなたのおかげで幸せだよ！" },
                { en: "I was missing you too.", jp: "私も会いたかったよ。" },
                { en: "That is so sweet of you.", jp: "本当に優しいね。" }
            ];
        } else {
            hints = [
                { en: "That sounds wonderful!", jp: "それ、すごく素敵だね！" },
                { en: "Tell me more about it.", jp: "もっと詳しく教えて！" },
                { en: "I completely agree with you.", jp: "完全に同意するよ。" }
            ];
        }

        hintList.innerHTML = '';
        hints.forEach(h => {
            const item = document.createElement('div');
            item.className = 'call-hint-item';
            item.innerHTML = `<span class="call-hint-en">${h.en}</span><span class="call-hint-jp">${h.jp}</span>`;
            item.onclick = () => sendQuick(h.en);
            hintList.appendChild(item);
        });
    }

    /* ④送信モード（自動 vs 手動）切り替え */
    function toggleAutoSendMode() {
        isAutoSendMode = !isAutoSendMode;
        const btn = document.getElementById('autoSendToggleBtn');
        if (isAutoSendMode) {
            btn.innerText = "モード: ⚡️ 4秒自動送信";
            btn.style.background = "rgba(255, 255, 255, 0.15)";
        } else {
            btn.innerText = "モード: ✋ 手動送信";
            btn.style.background = "#e11d48";
        }
    }

    /* ⑤通常／通話モードの両方に対応した音声認識 */
    function setupSpeechRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) return;

        recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.interimResults = true;
        recognition.continuous = true;

        recognition.onstart = () => {
            isRecording = true;
            if (activeInputSource === 'normal') {
                document.getElementById('mic-btn').classList.add('recording');
            } else {
                document.getElementById('call-mic-btn').style.background = '#ef4444';
            }
        };

        recognition.onresult = (event) => {
            let transcript = '';
            for (let i = event.resultIndex; i < event.results.length; i++) {
                transcript += event.results[i][0].transcript;
            }

            // ⑤指定された入力欄（通話用または通常用）に文字起こしを反映
            const targetInputId = activeInputSource === 'normal' ? 'user-input' : 'call-user-input';
            document.getElementById(targetInputId).value = transcript;

            clearTimeout(silenceTimer);

            // ④「4秒自動送信」モードの場合のみタイマー実行
            if (isAutoSendMode) {
                silenceTimer = setTimeout(() => {
                    if (document.getElementById(targetInputId).value.trim()) {
                        stopSpeech();
                        sendMessage(activeInputSource);
                    }
                }, 4000);
            }
        };

        recognition.onerror = () => stopSpeech();
        recognition.onend = () => { if (isRecording) stopSpeech(); };
    }

    function toggleSpeech(source = 'normal') {
        if (!recognition) {
            alert("お使いのブラウザは音声入力に対応していません。");
            return;
        }
        activeInputSource = source;
        if (isRecording) stopSpeech();
        else {
            const targetInputId = source === 'normal' ? 'user-input' : 'call-user-input';
            document.getElementById(targetInputId).value = '';
            recognition.start();
        }
    }

    function stopSpeech() {
        isRecording = false;
        clearTimeout(silenceTimer);
        document.getElementById('mic-btn').classList.remove('recording');
        document.getElementById('call-mic-btn').style.background = '#10b981';
        if (recognition) recognition.stop();
    }

    /* ③会話文脈（History）を保持してAIに送信 */
    async function sendMessage(source = 'normal') {
        const inputId = source === 'normal' ? 'user-input' : 'call-user-input';
        const input = document.getElementById(inputId);
        const text = input.value.trim();
        if (!text) return;

        addBubble('user', text, '', '', false, true, false);
        input.value = '';

        await getAIReply(text);
    }

    function sendQuick(text) {
        window.speechSynthesis.cancel();
        addBubble('user', text, '', '', false, true, false);
        setTimeout(async () => { await getAIReply(text); }, 300);
    }

    function clearCallInput() {
        document.getElementById('call-user-input').value = '';
    }

    async function getAIReply(userText) {
        try {
            // 直近の会話履歴を取得（最新5件を送って文脈を維持）
            const history = (chatHistories[currentChar] || []).slice(-5);

            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    character: currentChar,
                    message: userText,
                    step: currentStep,
                    history: history // ③文脈保持データを追加
                })
            });
            const data = await response.json();
            if (data.reply) {
                addBubble('ai', data.reply, data.translation || '', data.tip || '', true, true, true);
            }
        } catch (e) {
            // ①フォールバック時も英会話学習に役立つTipを表示
            addBubble('ai', 
                "I loved hearing your voice! Tell me more about your day.", 
                "あなたの声が聞けて嬉しかったよ！今日のことをもっと教えて？", 
                "【Tip】「Tell me more about~」は「〜についてもっと詳しく教えて」という会話を広げる万能フレーズだよ！", 
                true, true, true
            );
        }
    }

    function speakText(text) {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const uttr = new SpeechSynthesisUtterance(text);
        const char = CHARS[currentChar];
        uttr.lang = 'en-US'; uttr.pitch = char.pitch; uttr.rate = char.rate;
        window.speechSynthesis.speak(uttr);
    }

    function replayCurrentModalVoice() {
        if (lastAIText) speakText(lastAIText);
    }

    function openModal(imgSrc, name, enText, jpText) {
        document.getElementById('modal-img').src = imgSrc;
        document.getElementById('modal-name').innerText = name;
        document.getElementById('modal-text-en').innerText = enText;
        document.getElementById('modal-text-jp').innerText = jpText || '';
        document.getElementById('oshi-modal').classList.add('active');
    }

    function closeModal() { document.getElementById('oshi-modal').classList.remove('active'); }
    function saveHistories() { localStorage.setItem('oshitalk_histories', JSON.stringify(chatHistories)); }

    function loadHistories() {
        const data = localStorage.getItem('oshitalk_histories');
        const days = parseInt(document.getElementById('history-retention').value || '7');
        if (data) {
            const parsed = JSON.parse(data);
            const now = Date.now();
            const cutoff = now - (days * 24 * 60 * 60 * 1000);
            Object.keys(parsed).forEach(k => {
                parsed[k] = parsed[k].filter(item => item.time > cutoff);
            });
            chatHistories = parsed;
        }
    }

    function saveHistorySetting(val) { loadHistories(); renderChatHistory(); }
    function handleKey(e, source) { if (e.key === 'Enter') sendMessage(source); }

    /* 通話モード制御機能 */
    function startCallMode() {
        const modal = document.getElementById('callModal');
        const char = CHARS[currentChar];
        document.getElementById('callCharName').innerText = char.name;
        document.getElementById('callAvatarImg').src = char.avatar;
        
        updateCallHints(lastAIText);
        modal.classList.add('active');
        scrollToBottom();

        secondsElapsed = 0;
        document.getElementById('callTimer').innerText = "📞 通話中... 00:00";
        if (callTimerInterval) clearInterval(callTimerInterval);
        callTimerInterval = setInterval(() => {
            secondsElapsed++;
            const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
            const secs = String(secondsElapsed % 60).padStart(2, '0');
            document.getElementById('callTimer').innerText = `📞 通話中... ${mins}:${secs}`;
        }, 1000);
    }

    function endCallMode() {
        const modal = document.getElementById('callModal');
        modal.classList.remove('active');
        if (callTimerInterval) clearInterval(callTimerInterval);
    }
</script>
