<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oshitalk English - 推し活×英会話</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.75);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-leo: #f59e0b;
            --accent-noah: #8b5cf6;
            --accent-liam: #10b981;
            --accent-color: var(--accent-leo);
        }

        body {
            margin: 0;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 18px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .header { text-align: center; margin-bottom: 12px; }
        .header h1 {
            margin: 0; font-size: 1.4rem; font-weight: 700;
            background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .header p { margin: 4px 0 0; font-size: 0.8rem; color: var(--text-sub); }

        /* キャラクター選択 */
        .char-selector { display: flex; gap: 10px; margin-bottom: 12px; }
        .char-card {
            flex: 1; background: rgba(15, 23, 42, 0.6);
            border: 2px solid transparent; border-radius: 16px;
            padding: 8px; text-align: center; cursor: pointer; transition: all 0.3s ease;
        }
        .char-card.active {
            border-color: var(--accent-color);
            background: rgba(255, 255, 255, 0.08); transform: translateY(-2px);
        }
        .char-card img {
            width: 56px; height: 56px; border-radius: 50%; object-fit: cover;
            margin-bottom: 4px; border: 2px solid rgba(255, 255, 255, 0.2);
        }
        .char-card .name { font-weight: 700; font-size: 0.85rem; }

        /* 好感度＆音量調整バー */
        .love-level-box {
            background: rgba(15, 23, 42, 0.5); border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px; padding: 10px 12px; margin-bottom: 12px;
        }
        .love-header { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
        .love-level-box img {
            width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent-color);
        }
        .love-info { flex: 1; }
        .love-title { font-size: 0.8rem; color: var(--text-sub); display: flex; justify-content: space-between; margin-bottom: 4px; }
        .love-title strong { color: var(--text-main); }
        .progress-bar { width: 100%; height: 6px; background: rgba(255, 255, 255, 0.1); border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; width: 15%; background: var(--accent-color); transition: width 0.4s ease; }

        .volume-control {
            display: flex; align-items: center; gap: 8px; font-size: 0.75rem;
            color: var(--text-sub); padding-top: 4px; border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        .volume-control input[type="range"] { flex: 1; height: 4px; accent-color: var(--accent-color); cursor: pointer; }

        /* チャットエリア */
        .chat-area {
            height: 270px; overflow-y: auto; display: flex; flex-direction: column;
            gap: 12px; margin-bottom: 12px; padding-right: 4px;
        }
        .msg-row { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
        .msg-row.user { flex-direction: row-reverse; }
        .msg-row img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
        .bubble-container { max-width: 78%; display: flex; flex-direction: column; gap: 4px; }
        .bubble { padding: 10px 14px; border-radius: 16px; font-size: 0.88rem; line-height: 1.45; }
        .msg-row.ai .bubble { background: rgba(255, 255, 255, 0.1); border-top-left-radius: 4px; }
        .msg-row.user .bubble { background: var(--accent-color); color: #0f172a; font-weight: 600; border-top-right-radius: 4px; }
        .jp-sub { font-size: 0.75rem; color: #cbd5e1; margin-top: 4px; display: block; line-height: 1.3; }
        .english-tip {
            font-size: 0.73rem; background: rgba(0, 0, 0, 0.3);
            border-left: 3px solid var(--accent-color); padding: 6px 10px; border-radius: 0 8px 8px 0; color: #e2e8f0; margin-top: 4px;
        }

        /* クイックボタン */
        .quick-actions { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; padding-bottom: 6px; }
        .quick-btn {
            background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-main); padding: 6px 12px; border-radius: 18px; font-size: 0.78rem; white-space: nowrap; cursor: pointer;
        }
        .quick-btn:hover { background: rgba(255, 255, 255, 0.15); border-color: var(--accent-color); }

        /* 入力エリア */
        .input-area { display: flex; gap: 8px; position: relative; }
        .input-area input {
            flex: 1; background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px; padding: 10px 16px; color: #fff; font-size: 0.88rem; outline: none;
        }
        .btn { background: var(--accent-color); border: none; color: #0f172a; font-weight: bold; padding: 0 16px; border-radius: 20px; cursor: pointer; }
        .btn-mic { background: rgba(255, 255, 255, 0.1); color: #fff; border: 1px solid rgba(255, 255, 255, 0.2); }
        .btn-mic.recording { background: #ef4444; }

        /* 🌟 推しアップPopup（モーダル）表示 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px);
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease; z-index: 999;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-card {
            width: 85%; max-width: 340px; background: rgba(30, 41, 59, 0.95);
            border: 2px solid var(--accent-color); border-radius: 24px; padding: 20px;
            text-align: center; box-shadow: 0 0 30px rgba(245, 158, 11, 0.3);
            transform: scale(0.8); transition: transform 0.3s ease;
        }
        .modal-overlay.active .modal-card { transform: scale(1); }
        .modal-card img {
            width: 140px; height: 140px; border-radius: 50%; object-fit: cover;
            border: 4px solid var(--accent-color); margin-bottom: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
        }
        .modal-name { font-size: 1.1rem; font-weight: bold; color: var(--accent-color); margin-bottom: 8px; }
        .modal-text-en { font-size: 0.95rem; font-weight: 600; line-height: 1.4; margin-bottom: 6px; }
        .modal-text-jp { font-size: 0.8rem; color: #cbd5e1; margin-bottom: 14px; }
        .modal-close-btn {
            background: var(--accent-color); color: #0f172a; border: none;
            padding: 8px 24px; border-radius: 20px; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Oshitalk English</h1>
        <p>推しとの会話を通じて自然な英語を話そう！</p>
    </div>

    <div class="char-selector">
        <div class="char-card active" onclick="selectChar('leo')" id="card-leo">
            <img src="leo.jpg" alt="Leo">
            <div class="name">Leo</div>
        </div>
        <div class="char-card" onclick="selectChar('noah')" id="card-noah">
            <img src="noah.jpg" alt="Noah">
            <div class="name">Noah</div>
        </div>
        <div class="char-card" onclick="selectChar('liam')" id="card-liam">
            <img src="liam.jpg" alt="Liam">
            <div class="name">Liam</div>
        </div>
    </div>

    <div class="love-level-box">
        <div class="love-header">
            <img id="love-avatar" src="leo.jpg" alt="Current Oshi">
            <div class="love-info">
                <div class="love-title">
                    <strong id="char-title-name">Leo (溺愛・王子様)</strong>
                    <span>Love Lv. <span id="love-lv">1</span> (<span id="love-pct">15</span>%)</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="love-progress"></div>
                </div>
            </div>
        </div>
        <div class="volume-control">
            <span>🔊 音量:</span>
            <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.8" onchange="updateVolume(this.value)">
            <span id="volume-val">80%</span>
        </div>
    </div>

    <div class="chat-area" id="chat-area"></div>

    <div class="quick-actions">
        <button class="quick-btn" onclick="sendQuick('Good morning!')">☀️ 朝の挨拶</button>
        <button class="quick-btn" onclick="sendQuick('How was your day?')">💬 今日どうだった？</button>
        <button class="quick-btn" onclick="sendQuick('I missed you so much!')">💖 逢いたかった！</button>
        <button class="quick-btn" onclick="sendQuick('What are your plans for today?')">📅 今日の予定は？</button>
        <button class="quick-btn" onclick="sendQuick('I am a bit tired today.')">休 疲れたな...</button>
        <button class="quick-btn" onclick="sendQuick('Can you encourage me?')">🥺 励まして！</button>
        <button class="quick-btn" onclick="sendQuick('What are you doing right now?')">👀 何してるの？</button>
        <button class="quick-btn" onclick="sendQuick('Tell me something sweet!')">🍬 甘い言葉ちょうだい</button>
        <button class="quick-btn" onclick="sendQuick('I did my best today!')">🔥 今日がんばったよ！</button>
        <button class="quick-btn" onclick="sendQuick('Good night, sweet dreams!')">🌙 おやすみ</button>
    </div>

    <div class="input-area">
        <button class="btn btn-mic" id="mic-btn" onclick="toggleSpeech()">🎤</button>
        <input type="text" id="user-input" placeholder="英語でメッセージを入力..." onkeypress="handleKey(event)">
        <button class="btn" onclick="sendMessage()">送信</button>
    </div>
</div>

<!-- 🌟 推しのアップ表示Popupモーダル -->
<div class="modal-overlay" id="oshi-modal" onclick="closeModal()">
    <div class="modal-card" onclick="event.stopPropagation()">
        <img id="modal-img" src="leo.jpg" alt="Oshi Large">
        <div class="modal-name" id="modal-name">Leo</div>
        <div class="modal-text-en" id="modal-text-en">Good morning, my love!</div>
        <div class="modal-text-jp" id="modal-text-jp">おはよう、愛しい人！</div>
        <button class="modal-close-btn" onclick="closeModal()">閉じる</button>
    </div>
</div>

<script>
    const CHARS = {
        leo: { name: 'Leo', desc: '溺愛・王子様', avatar: 'leo.jpg', color: '#f59e0b', pitch: 0.9, rate: 0.9, greet: 'Good morning, sweetheart. Did you sleep well?', greetJp: 'おはよう。よく眠れた？今日も君に会えて嬉しいよ。' },
        noah: { name: 'Noah', desc: 'ツンデレ・天才アイドル', avatar: 'noah.jpg', color: '#8b5cf6', pitch: 0.8, rate: 0.95, greet: 'You\'re late... Oh, you\'re here. So, what are we talking about today?', greetJp: '遅い。...あ、来たんだ。で、今日は何について話すの？' },
        liam: { name: 'Liam', desc: '年下・わんこ系', avatar: 'liam.jpg', color: '#10b981', pitch: 1.1, rate: 1.0, greet: 'Hey! I\'m so happy to see you today! Tell me everything about your day!', greetJp: 'ねえねえ！今日会えてすごく嬉しいよ！' }
    };

    let currentChar = 'leo';
    let loveCounts = { leo: 15, noah: 10, liam: 20 };
    let currentVolume = 0.8;
    let maleVoices = [];

    window.onload = () => { selectChar('leo'); initVoices(); };

    function initVoices() {
        if (!('speechSynthesis' in window)) return;
        const loadVoices = () => {
            const voices = window.speechSynthesis.getVoices();
            maleVoices = voices.filter(v => v.lang.startsWith('en') && (v.name.includes('David') || v.name.includes('Mark') || v.name.includes('George') || v.name.includes('Guy') || v.name.includes('Male')));
        };
        loadVoices();
        if (window.speechSynthesis.onvoiceschanged !== undefined) window.speechSynthesis.onvoiceschanged = loadVoices;
    }

    function selectChar(key) {
        currentChar = key;
        const char = CHARS[key];
        document.querySelectorAll('.char-card').forEach(card => card.classList.remove('active'));
        document.getElementById(`card-${key}`).classList.add('active');
        document.documentElement.style.setProperty('--accent-color', char.color);
        document.getElementById('love-avatar').src = char.avatar;
        document.getElementById('char-title-name').innerText = `${char.name} (${char.desc})`;
        updateLoveUI();

        const chatArea = document.getElementById('chat-area');
        chatArea.innerHTML = '';
        addBubble('ai', char.greet, char.greetJp, `「${char.name}」との会話を始めよう！`, false);
    }

    function updateLoveUI() {
        const prog = loveCounts[currentChar];
        document.getElementById('love-lv').innerText = Math.floor(prog / 100) + 1;
        document.getElementById('love-pct').innerText = prog % 100;
        document.getElementById('love-progress').style.width = `${prog % 100}%`;
    }

    function updateVolume(val) {
        currentVolume = parseFloat(val);
        document.getElementById('volume-val').innerText = `${Math.round(currentVolume * 100)}%`;
    }

    function addBubble(sender, text, subText = '', tipText = '', showPopup = true) {
        const chatArea = document.getElementById('chat-area');
        const row = document.createElement('div');
        row.className = `msg-row ${sender}`;
        const char = CHARS[currentChar];
        const avatarUrl = sender === 'ai' ? char.avatar : 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop';

        row.innerHTML = `
            <img src="${avatarUrl}" alt="icon">
            <div class="bubble-container">
                <div class="bubble">${text}</div>
                ${subText ? `<span class="jp-sub">${subText}</span>` : ''}
                ${tipText ? `<div class="english-tip">💡 <strong>${char.name}'s Tip:</strong> ${tipText}</div>` : ''}
            </div>
        `;
        
        // バブルをタップしてもPopup表示できるように設定
        row.onclick = () => openModal(char.avatar, char.name, text, subText);

        chatArea.appendChild(row);
        chatArea.scrollTop = chatArea.scrollHeight;

        if (sender === 'ai') {
            speakText(text);
            if (showPopup) openModal(char.avatar, char.name, text, subText);
        }
    }

    // 🌟 推しモーダルPopupを開く関数
    function openModal(imgSrc, name, enText, jpText) {
        document.getElementById('modal-img').src = imgSrc;
        document.getElementById('modal-name').innerText = name;
        document.getElementById('modal-text-en').innerText = enText;
        document.getElementById('modal-text-jp').innerText = jpText || '';
        document.getElementById('oshi-modal').classList.add('active');
    }

    function closeModal() {
        document.getElementById('oshi-modal').classList.remove('active');
    }

    async function sendMessage() {
        const input = document.getElementById('user-input');
        const text = input.value.trim();
        if (!text) return;
        addBubble('user', text, '', '', false);
        input.value = '';
        loveCounts[currentChar] += 5;
        updateLoveUI();
        await getAIReply(text);
    }

    function sendQuick(text) {
        window.speechSynthesis.cancel();
        addBubble('user', text, '', '', false);
        loveCounts[currentChar] += 3;
        updateLoveUI();
        setTimeout(async () => { await getAIReply(text); }, 400);
    }

    async function getAIReply(userText) {
        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ character: currentChar, message: userText })
            });
            const data = await response.json();
            if (data.reply) {
                addBubble('ai', data.reply, data.translation || '', data.tip || '', true);
            }
        } catch (e) {
            addBubble('ai', "I'm so glad we're talking right now!", "今君とお話しできてすごく嬉しいよ！", "「so glad」で「すごく嬉しい」という意味になるよ。", true);
        }
    }

    function speakText(text) {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const uttr = new SpeechSynthesisUtterance(text);
        const char = CHARS[currentChar];
        uttr.lang = 'en-US'; uttr.volume = currentVolume; uttr.pitch = char.pitch; uttr.rate = char.rate;
        if (maleVoices.length > 0) uttr.voice = maleVoices[0];
        window.speechSynthesis.speak(uttr);
    }

    function handleKey(e) { if (e.key === 'Enter') sendMessage(); }
</script>

</body>
</html>
