<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oshitalk English - 推し活×英会話</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.75);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-leo: #f59e0b;
            --accent-noah: #8b5cf6;
            --accent-liam: #10b981;
            --accent-color: var(--accent-leo);
        }

        body {
            margin: 0; padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color); color: var(--text-main);
            display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box;
        }

        .container {
            width: 100%; max-width: 480px; background: var(--card-bg);
            backdrop-filter: blur(12px); border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1); padding: 18px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); position: relative;
        }

        .header { text-align: center; margin-bottom: 10px; }
        .header h1 {
            margin: 0; font-size: 1.3rem; font-weight: 700;
            background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        /* 🌟 ④ 好感度 (Love Level) UI */
        .love-level-box {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 12px;
            padding: 6px 12px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.75rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .love-badge {
            background: var(--accent-color);
            color: #0f172a;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 10px;
            white-space: nowrap;
        }
        .love-bar-bg {
            flex: 1;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }
        .love-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-color), #ec4899);
            width: 0%;
            transition: width 0.4s ease;
        }

        /* キャラクター選択 */
        .char-selector { display: flex; gap: 8px; margin-bottom: 10px; }
        .char-card {
            flex: 1; background: rgba(15, 23, 42, 0.6);
            border: 2px solid transparent; border-radius: 16px;
            padding: 6px; text-align: center; cursor: pointer; transition: all 0.3s ease;
        }
        .char-card.active { border-color: var(--accent-color); background: rgba(255, 255, 255, 0.08); }
        .char-card img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255, 255, 255, 0.2); }
        .char-card .name { font-weight: 700; font-size: 0.8rem; }

        /* コントロールパネル */
        .control-panel {
            background: rgba(15, 23, 42, 0.5); border-radius: 12px; padding: 8px 12px;
            margin-bottom: 10px; display: flex; flex-direction: column; gap: 6px; font-size: 0.75rem;
        }
        .control-row { display: flex; justify-content: space-between; align-items: center; }
        .step-btns { display: flex; gap: 4px; }
        .step-btn {
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff; padding: 2px 8px; border-radius: 10px; cursor: pointer; font-size: 0.7rem;
        }
        .step-btn.active { background: var(--accent-color); color: #0f172a; font-weight: bold; }
        select, input[type="date"] {
            background: #1e293b; color: #fff; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; padding: 2px 4px; font-size: 0.75rem;
        }

        /* チャットエリア */
        .chat-area { height: 240px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; padding-right: 4px; }
        .msg-row { display: flex; gap: 8px; align-items: flex-start; }
        .msg-row.user { flex-direction: row-reverse; }
        .msg-row img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; flex-shrink: 0; cursor: pointer; }
        .bubble-container { max-width: 80%; display: flex; flex-direction: column; gap: 3px; }
        .bubble { padding: 8px 12px; border-radius: 14px; font-size: 0.85rem; line-height: 1.4; }
        .msg-row.ai .bubble { background: rgba(255, 255, 255, 0.1); border-top-left-radius: 2px; }
        .msg-row.user .bubble { background: var(--accent-color); color: #0f172a; font-weight: 600; border-top-right-radius: 2px; }
        .jp-sub { font-size: 0.73rem; color: #cbd5e1; margin-top: 2px; }
        .english-tip { font-size: 0.72rem; background: rgba(0, 0, 0, 0.35); border-left: 3px solid var(--accent-color); padding: 6px 8px; border-radius: 0 6px 6px 0; color: #e2e8f0; margin-top: 3px; }

        .replay-btn {
            align-self: flex-start; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff; border-radius: 12px; padding: 2px 8px; font-size: 0.68rem; cursor: pointer; margin-top: 2px; display: flex; align-items: center; gap: 4px;
        }

        /* トピック別クイック発言 */
        .quick-toggle-container { margin-bottom: 10px; background: rgba(15, 23, 42, 0.6); border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); overflow: hidden; }
        .quick-toggle-header {
            padding: 8px 12px; font-size: 0.75rem; font-weight: bold; background: rgba(255, 255, 255, 0.05);
            display: flex; justify-content: space-between; align-items: center; cursor: pointer; color: var(--accent-color);
        }
        .quick-categories { display: flex; gap: 4px; overflow-x: auto; padding: 6px; scrollbar-width: none; background: rgba(0,0,0,0.2); }
        .quick-categories::-webkit-scrollbar { display: none; }
        .cat-tab {
            padding: 3px 8px; border-radius: 10px; font-size: 0.7rem; white-space: nowrap; cursor: pointer;
            background: rgba(255, 255, 255, 0.08); color: var(--text-main); border: 1px solid transparent;
        }
        .cat-tab.active { background: var(--accent-color); color: #0f172a; font-weight: bold; }

        .quick-phrase-list {
            display: none; padding: 8px; gap: 6px; overflow-x: auto; scrollbar-width: none;
            background: rgba(15, 23, 42, 0.8); border-top: 1px solid rgba(255,255,255,0.05);
        }
        .quick-phrase-list.open { display: flex; }
        .quick-btn {
            background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15); color: var(--text-main);
            padding: 5px 10px; border-radius: 14px; font-size: 0.72rem; white-space: nowrap; cursor: pointer; flex-shrink: 0;
        }
        .quick-btn:hover { background: rgba(255, 255, 255, 0.15); }

        /* 入力エリア */
        .input-area { display: flex; gap: 6px; }
        .input-area input { flex: 1; background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 18px; padding: 8px 14px; color: #fff; font-size: 0.85rem; outline: none; }
        .btn { background: var(--accent-color); border: none; color: #0f172a; font-weight: bold; padding: 0 14px; border-radius: 18px; cursor: pointer; }
        .btn-mic { background: rgba(255, 255, 255, 0.1); color: #fff; border: 1px solid rgba(255, 255, 255, 0.2); width: 38px; }
        .btn-mic.recording { background: #ef4444; animation: pulse 1s infinite; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* 推しモーダル Popup & 通話風UI拡張 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(12px);
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease; z-index: 999;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal-card {
            width: 85%; max-width: 320px; background: rgba(30, 41, 59, 0.95);
            border: 2px solid var(--accent-color); border-radius: 20px; padding: 20px;
            text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8); transition: all 0.3s ease;
            position: relative;
        }

        /* 🌟 ② 通話風UI (Call Mode) スタイル */
        .modal-card.call-mode {
            background: linear-gradient(180deg, #0f172a 0%, #1e1b4b 100%);
            border-color: #10b981;
        }
        .call-status {
            font-size: 0.75rem; color: #10b981; font-weight: bold; margin-bottom: 8px; display: none;
        }
        .call-mode .call-status { display: block; }
        .wave-animation {
            display: none; justify-content: center; align-items: center; gap: 4px; margin: 10px 0;
        }
        .call-mode .wave-animation { display: flex; }
        .wave-bar {
            width: 4px; height: 16px; background: #10b981; border-radius: 2px;
            animation: wave 1s infinite ease-in-out;
        }
        .wave-bar:nth-child(2) { animation-delay: 0.2s; }
        .wave-bar:nth-child(3) { animation-delay: 0.4s; }
        @keyframes wave { 0%, 100% { height: 8px; } 50% { height: 24px; } }

        @media (max-width: 480px) {
            .modal-overlay.premium .modal-card {
                width: 100vw; height: 100vh; max-width: 100vw; border-radius: 0; border: none;
                display: flex; flex-direction: column; justify-content: center; align-items: center;
                background: linear-gradient(180deg, rgba(15,23,42,0.85) 0%, rgba(15,23,42,0.98) 100%);
                padding: 24px; box-sizing: border-box;
            }
            .modal-overlay.premium .modal-card img {
                width: 180px; height: 180px; border-width: 4px; box-shadow: 0 0 25px var(--accent-color);
            }
        }

        .modal-card img { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent-color); margin-bottom: 10px; transition: all 0.3s ease; }
        .modal-name { font-size: 1.1rem; font-weight: bold; color: var(--accent-color); margin-bottom: 6px; }
        .modal-text-en { font-size: 0.95rem; font-weight: 600; line-height: 1.4; margin-bottom: 6px; }
        .modal-text-jp { font-size: 0.8rem; color: #cbd5e1; margin-bottom: 14px; }
        .modal-btns { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
        .modal-btn { background: var(--accent-color); color: #0f172a; border: none; padding: 8px 14px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 0.75rem; }
        .modal-btn.sec { background: rgba(255,255,255,0.15); color: #fff; }
        .modal-btn.call { background: #10b981; color: #fff; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Oshitalk English</h1>
    </div>

    <!-- 🌟 ④ Love Level (好感度) バー -->
    <div class="love-level-box">
        <span class="love-badge" id="love-level-badge">Lv.1 Sweetheart</span>
        <div class="love-bar-bg">
            <div class="love-bar-fill" id="love-bar-fill"></div>
        </div>
        <span id="love-exp-text" style="font-size:0.7rem; color:#cbd5e1;">0/100</span>
    </div>

    <!-- キャラクター選択 -->
    <div class="char-selector">
        <div class="char-card active" onclick="selectChar('leo')" id="card-leo">
            <img id="avatar-leo" src="leo.jpg" alt="Leo"><div class="name">Leo</div>
        </div>
        <div class="char-card" onclick="selectChar('noah')" id="card-noah">
            <img id="avatar-noah" src="noah.jpg" alt="Noah"><div class="name">Noah</div>
        </div>
        <div class="char-card" onclick="selectChar('liam')" id="card-liam">
            <img id="avatar-liam" src="liam.jpg" alt="Liam"><div class="name">Liam</div>
        </div>
    </div>

    <div class="control-panel">
        <div class="control-row">
            <span>📈 会話ステップ:</span>
            <div class="step-btns">
                <button class="step-btn" id="step-1" onclick="setStep(1)">Step 1 (初級)</button>
                <button class="step-btn active" id="step-2" onclick="setStep(2)">Step 2 (中級)</button>
                <button class="step-btn" id="step-3" onclick="setStep(3)">Step 3 (長文)</button>
            </div>
        </div>
        <div class="control-row">
            <span>💾 履歴保存:</span>
            <select id="history-retention" onchange="saveHistorySetting(this.value)">
                <option value="1">1日間保存</option>
                <option value="7" selected>1週間保存</option>
                <option value="999">無制限に保持</option>
            </select>
        </div>
        <!-- 🌟 ③ 誕生日設定 -->
        <div class="control-row">
            <span>🎂 My Birthday:</span>
            <input type="date" id="user-birthday" onchange="saveBirthday(this.value)">
        </div>
    </div>

    <div class="chat-area" id="chat-area"></div>

    <!-- トピック別クイック発言 -->
    <div class="quick-toggle-container">
        <div class="quick-toggle-header" onclick="toggleQuickPanel()">
            <span>💬 トピック別クイック発言（100パターン）</span>
            <span id="toggle-icon">▲</span>
        </div>
        <div class="quick-categories" id="quick-cats"></div>
        <div class="quick-phrase-list open" id="quick-phrase-list"></div>
    </div>

    <div class="input-area">
        <button class="btn btn-mic" id="mic-btn" onclick="toggleSpeech()">🎤</button>
        <input type="text" id="user-input" placeholder="英語でメッセージを入力..." onkeypress="handleKey(event)">
        <button class="btn" onclick="sendMessage()">送信</button>
    </div>
</div>

<!-- 推しモーダル Popup (通話風UI拡張) -->
<div class="modal-overlay premium" id="oshi-modal" onclick="closeModal()">
    <div class="modal-card" id="modal-card-box" onclick="event.stopPropagation()">
        <div class="call-status" id="call-status">📞 IN CALL - 00:15</div>
        <img id="modal-img" src="leo.jpg" alt="Oshi">
        <div class="wave-animation">
            <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
        </div>
        <div class="modal-name" id="modal-name">Leo</div>
        <div class="modal-text-en" id="modal-text-en"></div>
        <div class="modal-text-jp" id="modal-text-jp"></div>
        <div class="modal-btns">
            <button class="modal-btn sec" onclick="replayCurrentModalVoice()">🔊 もう一度聞く</button>
            <button class="modal-btn call" id="btn-toggle-call" onclick="toggleCallMode()">📞 通話モード切替</button>
            <button class="modal-btn" onclick="closeModal()">閉じる</button>
        </div>
    </div>
</div>

        sports: { title: '⚽ 運動', phrases: [

            { en: "I'm feeling refreshed after exercise!", jp: "✨ 運動してスッキリ！" },
            { en: "Which team are you cheering for?", jp: "📣 どっちのチーム応援してる？" },
            { en: "I played tennis today.", jp: "🎾 今日テニスしたよ" },
            { en: "My muscles are sore today...", jp: "💪 今日は筋肉痛だよ..." },
            { en: "Let me cheer for you!", jp: "🔥 全力で応援させて！" },
            { en: "Sports make me feel energetic!", jp: "⚡ スポーツで元気出る！" }
        ]},
        feeling: { title: '💖 感情', phrases: [
            { en: "I missed you so much!", jp: "💖 すごく会いたかったよ！" },
            { en: "I love talking with you!", jp: "🎨 あなたと話すのが大好き" },
            { en: "Praise me please!", jp: "🍰 褒めてほしいな！" },

            { en: "I was thinking about you all day.", jp: "💭 1日中あなたのこと考えてた" },
            { en: "I'm so lucky to have you.", jp: "✨ あなたに会えて幸運だよ" },
            { en: "Your smile is the best!", jp: "😊 あなたの笑顔が1番！" },
            { en: "I want to stay with you forever.", jp: "💍 ずっと一緒にいたいな" },
            { en: "You mean everything to me.", jp: "🌟 私の全てだよ" },
            { en: "I love you so much!", jp: "❤️ 大大好きだよ！" }
        ]},
        support: { title: '🥺 悩み', phrases: [
            { en: "Can you encourage me?", jp: "🥺 励ましてくれる？" },
            { en: "I'm so tired today...", jp: "😫 今日すごく疲れた..." },
            { en: "I made a mistake today.", jp: "😞 今日失敗しちゃった" },
            { en: "I feel a bit lonely.", jp: "🌧️ ちょっと寂しいな" },
            { en: "Nothing went right today.", jp: "😮‍💨 今日はうまくいかなかった" },
            { en: "Can I lean on you?", jp: "🧸 甘えてもいいかな？" },
            { en: "Give me a hug please!", jp: "🤗 ぎゅーってして！" },
            { en: "I need your comforting words.", jp: "💬 優しい言葉をちょうだい" },
            { en: "I feel better talking to you.", jp: "🌸 話せて気持ちが楽になった" },
            { en: "Thank you for listening to me.", jp: "💌 話を聞いてくれてありがとう" }
        ]},
        angry: { title: '😤 ぷんぷん', phrases: [
            { en: "You are late! I'm waiting!", jp: "⏰ 遅刻だよ！待ってるんだから！" },
            { en: "Why did you reply so late?", jp: "📱 なんで返事遅かったの？" },
            { en: "Did you forget our anniversary?", jp: "📅 記念日忘れたの...？" },
            { en: "I'm angry at you!", jp: "😤 もう、怒ったんだからね！" },
            { en: "You don't care about me anymore!", jp: "🥺 もう私のことどうでもいいの？" },
            { en: "Buy me an ice cream to apologize!", jp: "🍦 謝罪にアイス買って！" },
            { en: "Don't look at other girls!", jp: "👁️ 他の女の子見ちゃダメ！" },
            { en: "You promise? Don't break it!", jp: "🤙 約束だよ？破らないでね！" },
            { en: "Hmph! I won't talk to you!", jp: "😠 ふんっ！もう話してあげない！" },
            { en: "Just kidding, I can't stay mad at you.", jp: "🤭 冗談だよ、怒り続けられないや" }
        ]}
    };

    let currentChar = 'leo';
    let currentExpression = 'default';
    let currentStep = 2;
    let currentCat = 'life';
    let isQuickOpen = true;
    let chatHistories = { leo: [], noah: [], liam: [] };
    let isRecording = false;
    let recognition = null;
    let silenceTimer = null;
    let lastAIText = '';
    let isCallMode = false;

    // 🌟 ④ 好感度 (Love Level) 変数
    let loveExp = 0;
    let loveLevel = 1;

    window.onload = () => {
        loadHistories();
        loadBirthday();
        loadLoveLevel();
        selectChar('leo');
        setupSpeechRecognition();
        initQuickPanel();
        checkBirthday();
    };

    /* 🌟 ① 表情切り替えロジック */
    function setExpression(expr) {
        currentExpression = expr || 'default';
        const char = CHARS[currentChar];
        const imgSrc = char.expressions[currentExpression] || char.expressions.default;
        
        // アイコン・モーダル画像に反映
        const charCardImg = document.querySelector(`#card-${currentChar} img`);
        if (charCardImg) charCardImg.src = imgSrc;
        document.getElementById('modal-img').src = imgSrc;
    }

    /* 🌟 感情・カテゴリによる表情判定 */
    function detectExpression(text, category = '') {
        const lower = text.toLowerCase();
        if (category === 'angry' || lower.includes('angry') || lower.includes('late')) return 'angry';
        if (category === 'support' || lower.includes('sad') || lower.includes('tired')) return 'sad';
        if (category === 'feeling' || lower.includes('love') || lower.includes('miss')) return 'blush';
        if (lower.includes('happy') || lower.includes('fun') || lower.includes('great')) return 'happy';
        return 'default';
    }

    /* 🌟 ④ 好感度 (Love Level) ロジック */
    function addLoveExp(pts) {
        loveExp += pts;
        const maxExp = loveLevel * 100;
        if (loveExp >= maxExp) {
            loveExp -= maxExp;
            loveLevel++;
            alert(`🎉 Level Up! 好感度が Lv.${loveLevel} に上がりました！`);
        }
        saveLoveLevel();
        updateLoveUI();
    }

    function updateLoveUI() {
        const maxExp = loveLevel * 100;
        const pct = Math.min(100, Math.floor((loveExp / maxExp) * 100));
        document.getElementById('love-bar-fill').style.width = pct + '%';
        document.getElementById('love-exp-text').innerText = `${loveExp}/${maxExp}`;
        
        const titles = ["Sweetheart", "Close Friend", "Special One", "Soulmate", "Forever Love"];
        const title = titles[Math.min(titles.length - 1, loveLevel - 1)];
        document.getElementById('love-level-badge').innerText = `Lv.${loveLevel} ${title}`;
    }

    function saveLoveLevel() {
        localStorage.setItem('oshitalk_love_exp', loveExp);
        localStorage.setItem('oshitalk_love_lvl', loveLevel);
    }

    function loadLoveLevel() {
        loveExp = parseInt(localStorage.getItem('oshitalk_love_exp') || '0');
        loveLevel = parseInt(localStorage.getItem('oshitalk_love_lvl') || '1');
        updateLoveUI();
    }

    /* 🌟 ③ 誕生日演出機能 */
    function saveBirthday(val) {
        localStorage.setItem('oshitalk_user_birthday', val);
    }

    function loadBirthday() {
        const b = localStorage.getItem('oshitalk_user_birthday');
        if (b) document.getElementById('user-birthday').value = b;
    }

    function checkBirthday() {
        const b = localStorage.getItem('oshitalk_user_birthday');
        if (!b) return;
        const today = new Date();
        const bDate = new Date(b);
        if (today.getMonth() === bDate.getMonth() && today.getDate() === bDate.getDate()) {
            setTimeout(() => {
                const char = CHARS[currentChar];
                const bMsgEn = `Happy Birthday, my love! I'm so lucky to celebrate this special day with you!`;
                const bMsgJp = `誕生日おめでとう！こんな特別な日を君と一緒に祝えて本当に幸せだよ！`;
                setExpression('blush');
                addBubble('ai', bMsgEn, bMsgJp, "🎂 今日は特別な1日！素敵な誕生日にしようね！", true, true, true);
            }, 1000);
        }
    }

    /* 🌟 ② 通話風UI (Call Mode) トグル */
    function toggleCallMode() {
        isCallMode = !isCallMode;
        const cardBox = document.getElementById('modal-card-box');
        const btn = document.getElementById('btn-toggle-call');
        if (isCallMode) {
            cardBox.classList.add('call-mode');
            btn.innerText = '📱 通常表示に戻す';
        } else {
            cardBox.classList.remove('call-mode');
            btn.innerText = '📞 通話モード切替';
        }
    }

    function initQuickPanel() {
        const catContainer = document.getElementById('quick-cats');
        catContainer.innerHTML = '';
        Object.keys(QUICK_DATA).forEach(key => {
            const cat = QUICK_DATA[key];
            const btn = document.createElement('div');
            btn.className = `cat-tab ${key === currentCat ? 'active' : ''}`;
            btn.innerText = cat.title;
            btn.onclick = (e) => selectCategory(key, e);
            catContainer.appendChild(btn);
        });
        renderPhrases();
    }

    function selectCategory(key, event) {
        currentCat = key;
        document.querySelectorAll('.cat-tab').forEach(tab => tab.classList.remove('active'));
        if (event && event.target) event.target.classList.add('active');
        renderPhrases();
    }

    function renderPhrases() {
        const list = document.getElementById('quick-phrase-list');
        list.innerHTML = '';
        const phrases = QUICK_DATA[currentCat].phrases;
        phrases.forEach(p => {
            const btn = document.createElement('button');
            btn.className = 'quick-btn';
            btn.innerText = p.jp;
            btn.onclick = () => sendQuick(p.en, currentCat);
            list.appendChild(btn);
        });
    }

    function toggleQuickPanel() {
        isQuickOpen = !isQuickOpen;
        const list = document.getElementById('quick-phrase-list');
        const cats = document.getElementById('quick-cats');
        const icon = document.getElementById('toggle-icon');
        if (isQuickOpen) {
            list.classList.add('open');
            cats.style.display = 'flex';
            icon.innerText = '▲';
        } else {
            list.classList.remove('open');
            cats.style.display = 'none';
            icon.innerText = '▼';
        }
    }

    function setStep(s) {
        currentStep = s;
        document.querySelectorAll('.step-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`step-${s}`).classList.add('active');
    }

    function selectChar(key) {
        window.speechSynthesis.cancel();
        currentChar = key;
        const char = CHARS[key];
        document.querySelectorAll('.char-card').forEach(card => card.classList.remove('active'));
        document.getElementById(`card-${key}`).classList.add('active');
        document.documentElement.style.setProperty('--accent-color', char.color);
        setExpression('default');
        renderChatHistory();
    }

    function renderChatHistory() {
        const chatArea = document.getElementById('chat-area');
        chatArea.innerHTML = '';
        const history = chatHistories[currentChar];

        if (!history || history.length === 0) {
            const char = CHARS[currentChar];
            addBubble('ai', char.greet, char.greetJp, `「${char.name}」との会話をスタートしよう！`, false, false, false);
        } else {
            history.forEach(item => {
                addBubble(item.sender, item.text, item.subText, item.tipText, false, false, false);
            });
        }
    }

    function addBubble(sender, text, subText = '', tipText = '', showPopup = true, save = true, autoSpeak = true) {
        const chatArea = document.getElementById('chat-area');
        const row = document.createElement('div');
        row.className = `msg-row ${sender}`;
        const char = CHARS[currentChar];
        
        const avatarUrl = sender === 'ai' 
            ? (char.expressions[currentExpression] || char.expressions.default)
            : 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop';

        const isAI = sender === 'ai';
        if (isAI) lastAIText = text;

        row.innerHTML = `
            <img src="${avatarUrl}" onclick="openModal('${avatarUrl}', '${char.name}', '${text.replace(/'/g, "\\'")}', '${subText.replace(/'/g, "\\'")}')">
            <div class="bubble-container">
                <div class="bubble">${text}</div>
                ${subText ? `<span class="jp-sub">${subText}</span>` : ''}
                ${tipText ? `<div class="english-tip">💡 <strong>${char.name}'s Tip:</strong> ${tipText}</div>` : ''}
                ${isAI ? `<button class="replay-btn" onclick="speakText('${text.replace(/'/g, "\\'")}')">🔊 もう一度聞く</button>` : ''}
            </div>
        `;

        chatArea.appendChild(row);
        chatArea.scrollTop = chatArea.scrollHeight;

        if (save) {
            if (!chatHistories[currentChar]) chatHistories[currentChar] = [];
            chatHistories[currentChar].push({ sender, text, subText, tipText, time: Date.now() });
            saveHistories();
        }

        if (isAI && autoSpeak) {
            speakText(text);
            if (showPopup) openModal(avatarUrl, char.name, text, subText);
        }
    }

    /* 🌟 ⑥ 音声・無音タイマー調整 & ノイズエラーハンドリング強固化 */
    function setupSpeechRecognition() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) return;

        recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.interimResults = true;
        recognition.continuous = true;

        recognition.onstart = () => {
            isRecording = true;
            document.getElementById('mic-btn').classList.add('recording');
        };

        recognition.onresult = (event) => {
            let transcript = '';
            for (let i = event.resultIndex; i < event.results.length; i++) {
                transcript += event.results[i][0].transcript;
            }
            document.getElementById('user-input').value = transcript;

            // 無音タイマーを 3.5秒にチューニング
            clearTimeout(silenceTimer);
            silenceTimer = setTimeout(() => {
                if (document.getElementById('user-input').value.trim()) {
                    stopSpeech();
                    sendMessage();
                }
            }, 3500);
        };

        recognition.onerror = (e) => {
            console.warn("音声認識エラー:", e.error);
            stopSpeech();
        };

        recognition.onend = () => { 
            if (isRecording) stopSpeech(); 
        };
    }

    function toggleSpeech() {
        if (!recognition) {
            alert("お使いのブラウザは音声入力に対応していません。");
            return;
        }
        if (isRecording) stopSpeech();
        else {
            document.getElementById('user-input').value = '';
            try {
                recognition.start();
            } catch (err) {
                stopSpeech();
            }
        }
    }

    function stopSpeech() {
        isRecording = false;
        clearTimeout(silenceTimer);
        document.getElementById('mic-btn').classList.remove('recording');
        if (recognition) {
            try { recognition.stop(); } catch(e){}
        }
    }

    async function sendMessage() {
        const input = document.getElementById('user-input');
        const text = input.value.trim();
        if (!text) return;
        
        // 感情判定 & 表情更新
        const expr = detectExpression(text);
        setExpression(expr);

        addBubble('user', text, '', '', false, true, false);
        input.value = '';
        addLoveExp(15); // メッセージ送信で好感度UP
        await getAIReply(text);
    }

    function sendQuick(text, catKey = '') {
        window.speechSynthesis.cancel();
        
        // カテゴリに基づく表情判定
        const expr = detectExpression(text, catKey);
        setExpression(expr);

        addBubble('user', text, '', '', false, true, false);
        addLoveExp(10); // クイック発言で好感度UP
        setTimeout(async () => { await getAIReply(text); }, 400);
    }

    /* 🌟 ⑤ キャラ別プロンプト連携バックエンド接続 */
    async function getAIReply(userText) {
        try {
            const promptData = CHARACTER_PROMPTS[currentChar];
            const systemPrompt = `${promptData.personality} ${promptData.steps[currentStep]}`;

            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    character: currentChar, 
                    message: userText, 
                    step: currentStep,
                    systemPrompt: systemPrompt
                })
            });
            const data = await response.json();
            if (data.reply) {
                addBubble('ai', data.reply, data.translation || '', data.tip || '', true, true, true);
            }
        } catch (e) {
            // API未接続時のフォールバック応答
            addBubble('ai', "I loved hearing from you!", "言葉を聞けてすごく嬉しかったよ！", "【解説】「I loved hearing from you」で「連絡くれてすごく嬉しかった」って意味だよ！", true, true, true);
        }
    }

    function speakText(text) {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const uttr = new SpeechSynthesisUtterance(text);
        const char = CHARS[currentChar];
        uttr.lang = 'en-US'; uttr.pitch = char.pitch; uttr.rate = char.rate;
        window.speechSynthesis.speak(uttr);
    }

    function replayCurrentModalVoice() {
        if (lastAIText) speakText(lastAIText);
    }

    function openModal(imgSrc, name, enText, jpText) {
        document.getElementById('modal-img').src = imgSrc;
        document.getElementById('modal-name').innerText = name;
        document.getElementById('modal-text-en').innerText = enText;
        document.getElementById('modal-text-jp').innerText = jpText || '';
        document.getElementById('oshi-modal').classList.add('active');
    }

    function closeModal() { 
        document.getElementById('oshi-modal').classList.remove('active'); 
        if (isCallMode) toggleCallMode(); // モーダルを閉じたら通話モード解除
    }
    
    function saveHistories() { localStorage.setItem('oshitalk_histories', JSON.stringify(chatHistories)); }

    function loadHistories() {
        const data = localStorage.getItem('oshitalk_histories');
        const days = parseInt(document.getElementById('history-retention').value || '7');
        if (data) {
            const parsed = JSON.parse(data);
            const now = Date.now();
            const cutoff = now - (days * 24 * 60 * 60 * 1000);
            Object.keys(parsed).forEach(k => {
                parsed[k] = parsed[k].filter(item => item.time > cutoff);
            });
            chatHistories = parsed;
        }
    }

    function saveHistorySetting(val) { loadHistories(); renderChatHistory(); }
    function handleKey(e) { if (e.key === 'Enter') sendMessage(); }
</script>
