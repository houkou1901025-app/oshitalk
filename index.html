<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oshitalk English - 推し活×英会話</title>
<style>
:root {
  --bg-color: #0f172a;
  --card-bg: rgba(30, 41, 59, 0.75);
  --text-main: #f8fafc;
  --text-sub: #94a3b8;
  --accent-leo: #f59e0b;
  --accent-noah: #8b5cf6;
  --accent-liam: #10b981;
  --accent-color: var(--accent-leo);
}

body {
  margin: 0; padding: 16px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background-color: var(--bg-color); color: var(--text-main);
  display: flex; justify-content: center; align-items: center; min-height: 100vh;
  box-sizing: border-box;
}

.container {
  width: 100%; max-width: 480px; background: var(--card-bg);
  backdrop-filter: blur(12px); border-radius: 24px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); position: relative;
  padding: 18px;
}

.header { text-align: center; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
.header h1 {
  margin: 0; font-size: 1.2rem; font-weight: 700;
  background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.subscribe-btn {
  background: linear-gradient(135deg, #f59e0b, #ec4899);
  color: #fff; border: none; padding: 4px 10px; border-radius: 12px;
  font-size: 0.75rem; font-weight: bold; cursor: pointer;
  box-shadow: 0 2px 8px rgba(245, 158, 11, 0.4);
}

/* 好感度 UI */
.love-level-box {
  background: rgba(15, 23, 42, 0.6); border-radius: 12px;
  padding: 6px 12px; margin-bottom: 10px; display: flex; align-items: center;
  gap: 10px; font-size: 0.75rem; border: 1px solid rgba(255, 255, 255, 0.05);
}
.love-badge {
  background: var(--accent-color); color: #0f172a; font-weight: bold;
  padding: 2px 8px; border-radius: 10px; white-space: nowrap;
}
.love-bar-bg { flex: 1; height: 8px; background: rgba(255, 255, 255, 0.1); border-radius: 4px; overflow: hidden; }
.love-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent-color), #ec4899); width: 0%; transition: width 0.4s ease; }

/* 表情テスト切替用 */
.expr-selector { display: flex; gap: 4px; justify-content: center; margin-bottom: 8px; }
.expr-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 2px 6px; border-radius: 8px; font-size: 0.65rem; cursor: pointer; }
.expr-btn:hover { background: var(--accent-color); color: #0f172a; }

/* キャラクター選択 */
.char-selector { display: flex; gap: 8px; margin-bottom: 10px; }
.char-card {
  flex: 1; background: rgba(15, 23, 42, 0.6); border: 2px solid transparent;
  border-radius: 16px; padding: 6px; text-align: center; cursor: pointer; transition: all 0.3s;
}
.char-card.active { border-color: var(--accent-color); background: rgba(255, 255, 255, 0.08); }
.char-card img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255, 255, 255, 0.2); }
.char-card .name { font-weight: 700; font-size: 0.8rem; }

/* コントロールパネル */
.control-panel {
  background: rgba(15, 23, 42, 0.5); border-radius: 12px; padding: 8px 12px;
  margin-bottom: 10px; display: flex; flex-direction: column; gap: 6px; font-size: 0.75rem;
}
.control-row { display: flex; justify-content: space-between; align-items: center; }
.step-btns { display: flex; gap: 4px; }
.step-btn { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; padding: 2px 8px; border-radius: 10px; cursor: pointer; font-size: 0.7rem; }
.step-btn.active { background: var(--accent-color); color: #0f172a; font-weight: bold; }
select, input[type="date"] { background: #1e293b; color: #fff; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 6px; padding: 2px 4px; font-size: 0.75rem; }

/* チャットエリア */
.chat-area { height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin-bottom: 10px; padding-right: 4px; }
.msg-row { display: flex; gap: 8px; align-items: flex-start; }
.msg-row.user { flex-direction: row-reverse; }
.msg-row img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; flex-shrink: 0; cursor: pointer; }
.bubble-container { max-width: 80%; display: flex; flex-direction: column; gap: 3px; }
.bubble { padding: 8px 12px; border-radius: 14px; font-size: 0.85rem; line-height: 1.4; }
.msg-row.ai .bubble { background: rgba(255, 255, 255, 0.1); border-top-left-radius: 2px; }
.msg-row.user .bubble { background: var(--accent-color); color: #0f172a; font-weight: 600; border-top-right-radius: 2px; }
.jp-sub { font-size: 0.73rem; color: #cbd5e1; margin-top: 2px; }
.english-tip { font-size: 0.72rem; background: rgba(0, 0, 0, 0.35); border-left: 3px solid var(--accent-color); padding: 6px 8px; border-radius: 0 6px 6px 0; color: #e2e8f0; margin-top: 3px; }
.replay-btn { align-self: flex-start; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; border-radius: 12px; padding: 2px 8px; font-size: 0.68rem; cursor: pointer; margin-top: 2px; }

/* トピック別クイック発言 */
.quick-toggle-container { margin-bottom: 10px; background: rgba(15, 23, 42, 0.6); border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); overflow: hidden; }
.quick-toggle-header { padding: 8px 12px; font-size: 0.75rem; font-weight: bold; background: rgba(255, 255, 255, 0.05); display: flex; justify-content: space-between; align-items: center; cursor: pointer; color: var(--accent-color); }
.quick-categories { display: flex; gap: 4px; overflow-x: auto; padding: 6px; scrollbar-width: none; background: rgba(0,0,0,0.2); }
.cat-tab { padding: 3px 8px; border-radius: 10px; font-size: 0.7rem; white-space: nowrap; cursor: pointer; background: rgba(255, 255, 255, 0.08); color: var(--text-main); }
.cat-tab.active { background: var(--accent-color); color: #0f172a; font-weight: bold; }
.quick-phrase-list { display: none; padding: 8px; gap: 6px; overflow-x: auto; background: rgba(15, 23, 42, 0.8); }
.quick-phrase-list.open { display: flex; }
.quick-btn { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15); color: var(--text-main); padding: 5px 10px; border-radius: 14px; font-size: 0.72rem; white-space: nowrap; cursor: pointer; flex-shrink: 0; }

/* 入力エリア */
.input-area { display: flex; gap: 6px; }
.input-area input { flex: 1; background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 18px; padding: 8px 14px; color: #fff; font-size: 0.85rem; outline: none; }
.btn { background: var(--accent-color); border: none; color: #0f172a; font-weight: bold; padding: 0 14px; border-radius: 18px; cursor: pointer; }
.btn-mic { background: rgba(255, 255, 255, 0.1); color: #fff; border: 1px solid rgba(255, 255, 255, 0.2); width: 38px; }

/* モーダル共通 */
.modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(12px); display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; z-index: 999; }
.modal-overlay.active { opacity: 1; pointer-events: auto; }
.modal-card { width: 85%; max-width: 320px; background: rgba(30, 41, 59, 0.95); border: 2px solid var(--accent-color); border-radius: 20px; padding: 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8); transition: all 0.3s ease; position: relative; }

/* 通話風UI (Call Mode) 全画面デザイン */
.modal-card.call-mode {
  width: 100vw !important; height: 100vh !important; max-width: 100vw !important; border-radius: 0 !important;
  border: none !important; background: linear-gradient(180deg, #0f172a 0%, #1e1b4b 100%) !important;
  display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 40px 20px !important; box-sizing: border-box;
}
.call-header { display: none; font-size: 1rem; color: #10b981; font-weight: bold; margin-bottom: 10px; }
.modal-card.call-mode .call-header { display: block; }
.modal-card.call-mode img {
  width: 75vw !important; height: 75vw !important; max-width: 300px !important; max-height: 300px !important;
  border-radius: 24px !important; border: 4px solid #10b981 !important; box-shadow: 0 0 30px rgba(16, 185, 129, 0.5) !important;
}
.wave-animation { display: none; justify-content: center; align-items: center; gap: 4px; margin: 15px 0; }
.modal-card.call-mode .wave-animation { display: flex; }
.wave-bar { width: 4px; height: 16px; background: #10b981; border-radius: 2px; animation: wave 1s infinite ease-in-out; }
.wave-bar:nth-child(2) { animation-delay: 0.2s; }
.wave-bar:nth-child(3) { animation-delay: 0.4s; }
@keyframes wave { 0%, 100% { height: 8px; } 50% { height: 24px; } }

.modal-card img { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent-color); margin-bottom: 10px; transition: all 0.3s ease; }
.modal-name { font-size: 1.1rem; font-weight: bold; color: var(--accent-color); margin-bottom: 6px; }
.modal-text-en { font-size: 0.95rem; font-weight: 600; line-height: 1.4; margin-bottom: 6px; }
.modal-text-jp { font-size: 0.8rem; color: #cbd5e1; margin-bottom: 14px; }
.modal-btns { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.modal-btn { background: var(--accent-color); color: #0f172a; border: none; padding: 8px 14px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 0.75rem; }
.modal-btn.sec { background: rgba(255, 255, 255, 0.15); color: #fff; }
.modal-btn.call { background: #10b981; color: #fff; }

/* 課金プランモーダル */
.plan-card { background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 10px; margin: 10px 0; text-align: left; font-size: 0.8rem; }
.plan-title { color: #f59e0b; font-weight: bold; display: flex; justify-content: space-between; }
.pay-btn { background: linear-gradient(135deg, #ec4899, #8b5cf6); color: #fff; border: none; width: 100%; padding: 10px; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 10px; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Oshitalk English</h1>
    <button class="subscribe-btn" onclick="openPayModal()">✨ PROプラン</button>
  </div>

  <!-- 好感度 バー -->
  <div class="love-level-box">
    <span class="love-badge" id="love-level-badge">Lv.1 Sweetheart</span>
    <div class="love-bar-bg">
      <div class="love-bar-fill" id="love-bar-fill"></div>
    </div>
    <span id="love-exp-text" style="font-size:0.7rem; color: #cbd5e1;">0/100</span>
  </div>

  <!-- キャラクター選択 -->
  <div class="char-selector">
    <div class="char-card active" onclick="selectChar('leo')" id="card-leo">
      <img id="avatar-leo" src="leo.jpg" alt="Leo"><div class="name">Leo</div>
    </div>
    <div class="char-card" onclick="selectChar('noah')" id="card-noah">
      <img id="avatar-noah" src="noah.jpg" alt="Noah"><div class="name">Noah</div>
    </div>
    <div class="char-card" onclick="selectChar('liam')" id="card-liam">
      <img id="avatar-liam" src="liam.jpg" alt="Liam"><div class="name">Liam</div>
    </div>
  </div>

  <!-- 表情テスト切替用ボタン -->
  <div class="expr-selector">
    <button class="expr-btn" onclick="setExpression('default')">通常</button>
    <button class="expr-btn" onclick="setExpression('happy')">笑顔</button>
    <button class="expr-btn" onclick="setExpression('blush')">照れ</button>
    <button class="expr-btn" onclick="setExpression('angry')">嫉妬/おこ</button>
    <button class="expr-btn" onclick="setExpression('sad')">切ない</button>
  </div>

  <div class="control-panel">
    <div class="control-row">
      <span>会話ステップ:</span>
      <div class="step-btns">
        <button class="step-btn" id="step-1" onclick="setStep(1)">Step 1</button>
        <button class="step-btn active" id="step-2" onclick="setStep(2)">Step 2</button>
        <button class="step-btn" id="step-3" onclick="setStep(3)">Step 3</button>
      </div>
    </div>
    <div class="control-row">
      <span>履歴保存:</span>
      <select id="history-retention" onchange="saveHistorySetting(this.value)">
        <option value="1">1日間</option>
        <option value="7" selected>1週間</option>
        <option value="999">無制限</option>
      </select>
    </div>
    <div class="control-row">
      <span>My Birthday:</span>
      <input type="date" id="user-birthday" onchange="saveBirthday(this.value)">
    </div>
  </div>

  <div class="chat-area" id="chat-area"></div>

  <!-- クイック発言 -->
  <div class="quick-toggle-container">
    <div class="quick-toggle-header" onclick="toggleQuickPanel()">
      <span>トピック別クイック発言</span>
      <span id="toggle-icon">▲</span>
    </div>
    <div class="quick-categories" id="quick-cats"></div>
    <div class="quick-phrase-list open" id="quick-phrase-list"></div>
  </div>

  <div class="input-area">
    <button class="btn btn-mic" id="mic-btn" onclick="toggleSpeech()">🎤</button>
    <input type="text" id="user-input" placeholder="英語でメッセージを入力..." onkeypress="handleKey(event)">
    <button class="btn" onclick="sendMessage()">送信</button>
  </div>
</div>

<!-- 推しモーダル Popup (通話風UI拡張) -->
<div class="modal-overlay" id="oshi-modal" onclick="closeModal()">
  <div class="modal-card" id="modal-card-box" onclick="event.stopPropagation()">
    <div class="call-header" id="call-header">📞 通話モード - 接続中...</div>
    <img id="modal-img" src="leo.jpg" alt="Oshi">
    <div class="wave-animation">
      <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
    </div>
    <div class="modal-name" id="modal-name">Leo</div>
    <div class="modal-text-en" id="modal-text-en"></div>
    <div class="modal-text-jp" id="modal-text-jp"></div>
    <div class="modal-btns">
      <button class="modal-btn sec" onclick="replayCurrentModalVoice()">もう一度聞く</button>
      <button class="modal-btn call" id="btn-toggle-call" onclick="toggleCallMode()">通話モード切替</button>
      <button class="modal-btn" onclick="closeModal()">閉じる</button>
    </div>
  </div>
</div>

<!-- 課金登録モーダル -->
<div class="modal-overlay" id="pay-modal" onclick="closePayModal()">
  <div class="modal-card" onclick="event.stopPropagation()">
    <div class="modal-name" style="color: #ec4899;">Oshitalk PRO</div>
    <p style="font-size: 0.8rem; color: #cbd5e1;">推しとの会話を無制限に楽しもう！</p>
    
    <div class="plan-card">
      <div class="plan-title"><span>月額 VIP プラン</span> <span>¥980 / 月</span></div>
      <p style="font-size: 0.7rem; color: #94a3b8; margin: 4px 0 0 0;">・ボイス無制限再生<br>・通話モード無制限<br>・限定表情＆シチュエーション解放</p>
    </div>

    <button class="pay-btn" onclick="processPayment()">✨ 今すぐ登録する（7日間無料）</button>
    <button class="modal-btn sec" style="margin-top: 8px; width: 100%;" onclick="closePayModal()">キャンセル</button>
  </div>
</div>

<script>
const CHARS = {
  leo: {
    name: 'Leo', color: '#f59e0b', pitch: 0.75, rate: 0.95,
    greet: 'Good morning, sweetheart. I was thinking about you.',
    greetJp: 'おはよう。今日も君に会えて嬉しいよ。',
    expressions: { default: 'leo.jpg', happy: 'leo_happy.jpg', blush: 'leo_blush.jpg', angry: 'leo_angry.jpg', sad: 'leo_sad.jpg' }
  },
  noah: {
    name: 'Noah', color: '#8b5cf6', pitch: 0.6, rate: 0.9,
    greet: "You're here. So, what do you want to talk about today?",
    greetJp: '来たんだ。で、今日は何話すの？',
    expressions: { default: 'noah.jpg', happy: 'noah_happy.jpg', blush: 'noah_blush.jpg', angry: 'noah_angry.jpg', sad: 'noah_sad.jpg' }
  },
  liam: {
    name: 'Liam', color: '#10b981', pitch: 0.85, rate: 1.0,
    greet: "Hey! I'm so happy to talk with you today!",
    greetJp: 'やっほー！今日もお喋りできてめっちゃ嬉しい！',
    expressions: { default: 'liam.jpg', happy: 'liam_happy.jpg', blush: 'liam_blush.jpg', angry: 'liam_angry.jpg', sad: 'liam_sad.jpg' }
  }
};

const QUICK_DATA = {
  life: { title: '生活', phrases: [{en: "Good morning!", jp: "朝の挨拶"}, {en: "It's raining today.", jp: "今日は雨だね"}] },
  feeling: { title: '感情', phrases: [{en: "I missed you so much!", jp: "すごく会いたかった！"}, {en: "I love you!", jp: "大好きだよ！"}] },
  angry: { title: 'ぷんぷん', phrases: [{en: "You are late!", jp: "遅刻だよ！"}, {en: "I'm angry at you!", jp: "もう怒ったんだから！"}] },
  support: { title: '悩み', phrases: [{en: "I'm so tired today...", jp: "今日すごく疲れた..."}, {en: "I feel a bit lonely.", jp: "ちょっと寂しいな"}] }
};

let currentChar = 'leo';
let currentExpression = 'default';
let currentStep = 2;
let currentCat = 'life';
let isQuickOpen = true;
let chatHistories = { leo: [], noah: [], liam: [] };
let isRecording = false;
let recognition = null;
let silenceTimer = null;
let lastAIText = '';
let isCallMode = false;
let loveExp = 0;
let loveLevel = 1;

window.onload = () => {
  loadHistories();
  loadBirthday();
  loadLoveLevel();
  selectChar('leo');
  setupSpeechRecognition();
  initQuickPanel();
  checkBirthday();
};

/* 表情切り替え */
function setExpression(expr) {
  currentExpression = expr || 'default';
  const char = CHARS[currentChar];
  const imgSrc = char.expressions[currentExpression] || char.expressions.default;
  
  const charImg = document.querySelector(`#card-${currentChar} img`);
  if (charImg) charImg.src = imgSrc;
  document.getElementById('modal-img').src = imgSrc;
}

function detectExpression(text, category = '') {
  const lower = text.toLowerCase();
  if (category === 'angry' || lower.includes('angry') || lower.includes('late')) return 'angry';
  if (category === 'support' || lower.includes('sad') || lower.includes('tired')) return 'sad';
  if (category === 'feeling' || lower.includes('love') || lower.includes('miss')) return 'blush';
  if (lower.includes('happy') || lower.includes('fun') || lower.includes('great')) return 'happy';
  return 'default';
}

/* 好感度 */
function addLoveExp(pts) {
  loveExp += pts;
  const maxExp = loveLevel * 100;
  if (loveExp >= maxExp) {
    loveExp = maxExp;
    loveLevel++;
    alert(`🎉 Level Up! 好感度が Lv.${loveLevel} に上がりました！`);
  }
  saveLoveLevel();
  updateLoveUI();
}

function updateLoveUI() {
  const maxExp = loveLevel * 100;
  const pct = Math.min(100, Math.floor((loveExp / maxExp) * 100));
  document.getElementById('love-bar-fill').style.width = pct + '%';
  document.getElementById('love-exp-text').innerText = `${loveExp}/${maxExp}`;
  const titles = ["Sweetheart", "Close Friend", "Special One", "Soulmate", "Forever Love"];
  const title = titles[Math.min(titles.length - 1, loveLevel - 1)];
  document.getElementById('love-level-badge').innerText = `Lv.${loveLevel} ${title}`;
}

function saveLoveLevel() {
  localStorage.setItem('oshitalk_love_exp', loveExp);
  localStorage.setItem('oshitalk_love_lvl', loveLevel);
}

function loadLoveLevel() {
  loveExp = parseInt(localStorage.getItem('oshitalk_love_exp') || '0');
  loveLevel = parseInt(localStorage.getItem('oshitalk_love_lvl') || '1');
  updateLoveUI();
}

/* 誕生日 */
function saveBirthday(val) { localStorage.setItem('oshitalk_user_birthday', val); }
function loadBirthday() { const b = localStorage.getItem('oshitalk_user_birthday'); if (b) document.getElementById('user-birthday').value = b; }
function checkBirthday() {
  const b = localStorage.getItem('oshitalk_user_birthday');
  if (!b) return;
  const today = new Date();
  const bDate = new Date(b);
  if (today.getMonth() === bDate.getMonth() && today.getDate() === bDate.getDate()) {
    setTimeout(() => {
      setExpression('blush');
      addBubble('ai', "Happy Birthday, my love!", "誕生日おめでとう！特別な日を一緒に祝えて嬉しいよ！", "今日は特別な1日！", true, true, true);
    }, 1000);
  }
}

/* 通話モード */
function toggleCallMode() {
  isCallMode = !isCallMode;
  const cardBox = document.getElementById('modal-card-box');
  const btn = document.getElementById('btn-toggle-call');
  if (isCallMode) {
    cardBox.classList.add('call-mode');
    btn.innerText = "通常表示に戻す";
  } else {
    cardBox.classList.remove('call-mode');
    btn.innerText = "通話モード切替";
  }
}

/* モーダル表示 */
function openModal(imgSrc, name, enText, jpText) {
  document.getElementById('modal-img').src = imgSrc;
  document.getElementById('modal-name').innerText = name;
  document.getElementById('modal-text-en').innerText = enText;
  document.getElementById('modal-text-jp').innerText = jpText || '';
  document.getElementById('oshi-modal').classList.add('active');
}
function closeModal() {
  document.getElementById('oshi-modal').classList.remove('active');
  if (isCallMode) toggleCallMode();
}

/* 課金モーダル */
function openPayModal() { document.getElementById('pay-modal').classList.add('active'); }
function closePayModal() { document.getElementById('pay-modal').classList.remove('active'); }
function processPayment() {
  alert("✨ PROプランへのご登録ありがとうございます！（デモ処理）");
  closePayModal();
}

/* クイックパネル */
function initQuickPanel() {
  const catContainer = document.getElementById('quick-cats');
  catContainer.innerHTML = '';
  Object.keys(QUICK_DATA).forEach(key => {
    const cat = QUICK_DATA[key];
    const btn = document.createElement('div');
    btn.className = `cat-tab ${key === currentCat ? 'active' : ''}`;
    btn.innerText = cat.title;
    btn.onclick = (e) => selectCategory(key, e);
    catContainer.appendChild(btn);
  });
  renderPhrases();
}

function selectCategory(key, event) {
  currentCat = key;
  document.querySelectorAll('.cat-tab').forEach(tab => tab.classList.remove('active'));
  if (event && event.target) event.target.classList.add('active');
  renderPhrases();
}

function renderPhrases() {
  const list = document.getElementById('quick-phrase-list');
  list.innerHTML = '';
  const phrases = QUICK_DATA[currentCat].phrases;
  phrases.forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'quick-btn';
    btn.innerText = p.jp;
    btn.onclick = () => sendQuick(p.en, currentCat);
    list.appendChild(btn);
  });
}

function toggleQuickPanel() {
  isQuickOpen = !isQuickOpen;
  const list = document.getElementById('quick-phrase-list');
  const cats = document.getElementById('quick-cats');
  const icon = document.getElementById('toggle-icon');
  if (isQuickOpen) {
    list.classList.add('open');
    cats.style.display = 'flex';
    icon.innerText = '▲';
  } else {
    list.classList.remove('open');
    cats.style.display = 'none';
    icon.innerText = '▼';
  }
}

function setStep(s) {
  currentStep = s;
  document.querySelectorAll('.step-btn').forEach(btn => btn.classList.remove('active'));
  document.getElementById(`step-${s}`).classList.add('active');
}

function selectChar(key) {
  window.speechSynthesis.cancel();
  currentChar = key;
  const char = CHARS[key];
  document.querySelectorAll('.char-card').forEach(card => card.classList.remove('active'));
  document.getElementById(`card-${key}`).classList.add('active');
  document.documentElement.style.setProperty('--accent-color', char.color);
  setExpression('default');
  renderChatHistory();
}

function renderChatHistory() {
  const chatArea = document.getElementById('chat-area');
  chatArea.innerHTML = '';
  const history = chatHistories[currentChar];
  if (!history || history.length == 0) {
    const char = CHARS[currentChar];
    addBubble('ai', char.greet, char.greetJp, `「${char.name}」との会話をスタートしよう！`, false, false, false);
  } else {
    history.forEach(item => {
      addBubble(item.sender, item.text, item.subText, item.tipText, false, false, false);
    });
  }
}

function addBubble(sender, text, subText = '', tipText = '', showPopup = true, save = true, autoSpeak = true) {
  const chatArea = document.getElementById('chat-area');
  const row = document.createElement('div');
  row.className = `msg-row ${sender}`;
  const char = CHARS[currentChar];
  const avatarUrl = sender === 'ai' ? (char.expressions[currentExpression] || char.expressions.default) : 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop';
  
  if (sender === 'ai') lastAIText = text;
  
  row.innerHTML = `
    <img src="${avatarUrl}" onclick="openModal('${avatarUrl}', '${char.name}', '${text.replace(/'/g, "\\'")}', '${subText.replace(/'/g, "\\'")}')">
    <div class="bubble-container">
      <div class="bubble">${text}</div>
      ${subText ? `<span class="jp-sub">${subText}</span>` : ''}
      ${tipText ? `<div class="english-tip"><strong>${char.name}'s Tip:</strong> ${tipText}</div>` : ''}
      ${sender === 'ai' ? `<button class="replay-btn" onclick="speakText('${text.replace(/'/g, "\\'")}')">🔊 もう一度聞く</button>` : ''}
    </div>
  `;
  chatArea.appendChild(row);
  chatArea.scrollTop = chatArea.scrollHeight;

  if (save) {
    if (!chatHistories[currentChar]) chatHistories[currentChar] = [];
    chatHistories[currentChar].push({ sender, text, subText, tipText, time: Date.now() });
    saveHistories();
  }
  if (sender === 'ai' && autoSpeak) {
    speakText(text);
    if (showPopup) openModal(avatarUrl, char.name, text, subText);
  }
}

function setupSpeechRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) return;
  recognition = new SpeechRecognition();
  recognition.lang = 'en-US';
  recognition.interimResults = true;
  recognition.continuous = true;

  recognition.onstart = () => { isRecording = true; document.getElementById('mic-btn').classList.add('recording'); };
  recognition.onresult = (event) => {
    let transcript = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      transcript += event.results[i][0].transcript;
    }
    document.getElementById('user-input').value = transcript;
    clearTimeout(silenceTimer);
    silenceTimer = setTimeout(() => {
      if (document.getElementById('user-input').value.trim()) {
        stopSpeech();
        sendMessage();
      }
    }, 3500);
  };
  recognition.onerror = (e) => { stopSpeech(); };
  recognition.onend = () => { if (isRecording) stopSpeech(); };
}

function toggleSpeech() {
  if (!recognition) { alert("お使いのブラウザは音声入力に対応していません。"); return; }
  if (isRecording) stopSpeech();
  else {
    document.getElementById('user-input').value = '';
    try { recognition.start(); } catch (err) { stopSpeech(); }
  }
}

function stopSpeech() {
  isRecording = false;
  clearTimeout(silenceTimer);
  document.getElementById('mic-btn').classList.remove('recording');
  if (recognition) { try { recognition.stop(); } catch(e) {} }
}

async function sendMessage() {
  const input = document.getElementById('user-input');
  const text = input.value.trim();
  if (!text) return;

  const expr = detectExpression(text);
  setExpression(expr);
  addBubble('user', text, '', '', false, true, false);
  input.value = '';
  addLoveExp(15);
  await getAIReply(text);
}

function sendQuick(text, catKey = '') {
  window.speechSynthesis.cancel();
  const expr = detectExpression(text, catKey);
  setExpression(expr);
  addBubble('user', text, '', '', false, true, false);
  addLoveExp(10);
  setTimeout(async () => { await getAIReply(text); }, 400);
}

async function getAIReply(userText) {
  try {
    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ character: currentChar, message: userText, step: currentStep })
    });
    const data = await response.json();
    if (data.reply) {
      const aiExpr = detectExpression(data.reply);
      setExpression(aiExpr);
      addBubble('ai', data.reply, data.translation || '', data.tip || '', true, true, true);
    }
  } catch (e) {
    const fallbackExpr = detectExpression(userText);
    setExpression(fallbackExpr);
    addBubble('ai', "I loved hearing from you!", "言葉を聞けてすごく嬉しかったよ！", "「I loved hearing from you」で「連絡くれて嬉しかった」という意味だよ！", true, true, true);
  }
}

function speakText(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const uttr = new SpeechSynthesisUtterance(text);
  const char = CHARS[currentChar];
  uttr.lang = 'en-US';
  uttr.pitch = char.pitch;
  uttr.rate = char.rate;
  window.speechSynthesis.speak(uttr);
}

function replayCurrentModalVoice() { if (lastAIText) speakText(lastAIText); }

function saveHistories() { localStorage.setItem('oshitalk_histories', JSON.stringify(chatHistories)); }
function loadHistories() {
  const data = localStorage.getItem('oshitalk_histories');
  const days = parseInt(document.getElementById('history-retention').value || '7');
  if (data) {
    const parsed = JSON.parse(data);
    const now = Date.now();
    const cutoff = now - (days * 24 * 60 * 60 * 1000);
    Object.keys(parsed).forEach(k => { parsed[k] = parsed[k].filter(item => item.time > cutoff); });
    chatHistories = parsed;
  }
}
function saveHistorySetting(val) { loadHistories(); renderChatHistory(); }
function handleKey(e) { if (e.key === 'Enter') sendMessage(); }
</script>
