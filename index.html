<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>推しトーク English</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
    }
    .app-container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      height: 100dvh;
      background-color: #1e293b;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }
    /* ヘッダー */
    header {
      padding: 12px 16px;
      background-color: #0f172a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }
    .char-select-btn {
      background: #334155;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 14px;
      cursor: pointer;
    }
    /* 通常チャットエリア */
    .chat-history {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }
    .message-bubble {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.4;
    }
    .message-user {
      align-self: flex-end;
      background-color: #2563eb;
      color: white;
      border-bottom-right-radius: 4px;
    }
    .message-char {
      align-self: flex-start;
      background-color: #334155;
      color: #f8fafc;
      border-bottom-left-radius: 4px;
    }
    .translation {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 4px;
    }
    .tip-box {
      font-size: 11px;
      color: #fbbf24;
      margin-top: 4px;
      background: rgba(251, 191, 36, 0.1);
      padding: 4px 8px;
      border-radius: 6px;
    }

    /* ヒント表示エリア */
    .hints-container {
      padding: 8px 12px;
      background-color: #0f172a;
      border-top: 1px solid #334155;
    }
    .hints-title {
      font-size: 12px;
      color: #38bdf8;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }
    .hint-btn {
      width: 100%;
      text-align: left;
      background-color: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 8px 12px;
      margin-bottom: 6px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
    }
    .hint-btn:active {
      background-color: #334155;
    }

    /* 入力エリア */
    .input-area {
      padding: 8px 12px;
      background-color: #0f172a;
      display: flex;
      gap: 8px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      border-radius: 20px;
      border: 1px solid #334155;
      background-color: #1e293b;
      color: #fff;
      font-size: 14px;
    }
    .send-btn, .call-mode-trigger {
      padding: 8px 16px;
      border-radius: 20px;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    .send-btn { background-color: #2563eb; color: white; }
    .call-mode-trigger { background-color: #10b981; color: white; }

    /* =======================================
       📞 通話モード（レイアウト最適化版）
    ======================================= */
    .call-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #0f172a 0%, #0284c7 100%);
      display: none;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px;
      z-index: 100;
    }
    .call-header {
      text-align: center;
      padding-top: 4px;
    }
    .call-status {
      font-size: 14px;
      color: #38bdf8;
      font-weight: bold;
    }
    
    /* 修正②：推し画像の拡大（130px） */
    .call-avatar-wrap {
      text-align: center;
      margin: 6px 0;
    }
    .call-avatar {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      border: 3px solid #38bdf8;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
      object-fit: cover;
    }
    .call-char-name {
      font-size: 18px;
      font-weight: bold;
      margin-top: 4px;
    }

    /* 修正①＆③：チャット履歴の高さを抑えてスマホ画面に全ボタンを収める */
    .call-chat-history {
      flex: 1;
      max-height: 28vh; /* 高さをコンパクトに抑える */
      overflow-y: auto;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 12px;
      padding: 10px;
      margin: 6px 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      scroll-behavior: smooth;
    }

    /* 通話モード内のヒント */
    .call-hints {
      background: rgba(15, 23, 42, 0.8);
      border-radius: 10px;
      padding: 8px;
    }

    /* 修正③：操作ボタン群のコンパクト化 */
    .call-controls {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 4px;
    }
    .call-btn-row {
      display: flex;
      gap: 6px;
    }
    .call-btn {
      flex: 1;
      padding: 10px 4px;
      border: none;
      border-radius: 10px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }
    .btn-voice { background-color: #10b981; color: white; }
    .btn-clear { background-color: #64748b; color: white; }
    .btn-send { background-color: #2563eb; color: white; }
    .btn-repeat { background-color: #3b82f6; color: white; }
    .btn-normal { background-color: #06b6d4; color: white; }
    .btn-hangup { background-color: #ef4444; color: white; }
  </style>
</head>
<body>

<div class="app-container">
  <!-- ヘッダー -->
  <header>
    <div style="font-weight: bold;">推しトーク English</div>
    <select id="charSelect" class="char-select-btn" onchange="changeCharacter()">
      <option value="leo">Leo (レオ)</option>
      <option value="noah">Noah (ノア)</option>
      <option value="liam">Liam (リアム)</option>
    </select>
  </header>

  <!-- 通常チャット画面 -->
  <div class="chat-history" id="chatHistory">
    <div class="message-bubble message-char">
      Hello! I'm so happy to talk with you today.
      <div class="translation">こんにちは！今日はお話しできて本当に嬉しいよ。</div>
    </div>
  </div>

  <!-- ヒント表示 -->
  <div class="hints-container">
    <div class="hints-title">
      <span>💡 返答ヒント (タップで入力)</span>
      <span id="stepLabel">Step 1</span>
    </div>
    <div id="hintsList">
      <button class="hint-btn" onclick="useHint('Hello!')">Hello! (こんにちは！)</button>
    </div>
  </div>

  <!-- 入力エリア -->
  <div class="input-area">
    <button class="call-mode-trigger" onclick="openCallMode()">📞 通話</button>
    <input type="text" id="userInput" placeholder="英語でメッセージを入力..." onkeypress="handleKeyPress(event)">
    <button class="send-btn" onclick="sendMessage()">送信</button>
  </div>

  <!-- 📞 通話モードオーバーレイ -->
  <div class="call-overlay" id="callOverlay">
    <div class="call-header">
      <div class="call-status">📞 音声通話中...</div>
    </div>

    <!-- 拡大された推し画像 -->
    <div class="call-avatar-wrap">
      <img id="callAvatar" src="leo.jpg" class="call-avatar" alt="推しキャラ">
      <div id="callCharName" class="call-char-name">Leo</div>
    </div>

    <!-- 通話モード用チャット履歴（自動スクロール対象） -->
    <div class="call-chat-history" id="callChatHistory">
      <!-- 履歴がここに追加されます -->
    </div>

    <!-- 通話用ヒント -->
    <div class="call-hints">
      <div class="hints-title">💡 返答ヒント</div>
      <div id="callHintsList"></div>
    </div>

    <!-- 操作ボタン（画面下部に綺麗に収まる設計） -->
    <div class="call-controls">
      <div class="call-btn-row">
        <button class="call-btn btn-voice" onclick="startVoiceInput()">🎤 音声入力</button>
        <button class="call-btn btn-clear" onclick="clearInput()">🗑 削除</button>
        <button class="call-btn btn-send" onclick="sendMessage()">📩 送信</button>
      </div>
      <div class="call-btn-row">
        <button class="call-btn btn-repeat" onclick="repeatVoice()">🔊 もう一度聞く</button>
        <button class="call-btn btn-normal" onclick="closeCallMode()">通常表示に戻す</button>
        <button class="call-btn btn-hangup" onclick="closeCallMode()">切断して閉じる</button>
      </div>
    </div>
  </div>
</div>

<script>
  let currentStep = 1;
  let chatHistoryData = [];

  // 修正①：自動最下部スクロール処理
  function scrollToBottom() {
    const chatHistory = document.getElementById('chatHistory');
    const callChatHistory = document.getElementById('callChatHistory');
    if (chatHistory) chatHistory.scrollTop = chatHistory.scrollHeight;
    if (callChatHistory) callChatHistory.scrollTop = callChatHistory.scrollHeight;
  }

  // 通話モードを開く（開いた瞬間に最下部へスクロール）
  function openCallMode() {
    document.getElementById('callOverlay').style.display = 'flex';
    syncCallHistory();
    setTimeout(scrollToBottom, 50);
  }

  function closeCallMode() {
    document.getElementById('callOverlay').style.display = 'none';
  }

  function syncCallHistory() {
    const callChatHistory = document.getElementById('callChatHistory');
    const mainChatHistory = document.getElementById('chatHistory');
    callChatHistory.innerHTML = mainChatHistory.innerHTML;
    scrollToBottom();
  }

  function handleKeyPress(e) {
    if (e.key === 'Enter') sendMessage();
  }

  function useHint(text) {
    document.getElementById('userInput').value = text;
  }

  async function sendMessage() {
    const inputEl = document.getElementById('userInput');
    const message = inputEl.value.trim();
    if (!message) return;

    // ユーザー発言の追加
    appendMessage('user', message);
    inputEl.value = '';
    chatHistoryData.push({ sender: 'user', text: message });

    try {
      const char = document.getElementById('charSelect').value;
      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          character: char,
          message: message,
          step: currentStep,
          history: chatHistoryData
        })
      });

      const data = await response.json();

      // キャラクター返答の追加
      appendMessage('char', data.reply, data.translation, data.tip);
      chatHistoryData.push({ sender: 'char', text: data.reply });

      // ヒントの更新
      updateHints(data.hints);

    } catch (err) {
      console.error(err);
    }
  }

  function appendMessage(sender, text, translation = '', tip = '') {
    const chatHistory = document.getElementById('chatHistory');
    const div = document.createElement('div');
    div.className = `message-bubble ${sender === 'user' ? 'message-user' : 'message-char'}`;
    
    let html = text;
    if (translation) html += `<div class="translation">${translation}</div>`;
    if (tip) html += `<div class="tip-box">💡 ${tip}</div>`;
    div.innerHTML = html;

    chatHistory.appendChild(div);
    syncCallHistory(); // 通話画面にも同期して最下部スクロール
  }

  function updateHints(hints) {
    if (!hints) return;
    const hintsList = document.getElementById('hintsList');
    const callHintsList = document.getElementById('callHintsList');
    
    let html = '';
    hints.forEach(h => {
      html += `<button class="hint-btn" onclick="useHint('${h.en}')">${h.en} (${h.jp})</button>`;
    });

    hintsList.innerHTML = html;
    callHintsList.innerHTML = html;
  }

  function changeCharacter() {
    const char = document.getElementById('charSelect').value;
    document.getElementById('callAvatar').src = `${char}.jpg`;
    document.getElementById('callCharName').innerText = char.toUpperCase();
  }
</script>

</body>
</html>
