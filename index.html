<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OshiTalk English - 推し活×英会話</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f111a;
            --card-bg: rgba(255, 255, 255, 0.06);
            --card-border: rgba(255, 255, 255, 0.12);
            --accent-leo: #f59e0b;
            --accent-noah: #3b82f6;
            --accent-liam: #10b981;
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
            --heart-red: #ec4899;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Zen Maru Gothic', 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(245, 158, 11, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 540px;
            background: rgba(20, 24, 38, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header-title h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-title p {
            font-size: 12px;
            color: var(--text-sub);
            margin-top: 2px;
        }

        .settings-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: #fff;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .settings-btn:hover { background: rgba(255, 255, 255, 0.15); }

        /* キャラクター選択タブ */
        .char-tabs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }

        .tab-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .tab-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid transparent;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .tab-name { font-size: 14px; font-weight: 700; }

        .tab-btn[data-char="leo"].active { border-color: var(--accent-leo); background: rgba(245, 158, 11, 0.15); }
        .tab-btn[data-char="leo"].active .tab-avatar { border-color: var(--accent-leo); }
        .tab-btn[data-char="leo"] .tab-name { color: var(--accent-leo); }

        .tab-btn[data-char="noah"].active { border-color: var(--accent-noah); background: rgba(59, 130, 246, 0.15); }
        .tab-btn[data-char="noah"].active .tab-avatar { border-color: var(--accent-noah); }
        .tab-btn[data-char="noah"] .tab-name { color: var(--accent-noah); }

        .tab-btn[data-char="liam"].active { border-color: var(--accent-liam); background: rgba(16, 185, 129, 0.15); }
        .tab-btn[data-char="liam"].active .tab-avatar { border-color: var(--accent-liam); }
        .tab-btn[data-char="liam"] .tab-name { color: var(--accent-liam); }

        /* プロフィール ＆ 親密度 */
        .profile-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 16px;
        }

        .profile-main {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 10px;
        }

        .profile-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #fff;
            flex-shrink: 0;
        }

        .profile-info h2 { font-size: 15px; font-weight: 700; }
        .profile-info h2 span { font-size: 11px; color: var(--text-sub); margin-left: 6px; font-weight: normal; }
        .profile-info p { font-size: 12px; color: #d1d5db; margin-top: 2px; }

        .love-section {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.25);
            padding: 8px 12px;
            border-radius: 12px;
        }

        .love-badge {
            font-size: 11px;
            font-weight: bold;
            color: var(--heart-red);
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        .love-bar-bg {
            flex: 1;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .love-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #f43f5e, #ec4899);
            border-radius: 4px;
            transition: width 0.4s ease;
        }

        .love-level-text {
            font-size: 11px;
            font-weight: bold;
            color: #f3f4f6;
            min-width: 55px;
            text-align: right;
        }

        /* チャットエリア */
        .chat-box {
            background: rgba(15, 17, 26, 0.5);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            height: 280px;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 16px;
        }

        .msg-row { display: flex; gap: 10px; align-items: flex-start; }
        .msg-row.user { flex-direction: row-reverse; }

        .msg-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
        .msg-user-icon {
            width: 36px; height: 36px; border-radius: 50%;
            background: #4f46e5; color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: bold; flex-shrink: 0;
        }

        .msg-content { max-width: 80%; }
        .bubble {
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 13.5px;
            line-height: 1.5;
        }

        .msg-row.user .bubble { background: #3b82f6; color: #fff; border-bottom-right-radius: 4px; }
        .msg-row.char .bubble {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f3f4f6;
            border-bottom-left-radius: 4px;
        }

        .jp-trans {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 4px;
            padding-top: 4px;
            border-top: 1px dashed rgba(255, 255, 255, 0.1);
        }

        .speak-btn {
            background: none; border: none; color: #9ca3af;
            cursor: pointer; font-size: 12px; margin-top: 6px;
            display: inline-flex; align-items: center; gap: 4px;
            transition: color 0.2s;
        }
        .speak-btn:hover { color: #60a5fa; }

        .tip-card {
            margin-top: 8px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 10px 12px;
            font-size: 12px;
        }
        .tip-header { color: #fbbf24; font-weight: bold; margin-bottom: 4px; }
        .tip-phrase { font-family: 'Outfit', sans-serif; font-weight: 700; color: #60a5fa; }
        .tip-desc { color: #d1d5db; margin-top: 2px; line-height: 1.4; }

        /* クイックボタン */
        .quick-section { margin-bottom: 12px; }
        .quick-label { font-size: 11px; color: var(--text-sub); margin-bottom: 6px; }
        .quick-btns { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; }
        .quick-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: #e5e7eb; padding: 6px 12px;
            border-radius: 20px; font-size: 11px;
            cursor: pointer; white-space: nowrap; transition: all 0.2s;
            flex-shrink: 0;
        }
        .quick-btn:hover { background: rgba(255, 255, 255, 0.15); border-color: #60a5fa; }

        /* 入力フォーム & 日英切り替えボタン */
        .input-form { display: flex; gap: 6px; align-items: center; }
        .input-field {
            flex: 1; background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--card-border);
            border-radius: 14px; padding: 12px 14px;
            color: #fff; font-size: 13px; outline: none;
        }
        .input-field:focus { border-color: #60a5fa; }

        .lang-switch-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--card-border);
            color: #38bdf8; font-size: 11px; font-weight: bold;
            padding: 10px 8px; border-radius: 12px; cursor: pointer;
            white-space: nowrap; transition: all 0.2s;
        }
        .lang-switch-btn:hover { background: rgba(56, 189, 248, 0.15); }

        .mic-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #fff; border: 1px solid var(--card-border);
            border-radius: 14px; padding: 10px 12px;
            font-size: 15px; cursor: pointer; transition: all 0.2s;
        }
        .mic-btn.recording { background: #ef4444; animation: pulse 1.2s infinite; }
        @keyframes pulse { 0%{transform:scale(1);} 50%{transform:scale(1.05);} 100%{transform:scale(1);} }

        .send-btn {
            background: #f3f4f6; color: #111827;
            border: none; border-radius: 14px;
            padding: 10px 16px; font-weight: bold;
            font-size: 13px; cursor: pointer;
        }

        /* モーダル */
        .modal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(8px);
            border-radius: 24px; display: none; justify-content: center;
            align-items: center; z-index: 100; padding: 20px;
        }
        .modal-overlay.active { display: flex; }

        .modal-content {
            background: #181c2b; border: 1px solid var(--card-border);
            border-radius: 20px; padding: 20px; width: 100%; max-width: 400px;
        }
        .modal-content h3 { font-size: 16px; margin-bottom: 14px; text-align: center; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-sub); margin-bottom: 6px; }
        .form-group input {
            width: 100%; background: rgba(0,0,0,0.3);
            border: 1px solid var(--card-border);
            border-radius: 10px; padding: 10px; color: #fff; font-size: 13px;
        }
        .modal-btns { display: flex; gap: 10px; margin-top: 18px; }
        .modal-btn {
            flex: 1; padding: 10px; border-radius: 10px; border: none;
            font-weight: bold; font-size: 13px; cursor: pointer;
        }
        .btn-save { background: #3b82f6; color: #fff; }
        .btn-cancel { background: rgba(255,255,255,0.1); color: #ccc; }

        /* カットイン表示 */
        .char-cutin-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 17, 26, 0.88); backdrop-filter: blur(10px);
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; z-index: 90; opacity: 0; pointer-events: none;
            transition: opacity 0.4s ease;
        }
        .char-cutin-overlay.active { opacity: 1; pointer-events: auto; }

        .cutin-img {
            width: 210px; height: 210px; border-radius: 50%;
            object-fit: cover; border: 4px solid #fff;
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.3);
            transform: scale(0.8); transition: transform 0.4s ease;
        }
        .char-cutin-overlay.active .cutin-img { transform: scale(1); }

        .cutin-name { font-size: 20px; font-weight: bold; margin-top: 14px; color: #fff; }
        .cutin-text {
            font-size: 14px; color: #60a5fa; margin-top: 8px; padding: 0 20px;
            text-align: center; font-weight: 600; line-height: 1.4;
        }
        .cutin-jp {
            font-size: 12px; color: #d1d5db; margin-top: 6px; padding: 0 20px;
            text-align: center;
        }
        .cutin-close-btn {
            margin-top: 18px; background: rgba(255, 255, 255, 0.15);
            border: 1px solid var(--card-border); color: #fff;
            padding: 8px 20px; border-radius: 20px; font-size: 12px; cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="header-title">
            <h1>OshiTalk English</h1>
            <p>推しと話しながら、自然な英語を学ぼう</p>
        </div>
        <button class="settings-btn" onclick="openModal()">⚙️ 設定</button>
    </div>

    <!-- キャラ切り替えタブ -->
    <div class="char-tabs">
        <button class="tab-btn" data-char="leo" onclick="switchChar('leo')">
            <img src="leo.png.jpg" class="tab-avatar" alt="Leo">
            <span class="tab-name">Leo</span>
        </button>
        <button class="tab-btn" data-char="noah" onclick="switchChar('noah')">
            <img src="noah.png.jpg" class="tab-avatar" alt="Noah">
            <span class="tab-name">Noah</span>
        </button>
        <button class="tab-btn active" data-char="liam" onclick="switchChar('liam')">
            <img src="ethan.png.jpg" class="tab-avatar" alt="Liam">
            <span class="tab-name">Liam</span>
        </button>
    </div>

    <!-- プロフィール ＆ 親密度 -->
    <div class="profile-card">
        <div class="profile-main">
            <img id="profileAvatar" src="ethan.png.jpg" class="profile-avatar" alt="Avatar">
            <div class="profile-info">
                <h2 id="profileName">Liam <span>28歳・IT企業社員</span></h2>
                <p id="profileDesc">英語が上手く話せなくても大丈夫。俺には、ちゃんと伝わってるよ</p>
            </div>
        </div>
        <div class="love-section">
            <div class="love-badge">💖 Love Level</div>
            <div class="love-bar-bg">
                <div class="love-bar-fill" id="loveBarFill"></div>
            </div>
            <div class="love-level-text" id="loveLevelText">Lv.1 (0%)</div>
        </div>
    </div>

    <!-- チャット表示エリア -->
    <div class="chat-box" id="chatBox"></div>

    <!-- クイックボタン -->
    <div class="quick-section">
        <div class="quick-label">日常会話クイック発言（タップで音声付き送信）</div>
        <div class="quick-btns">
            <button class="quick-btn" onclick="sendQuick('Good morning!')">🌅 朝の挨拶</button>
            <button class="quick-btn" onclick="sendQuick('What are you doing today?')">☕ 今日の予定</button>
            <button class="quick-btn" onclick="sendQuick('What is your favorite food?')">🍔 好きな食べ物</button>
            <button class="quick-btn" onclick="sendQuick('I am feeling tired today.')">😴 疲れたとき</button>
            <button class="quick-btn" onclick="sendQuick('You look cool today!')">✨ 褒める</button>
            <button class="quick-btn" onclick="sendQuick('Can I ask you a question?')">❓ 質問する</button>
            <button class="quick-btn" onclick="sendQuick('Thank you as always.')">💌 感謝を伝える</button>
            <button class="quick-btn" onclick="sendQuick('Good night! Sweet dreams.')">🌙 おやすみ</button>
        </div>
    </div>

    <!-- 入力フォーム ＆ 音声認識言語切り替え -->
    <form class="input-form" onsubmit="handleSend(event)">
        <input type="text" id="userInput" class="input-field" placeholder="メッセージを入力..." autocomplete="off">
        <button type="button" class="lang-switch-btn" id="langSwitchBtn" onclick="toggleInputLang()">🎤 EN</button>
        <button type="button" class="mic-btn" id="micBtn" onclick="toggleSpeechRecognition()" title="音声入力">🎙️</button>
        <button type="submit" class="send-btn">送信</button>
    </form>

    <!-- 返答時カットイン表示エリア -->
    <div class="char-cutin-overlay" id="cutinOverlay">
        <img id="cutinImg" src="ethan.png.jpg" class="cutin-img" alt="Focus">
        <div id="cutinName" class="cutin-name">Liam</div>
        <div id="cutinText" class="cutin-text">"I'm listening..."</div>
        <div id="cutinJp" class="cutin-jp">「聞いてるよ...」</div>
        <button class="cutin-close-btn" onclick="closeCutin()">チャットに戻る 💬</button>
    </div>

    <!-- 設定モーダル -->
    <div class="modal-overlay" id="customModal">
        <div class="modal-content">
            <h3>⚙️ ユーザー設定 & カスタマイズ</h3>
            <div class="form-group">
                <label>あなたの名前（表示名）</label>
                <input type="text" id="userNameInput" value="You">
            </div>
            <div class="form-group">
                <label>推しからの呼ばれ方 (呼称)</label>
                <input type="text" id="userNicknameInput" placeholder="例: princess, sweetie, my friend">
            </div>
            <div class="modal-btns">
                <button class="modal-btn btn-cancel" onclick="closeModal()">キャンセル</button>
                <button class="modal-btn btn-save" onclick="saveSettings()">保存する</button>
            </div>
        </div>
    </div>
</div>

<script>
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    let userConfig = { name: "You", nickname: "my princess" };
    let inputLang = 'en-US'; // デフォルトは英語

    const CHARS = {
        leo: {
            name: "Leo", info: "24歳・人気俳優",
            desc: "君と話せるこの時間が、僕の1日で一番大切な時間だよ。",
            avatar: "leo.png.jpg", pitch: 0.7, rate: 0.95,
            loveExp: 0, loveLevel: 1,
            responses: {
                default: { en: "I'm always here for you, {NICKNAME}. Tell me more about your day!", jp: "僕はいつも君のそばにいるよ。今日の出来事をもっと教えて！", phrase: "always here for you", tip: "「いつも君のそばにいるよ」という親密な表現です。" },
                morning: { en: "Good morning, {NICKNAME}! Did you sleep well?", jp: "おはよう！よく眠れた？", phrase: "Did you sleep well?", tip: "「よく眠れた？」と気遣う朝のフレーズです。" },
                plan: { en: "I'm filming today, but I'll be thinking of you, {NICKNAME}.", jp: "今日は撮影があるんだ。でも、君のことを想っているよ。", phrase: "thinking of you", tip: "「あなたのことを想っている」という愛着表現です。" },
                food: { en: "I love sweet desserts! Let's go to a cafe together next time.", jp: "甘いスイーツが大好きなんだ！今度一緒にカフェに行こうね。", phrase: "Let's go together", tip: "「一緒に行こう」と誘うフレーズです。" },
                tired: { en: "Take it easy today, {NICKNAME}. You worked so hard.", jp: "今日は無理しないでね。すごく頑張ったんだから。", phrase: "Take it easy", tip: "「気楽にいこう／無理しないで」と労う表現です。" },
                compliment: { en: "Thank you! Hearing that from you makes my day.", jp: "ありがとう！君にそう言ってもらえると一日最高だよ。", phrase: "makes my day", tip: "「最高の一日になる／とても嬉しい」という意味の定番フレーズです。" },
                question: { en: "Sure, ask me anything! I'm all ears, {NICKNAME}.", jp: "もちろん、何でも聞いて！ちゃんと聞いているよ。", phrase: "I'm all ears", tip: "「しっかり聞いています／話を聞く準備OK」という意味です。" },
                thanks: { en: "I should be thanking you. You always bring a smile to my face.", jp: "お礼を言うのは僕の方だよ。いつも笑顔にしてくれてありがとう。", phrase: "bring a smile to my face", tip: "「私を笑顔にしてくれる」という感謝の表現です。" },
                night: { en: "Good night, {NICKNAME}. See you in my dreams!", jp: "おやすみ。夢の中で会おうね！", phrase: "See you in my dreams", tip: "「夢で会おうね」というロマンチックな挨拶です。" }
            }
        },
        noah: {
            name: "Noah", info: "21歳・アイドル",
            desc: "べ、別に君からのメッセージを待ってたわけじゃないし…。",
            avatar: "noah.png.jpg", pitch: 0.75, rate: 1.0,
            loveExp: 0, loveLevel: 1,
            responses: {
                default: { en: "Don't push yourself too hard, {NICKNAME}. You're doing fine.", jp: "あまり無理しすぎるなよ。ちゃんとやれてるから。", phrase: "Don't push yourself", tip: "「無理しないでね」と気遣う表現です。" },
                morning: { en: "Morning, {NICKNAME}. You're up early today, huh?", jp: "おはよう。今日は早起きなんだな？", phrase: "You're up early", tip: "「早起きだね」という意味のフレーズです。" },
                plan: { en: "Dance practice all day. Wish me luck... not that I need it!", jp: "一日中ダンスレッスンだよ。応援してよね…まあ必要ないけど！", phrase: "Wish me luck", tip: "「応援してね」という表現です。" },
                food: { en: "Ramen, definitely. I know a cool place if you wanna know.", jp: "絶対ラーメン。知りたかったら美味い店教えてやるけど？", phrase: "definitely", tip: "「絶対に」と好みを強調する表現です。" },
                tired: { en: "Tired? Then stop working and rest. I'm right here.", jp: "疲れた？じゃあ作業やめて休めよ。俺がここにいるんだからさ。", phrase: "stop working and rest", tip: "「手を止めて休んで」という直接的な気遣いです。" },
                compliment: { en: "Wh-what? Don't say that suddenly! But... thanks.", jp: "な、なんだよ急に！……でも、サンキュ。", phrase: "don't say that suddenly", tip: "「急にそんなこと言わないでよ」と照れる時の表現です。" },
                question: { en: "What is it? If it's something weird, I'm not answering!", jp: "何だよ？変な質問だったら答えないからな！", phrase: "What is it?", tip: "「なにかあるの？」とフランクに尋ねる表現です。" },
                thanks: { en: "Stop being so formal! You're welcome, alright?", jp: "そんな畏まるなよ！どういたしまして、な？", phrase: "You're welcome", tip: "「どういたしまして」の定番フレーズです。" },
                night: { en: "Night. Don't stay up too late, okay?", jp: "おやすみ。あんまり夜更かしすんなよ？", phrase: "don't stay up too late", tip: "「夜更かししないでね」という意味です。" }
            }
        },
        liam: {
            name: "Liam", info: "28歳・IT企業社員",
            desc: "英語が上手く話せなくても大丈夫。俺には、ちゃんと伝わってるよ。",
            avatar: "ethan.png.jpg", pitch: 0.6, rate: 0.95,
            loveExp: 0, loveLevel: 1,
            responses: {
                default: { en: "Makes sense, {NICKNAME}. Your English is coming along very well!", jp: "なるほどね。君の英語、すごく上達してきているよ！", phrase: "coming along", tip: "「順調に上達している」という意味です。" },
                morning: { en: "Good morning, {NICKNAME}! Ready for a great day ahead?", jp: "おはよう！今日も素晴らしい一日にする準備はできた？", phrase: "Ready for...?", tip: "「準備はできてる？」と元気づける表現です。" },
                plan: { en: "Just checking code today. Take breaks, okay, {NICKNAME}?", jp: "今日はコードの確認作業だよ。ちゃんと休憩も取ってね？", phrase: "Take breaks", tip: "「休憩を取る」という意味の表現です。" },
                food: { en: "A warm cup of coffee and a sandwich. How about you, {NICKNAME}?", jp: "温かいコーヒーとサンドイッチかな。君はどう？", phrase: "How about you?", tip: "「あなたはどう？」と聞き返す表現です。" },
                tired: { en: "You worked hard today, {NICKNAME}. Let's take a good rest tonight.", jp: "今日は本当にお疲れ様。今夜はゆっくり休もうね。", phrase: "You worked hard", tip: "「頑張ったね／お疲れ様」と労うフレーズです。" },
                compliment: { en: "Thank you, {NICKNAME}. You always make my day brighter.", jp: "ありがとう。君はいつも俺の毎日を明るくしてくれるよ。", phrase: "make my day brighter", tip: "「一日を明るく照らしてくれる」という感謝表現です。" },
                question: { en: "Of course. What's on your mind, {NICKNAME}?", jp: "もちろん。何か気になっていることでもある？", phrase: "What's on your mind?", tip: "「何を考えているの？／どうしたの？」と優しく聞く表現です。" },
                thanks: { en: "Anytime. I'm always glad to help you.", jp: "いつでも言ってね。君の力になれて嬉しいよ。", phrase: "Anytime", tip: "「いつでもどうぞ／どういたしまして」の砕けた表現です。" },
                night: { en: "Good night, {NICKNAME}. Get a good rest, okay?", jp: "おやすみ。ゆっくり休んでね？", phrase: "Get a good rest", tip: "「ゆっくり休んでね」という意味のフレーズです。" }
            }
        }
    };

    let currentCharKey = 'liam';
    let chatHistories = { leo: [], noah: [], liam: [] };
    let recognition = null;
    let isRecording = false;

    // モーダル操作
    function openModal() {
        document.getElementById('userNameInput').value = userConfig.name;
        document.getElementById('userNicknameInput').value = userConfig.nickname;
        document.getElementById('customModal').classList.add('active');
    }

    function closeModal() { document.getElementById('customModal').classList.remove('active'); }

    function saveSettings() {
        const nameVal = document.getElementById('userNameInput').value.trim();
        const nickVal = document.getElementById('userNicknameInput').value.trim();
        if (nameVal) userConfig.name = nameVal;
        if (nickVal) userConfig.nickname = nickVal;
        closeModal();
        renderChat();
    }

    // 親密度
    function addLoveExp(amount) {
        const char = CHARS[currentCharKey];
        char.loveExp += amount;
        
        const newLevel = Math.floor(char.loveExp / 100) + 1;
        if (newLevel > char.loveLevel) {
            char.loveLevel = newLevel;
            alert(`🎉 ${char.name}との親密度レベルが上がりました！ [Lv.${char.loveLevel}]`);
        }
        updateLoveUI();
    }

    function updateLoveUI() {
        const char = CHARS[currentCharKey];
        const currentExpProgress = char.loveExp % 100;
        document.getElementById('loveBarFill').style.width = `${currentExpProgress}%`;
        document.getElementById('loveLevelText').innerText = `Lv.${char.loveLevel} (${currentExpProgress}%)`;
    }

    // 音声読み上げ（終了コールバック対応）
    function getVoiceForChar(charKey) {
        if (!('speechSynthesis' in window)) return null;
        const voices = window.speechSynthesis.getVoices();
        const englishVoices = voices.filter(v => v.lang.startsWith('en'));
        if (englishVoices.length === 0) return null;
        
        const maleVoices = englishVoices.filter(v => /male|david|george|mark|guy|james|alex|daniel/i.test(v.name));
        return maleVoices.length > 0 ? maleVoices[0] : englishVoices[0];
    }

    function speakText(text, isUser = false, onEndCallback = null) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            
            if (isUser) {
                utterance.pitch = 1.0;
                utterance.rate = 1.0;
            } else {
                const char = CHARS[currentCharKey];
                utterance.pitch = char.pitch || 0.6;
                utterance.rate = char.rate || 1.0;
                const selectedVoice = getVoiceForChar(currentCharKey);
                if (selectedVoice) utterance.voice = selectedVoice;
            }

            if (onEndCallback) {
                utterance.onend = onEndCallback;
                utterance.onerror = onEndCallback; // エラー時もコールバックを実行して進行不能を防ぐ
            }

            window.speechSynthesis.speak(utterance);
        } else {
            if (onEndCallback) onEndCallback();
        }
    }

    // カットイン表示
    function showCutin(text, jpText) {
        const char = CHARS[currentCharKey];
        document.getElementById('cutinImg').src = char.avatar;
        document.getElementById('cutinName').innerText = char.name;
        document.getElementById('cutinText').innerText = `"${text}"`;
        document.getElementById('cutinJp').innerText = jpText || "";
        document.getElementById('cutinOverlay').classList.add('active');
    }

    function closeCutin() {
        document.getElementById('cutinOverlay').classList.remove('active');
    }

    // 日英言語切り替え機能
    function toggleInputLang() {
        const btn = document.getElementById('langSwitchBtn');
        if (inputLang === 'en-US') {
            inputLang = 'ja-JP';
            btn.innerText = '🎙️ JP';
            btn.style.color = '#f43f5e';
        } else {
            inputLang = 'en-US';
            btn.innerText = '🎤 EN';
            btn.style.color = '#38bdf8';
        }
    }

    // 音声認識
    function toggleSpeechRecognition() {
        const micBtn = document.getElementById('micBtn');
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) { alert('お使いのブラウザは音声入力に対応していません。'); return; }

        if (isRecording) { recognition.stop(); return; }

        recognition = new SpeechRecognition();
        recognition.lang = inputLang;
        recognition.interimResults = false;

        recognition.onstart = () => { isRecording = true; micBtn.classList.add('recording'); micBtn.innerText = '🔴'; };
        recognition.onresult = (event) => { document.getElementById('userInput').value = event.results[0][0].transcript; };
        recognition.onerror = () => { stopRecordingUI(); };
        recognition.onend = () => { stopRecordingUI(); };
        recognition.start();
    }

    function stopRecordingUI() {
        isRecording = false;
        const micBtn = document.getElementById('micBtn');
        if (micBtn) { micBtn.classList.remove('recording'); micBtn.innerText = '🎙️'; }
    }

    // 初期化
    window.onload = function() {
        Object.keys(CHARS).forEach(key => {
            const char = CHARS[key];
            const text = char.responses.default.en.replace(/{NICKNAME}/g, userConfig.nickname);
            chatHistories[key].push({
                sender: 'char',
                text: text,
                jp: char.responses.default.jp,
                tip: { phrase: char.responses.default.phrase, desc: char.responses.default.tip }
            });
        });
        renderChat();
    };

    function switchChar(key) {
        currentCharKey = key;
        const char = CHARS[key];
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.toggle('active', btn.getAttribute('data-char') === key);
        });
        document.getElementById('profileAvatar').src = char.avatar;
        document.getElementById('profileName').innerHTML = `${char.name} <span>${char.info}</span>`;
        document.getElementById('profileDesc').innerText = char.desc;
        updateLoveUI();
        renderChat();
    }

    function handleSpeakClick(index) {
        const history = chatHistories[currentCharKey];
        if (history[index] && history[index].text) {
            speakText(history[index].text, history[index].sender === 'user');
        }
    }

    function renderChat() {
        const chatBox = document.getElementById('chatBox');
        chatBox.innerHTML = '';
        const history = chatHistories[currentCharKey];

        history.forEach((msg, idx) => {
            const row = document.createElement('div');
            row.className = `msg-row ${msg.sender}`;

            if (msg.sender === 'user') {
                row.innerHTML = `
                    <div class="msg-user-icon">${escapeHtml(userConfig.name)}</div>
                    <div class="msg-content">
                        <div class="bubble">${escapeHtml(msg.text)}</div>
                    </div>
                `;
            } else {
                const char = CHARS[currentCharKey];
                let tipHtml = msg.tip ? `
                    <div class="tip-card">
                        <div class="tip-header">💡 ${char.name}'s English Tip</div>
                        <div class="tip-phrase">"${msg.tip.phrase}"</div>
                        <div class="tip-desc">${msg.tip.desc}</div>
                    </div>
                ` : '';

                let jpHtml = msg.jp ? `<div class="jp-trans">🇯🇵 ${escapeHtml(msg.jp)}</div>` : '';
                
                row.innerHTML = `
                    <img src="${char.avatar}" class="msg-avatar" alt="${char.name}">
                    <div class="msg-content">
                        <div class="bubble">
                            ${escapeHtml(msg.text)}
                            ${jpHtml}
                        </div>
                        <button class="speak-btn" onclick="handleSpeakClick(${idx})">🔊 もう一度聴く</button>
                        ${tipHtml}
                    </div>
                `;
            }
            chatBox.appendChild(row);
        });

        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function sendQuick(text) {
        document.getElementById('userInput').value = text;
        
        let hasReplied = false;
        const triggerReply = () => {
            if (hasReplied) return;
            hasReplied = true;
            processCharResponse(text);
        };

        // ユーザーの発言を読み上げ、終了したら推しの返答へ進む
        speakText(text, true, () => {
            setTimeout(triggerReply, 400); // 読み上げ終了後、少し余韻を空けてから返答
        });

        // 万が一音声読み上げイベントが発生しない場合のフォールバックタイマー
        setTimeout(triggerReply, 3500);

        handleUserSendUI(text);
    }

    function handleUserSendUI(text) {
        chatHistories[currentCharKey].push({ sender: 'user', text: text });
        document.getElementById('userInput').value = '';
        renderChat();
        addLoveExp(8);
    }

 async function processCharResponse(userText) {
        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: userText }),
            });

            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            const data = await response.json();
            const processedText = data.reply;

            // チャット履歴に追加して画面更新・音声出力
            chatHistories[currentCharKey].push({
                sender: 'char',
                text: processedText,
                jp: '（AIからの返信）',
                tip: { phrase: '', desc: '' }
            });
            renderChat();
            showCutin(processedText, '（AIからの返信）');
            speakText(processedText);

        } catch (error) {
            console.error('通信エラー:', error);
            const errorMsg = "Sorry, I couldn't hear you well. Could you say that again?";
            chatHistories[currentCharKey].push({
                sender: 'char',
                text: errorMsg,
                jp: 'ごめんなさい、うまく聞き取れませんでした。もう一度言ってもらえますか？',
                tip: { phrase: '', desc: '' }
            });
            renderChat();
        }
    }

    function handleSend(e) {
        e.preventDefault();
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if (!text) return;

        handleUserSendUI(text);

        
            processCharResponse(text);
        
    }
</script>
