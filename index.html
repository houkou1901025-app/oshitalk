<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oshitalk English - 推し活×英会話</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(22, 31, 49, 0.7);
            --accent-leo: #f59e0b;
            --accent-noah: #8b5cf6;
            --accent-liam: #3b82f6;
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
            --theme-color: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* キャラクター選択ヘッダー */
        .character-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .char-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid transparent;
        }

        .char-card:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.08);
        }

        .char-card.active {
            border-color: var(--theme-color);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.2);
        }

        .char-avatar {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 8px;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .char-name {
            font-weight: bold;
            font-size: 1rem;
        }

        /* コントロールパネル */
        .control-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 12px 20px;
            border-radius: 15px;
            font-size: 0.9rem;
            flex-wrap: wrap;
            gap: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .step-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.85rem;
        }

        .step-btn.active {
            background: var(--theme-color);
            color: #000;
            font-weight: bold;
            border-color: transparent;
        }

        select {
            background: rgba(0, 0, 0, 0.4);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 12px;
            border-radius: 10px;
            outline: none;
        }

        /* チャットエリア */
        .chat-container {
            background: var(--card-bg);
            border-radius: 20px;
            height: 480px;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
        }

        .message-row {
            display: flex;
            gap: 12px;
            max-width: 85%;
        }

        .message-row.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message-row.ai {
            align-self: flex-start;
        }

        .msg-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }

        .bubble {
            padding: 14px 18px;
            border-radius: 18px;
            line-height: 1.5;
            position: relative;
        }

        .user .bubble {
            background: var(--theme-color);
            color: #000;
            font-weight: 500;
            border-bottom-right-radius: 4px;
        }

        .ai .bubble {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-bottom-left-radius: 4px;
        }

        .translation {
            margin-top: 8px;
            font-size: 0.88rem;
            color: #d1d5db;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 6px;
        }

        .tip-box {
            margin-top: 10px;
            background: rgba(245, 158, 11, 0.15);
            border-left: 3px solid var(--accent-leo);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.83rem;
            color: #fef08a;
        }

        .audio-btn {
            background: none;
            border: none;
            color: var(--text-sub);
            cursor: pointer;
            margin-top: 8px;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: 0.2s;
        }

        .audio-btn:hover {
            color: var(--text-main);
        }

        /* クイック発言エリア */
        .quick-section {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .quick-topics {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 10px;
        }

        .topic-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-sub);
            padding: 5px 12px;
            border-radius: 15px;
            white-space: nowrap;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .topic-btn.active {
            background: rgba(255, 255, 255, 0.15);
            color: var(--text-main);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .quick-phrases {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            max-height: 120px;
            overflow-y: auto;
        }

        .phrase-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.2s;
        }

        .phrase-btn:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        /* 入力エリア */
        .input-container {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 14px 20px;
            color: var(--text-main);
            outline: none;
            font-size: 0.95rem;
        }

        .send-btn {
            background: var(--theme-color);
            border: none;
            width: 50px;
            border-radius: 15px;
            color: #000;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .send-btn:hover {
            opacity: 0.9;
        }

        /* スクロールバー装飾 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- キャラクター選択 -->
    <div class="character-selector">
        <div class="char-card active" onclick="switchCharacter('leo')" id="card-leo">
            <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Leo" class="char-avatar" id="avatar-leo" alt="Leo">
            <span class="char-name">Leo</span>
        </div>
        <div class="char-card" onclick="switchCharacter('noah')" id="card-noah">
            <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Noah" class="char-avatar" id="avatar-noah" alt="Noah">
            <span class="char-name">Noah</span>
        </div>
        <div class="char-card" onclick="switchCharacter('liam')" id="card-liam">
            <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Liam" class="char-avatar" id="avatar-liam" alt="Liam">
            <span class="char-name">Liam</span>
        </div>
    </div>

    <!-- コントロールパネル -->
    <div class="control-panel">
        <div class="control-group">
            <span><i class="fa-solid fa-comments"></i> 会話ステップ:</span>
            <button class="step-btn" onclick="setStep(1)" id="step-1">Step 1 (初級)</button>
            <button class="step-btn" onclick="setStep(2)" id="step-2">Step 2 (中級)</button>
            <button class="step-btn" onclick="setStep(3)" id="step-3">Step 3 (長文)</button>
        </div>
        <div class="control-group">
            <span><i class="fa-solid fa-clock-rotate-left"></i> 履歴保存:</span>
            <select id="history-retention" onchange="updateHistoryRetention()">
                <option value="1">1日保存</option>
                <option value="7" selected>1週間保存</option>
                <option value="30">1ヶ月保存</option>
            </select>
        </div>
    </div>

    <!-- チャットログ -->
    <div class="chat-container" id="chat-box"></div>

    <!-- クイック発言 -->
    <div class="quick-section">
        <div class="quick-topics" id="quick-topics"></div>
        <div class="quick-phrases" id="quick-phrases"></div>
    </div>

    <!-- メッセージ入力 -->
    <div class="input-container">
        <input type="text" id="user-input" placeholder="メッセージを入力（英語・日本語どちらもOK）..." onkeypress="handleKeyPress(event)">
        <button class="send-btn" onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
</div>

<script>
    // キャラクター定義
    // ※ avatarのURLをお好みのイラスト画像URL（例: 'images/leo.png'）へ差し替えてご使用いただけます。
    const characters = {
        leo: { name: 'Leo', color: '#f59e0b', pitch: 0.65, rate: 0.9, avatar: 'https://api.dicebear.com/7.x/bottts/svg?seed=Leo', greeting: "Good morning, sweetheart. I was thinking about you.", translation: "おはよう。今日も君に会えて嬉しいよ。", tip: "Leoとの会話をスタートしよう！" },
        noah: { name: 'Noah', color: '#8b5cf6', pitch: 0.60, rate: 0.95, avatar: 'https://api.dicebear.com/7.x/bottts/svg?seed=Noah', greeting: "Oh, it's you. Don't keep me waiting too long next time.", translation: "なんだ、お前か。次はあんまり待たせるなよ。", tip: "Noahとの会話をスタートしよう！" },
        liam: { name: 'Liam', color: '#3b82f6', pitch: 0.70, rate: 1.0, avatar: 'https://api.dicebear.com/7.x/bottts/svg?seed=Liam', greeting: "Hey! I'm so happy to talk to you today! What's up?", translation: "やっほー！今日話せてめっちゃ嬉しい！何してたの？", tip: "Liamとの会話をスタートしよう！" }
    };

    // クイック発言データ
    const quickData = {
        "生活": ["Good morning!", "I just woke up.", "It's raining today.", "Cleaning my room."],
        "仕事": ["Off to work!", "So busy today.", "Finished my job!", "Need a coffee break."],
        "学校": ["Heading to school.", "Studying English.", "Homework is done!", "Exams are over!"],
        "食事": ["Having lunch now.", "This tastes amazing!", "Want to eat pizza.", "Full and happy!"],
        "旅行": ["I love traveling.", "Packing my bags.", "Flight is booked!", "Can't wait to go!"],
        "趣味": ["Watching anime.", "Listening to music.", "Reading a novel.", "Playing games."],
        "運動": ["Going for a run.", "Workout done!", "Feeling energized.", "Yoga time!"],
        "感情": ["I'm so happy!", "Feeling a bit tired.", "Super excited!", "Miss you so much."]
    };

    let currentChar = 'leo';
    let currentStep = parseInt(localStorage.getItem('oshitalk_step')) || 2;

    // ページのDOMが読み込み完了した時点で初期化を実行する
    document.addEventListener("DOMContentLoaded", () => {
        setStep(currentStep, false);
        switchCharacter('leo', false);
        renderQuickTopics();
    });

    function setStep(step, resetChat = true) {
        currentStep = step;
        localStorage.setItem('oshitalk_step', step);
        
        [1, 2, 3].forEach(s => {
            const btn = document.getElementById(`step-${s}`);
            if (btn) {
                if (s === step) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            }
        });

        if (resetChat) {
            initChat();
        }
    }

    function switchCharacter(charKey, reset = true) {
        currentChar = charKey;
        const char = characters[charKey];
        document.documentElement.style.setProperty('--theme-color', char.color);

        document.querySelectorAll('.char-card').forEach(card => card.classList.remove('active'));
        const activeCard = document.getElementById(`card-${charKey}`);
        if (activeCard) activeCard.classList.add('active');

        if (reset) {
            initChat();
        } else {
            initChat();
        }
    }

    function initChat() {
        const chatBox = document.getElementById('chat-box');
        if (!chatBox) return;
        chatBox.innerHTML = '';
        const char = characters[currentChar];
        addBubble('ai', char.greeting, char.translation, char.tip, false, true, true);
    }

    function addBubble(type, text, translation = '', tip = '', speak = false, showTrans = true, showTip = true) {
        const chatBox = document.getElementById('chat-box');
        if (!chatBox) return;

        const row = document.createElement('div');
        row.className = `message-row ${type}`;

        const char = characters[currentChar];
        const avatarUrl = type === 'ai' ? char.avatar : 'https://api.dicebear.com/7.x/avataaars/svg?seed=User';

        let innerHTML = `<img src="${avatarUrl}" class="msg-avatar" alt="Avatar">`;
        innerHTML += `<div class="bubble">${text}`;
        
        if (translation && showTrans) {
            innerHTML += `<div class="translation">${translation}</div>`;
        }
        if (tip && showTip) {
            innerHTML += `<div class="tip-box"><i class="fa-solid fa-lightbulb"></i> ${tip}</div>`;
        }
        if (type === 'ai') {
            innerHTML += `<button class="audio-btn" onclick="speakText('${text.replace(/'/g, "\\'")}')"><i class="fa-solid fa-volume-high"></i> もう一度聞く</button>`;
        }
        innerHTML += `</div>`;

        row.innerHTML = innerHTML;
        chatBox.appendChild(row);
        chatBox.scrollTop = chatBox.scrollHeight;

        if (speak && type === 'ai') {
            speakText(text);
        }
    }

    function sendMessage() {
        const input = document.getElementById('user-input');
        const text = input.value.trim();
        if (!text) return;

        addBubble('user', text);
        input.value = '';

        getAIReply(text);
    }

    function sendQuickPhrase(phrase) {
        addBubble('user', phrase);
        setTimeout(() => {
            getAIReply(phrase);
        }, 1000);
    }

    async function getAIReply(userText) {
        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ character: currentChar, message: userText, step: currentStep })
            });

            if (!response.ok) {
                throw new Error("Server response not ok");
            }

            const data = await response.json();
            if (data.reply) {
                addBubble('ai', data.reply, data.translation || '', data.tip || '', true, true, true);
            }
        } catch (e) {
            console.error(e);
            addBubble('ai', "I loved hearing from you! Let's keep talking!", "君の声を聞けて本当に嬉しかったよ！もっとお話ししよう！", "素敵な英語ですね！その調子で続けていきましょう！", true, true, false);
        }
    }

    function speakText(text) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            
            const char = characters[currentChar];
            utterance.pitch = char.pitch;
            utterance.rate = char.rate;

            const voices = window.speechSynthesis.getVoices();
            const maleVoice = voices.find(v => v.lang.startsWith('en') && (
                v.name.includes('Male') || v.name.includes('David') || v.name.includes('George') || v.name.includes('Alex') || v.name.includes('Google US English')
            ));

            if (maleVoice) {
                utterance.voice = maleVoice;
            }

            window.speechSynthesis.speak(utterance);
        }
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') sendMessage();
    }

    function renderQuickTopics() {
        const topicsContainer = document.getElementById('quick-topics');
        if (!topicsContainer) return;
        topicsContainer.innerHTML = '';
        
        Object.keys(quickData).forEach((topic, index) => {
            const btn = document.createElement('button');
            btn.className = `topic-btn ${index === 0 ? 'active' : ''}`;
            btn.innerText = topic;
            btn.onclick = () => selectTopic(topic, btn);
            topicsContainer.appendChild(btn);
        });

        renderQuickPhrases(Object.keys(quickData)[0]);
    }

    function selectTopic(topic, btn) {
        document.querySelectorAll('.topic-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderQuickPhrases(topic);
    }

    function renderQuickPhrases(topic) {
        const phrasesContainer = document.getElementById('quick-phrases');
        if (!phrasesContainer) return;
        phrasesContainer.innerHTML = '';

        quickData[topic].forEach(phrase => {
            const btn = document.createElement('button');
            btn.className = 'phrase-btn';
            btn.innerText = phrase;
            btn.onclick = () => sendQuickPhrase(phrase);
            phrasesContainer.appendChild(btn);
        });
    }

    function updateHistoryRetention() {
        const select = document.getElementById('history-retention');
        alert(`履歴保存期間を${select.options[select.selectedIndex].text}に設定しました。`);
    }
</script>
</body>
</html>
