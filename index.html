<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Boyfriend Chat & Call (Beta Premium)</title>
    <style>
        :root {
            --primary-color: #ff6b81;
            --bg-color: #f8f9fa;
            --chat-bg: #ffffff;
            --user-msg: #ff6b81;
            --ai-msg: #f1f2f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background: var(--chat-bg);
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        /* Test Panel for Debugging */
        .test-panel {
            background: #eee;
            padding: 5px 10px;
            font-size: 11px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Header */
        header {
            padding: 10px 15px;
            background: #fff;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .character-select {
            padding: 5px 10px;
            border-radius: 15px;
            border: 1px solid #ddd;
        }

        .btn-call {
            background: #2ed573;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Avatar Display Zone */
        .avatar-area {
            text-align: center;
            padding: 8px;
            background: #fafafa;
            border-bottom: 1px solid #eee;
        }

        .avatar-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--primary-color);
            transition: all 0.3s ease;
        }

        /* Love Level Gauge */
        .love-level-container {
            margin-top: 4px;
            font-size: 12px;
            color: #666;
        }
        .love-bar {
            width: 60%;
            height: 6px;
            background: #eee;
            border-radius: 3px;
            margin: 3px auto;
            overflow: hidden;
        }
        .love-fill {
            height: 100%;
            background: var(--primary-color);
            width: 35%;
            transition: width 0.5s ease;
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.4;
        }

        .message.user {
            align-self: flex-end;
            background: var(--user-msg);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.ai {
            align-self: flex-start;
            background: var(--ai-msg);
            color: #333;
            border-bottom-left-radius: 4px;
        }

        .translation {
            font-size: 11px;
            color: #666;
            margin-top: 4px;
        }

        /* Quick Reply & Controls */
        .controls {
            padding: 10px 15px;
            background: #fff;
            border-top: 1px solid #eee;
        }

        .quick-replies {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            margin-bottom: 8px;
            padding-bottom: 4px;
        }

        .quick-btn {
            background: #f0f0f0;
            border: 1px solid #ddd;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 12px;
            white-space: nowrap;
            cursor: pointer;
        }

        .input-group {
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 20px;
            outline: none;
            font-size: 14px;
        }

        .btn-send, .btn-mic {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }

        /* =======================================
           📞 通話モード（手順1：レイアウト最適化版）
        ======================================= */
        .call-modal {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, #0f172a 0%, #0284c7 100%);
            z-index: 100;
            flex-direction: column;
            justify-content: space-between;
            padding: 12px;
            box-sizing: border-box;
            color: white;
        }

        .call-modal.active {
            display: flex;
        }

        .call-header {
            text-align: center;
            padding-top: 4px;
        }

        .call-timer {
            font-size: 13px;
            color: #38bdf8;
            font-weight: bold;
        }

        /* 推しアバター（拡大表示） */
        .call-avatar-wrap {
            text-align: center;
            margin: 4px 0;
        }

        .call-avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 3px solid #38bdf8;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
            object-fit: cover;
        }

        /* 通話中の履歴表示（縦幅調整＆自動スクロール） */
        .call-chat-history {
            flex: 1;
            max-height: 25vh;
            overflow-y: auto;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 12px;
            padding: 10px;
            margin: 4px 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
            scroll-behavior: smooth;
        }

        .call-hints {
            background: rgba(15, 23, 42, 0.8);
            border-radius: 10px;
            padding: 8px;
        }

        .call-controls {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 4px;
        }

        .call-btn-row {
            display: flex;
            gap: 6px;
        }

        .call-btn {
            flex: 1;
            padding: 10px 4px;
            border: none;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }

        .btn-voice { background-color: #10b981; color: white; }
        .btn-clear { background-color: #64748b; color: white; }
        .btn-call-send { background-color: #2563eb; color: white; }
        .btn-repeat { background-color: #3b82f6; color: white; }
        .btn-normal { background-color: #06b6d4; color: white; }
        .btn-hangup { background-color: #ef4444; color: white; }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Test/Debug Bar -->
    <div class="test-panel">
        <span>🧪 ベータテスト用設定:</span>
        <label>
            <input type="checkbox" id="birthdayToggle" onchange="toggleBirthday(this.checked)"> 誕生日モード
        </label>
    </div>

    <!-- Header -->
    <header>
        <select class="character-select" id="charSelect" onchange="changeCharacter(this.value)">
            <option value="leo">Leo (王道王子様)</option>
            <option value="noah">Noah (ツンデレ)</option>
            <option value="liam">Liam (頼れるお兄さん)</option>
        </select>
        <button class="btn-call" onclick="startCallMode()">📞 通話モード</button>
    </header>

    <!-- Character Avatar Area -->
    <div class="avatar-area">
        <img src="https://via.placeholder.com/120/ff6b81/ffffff?text=Leo+[Default]" id="avatarImg" class="avatar-img" alt="Character Avatar">
        <div class="love-level-container">
            <span id="loveLevelText">Love Lv. 12</span>
            <div class="love-bar"><div class="love-fill" id="loveFill"></div></div>
        </div>
    </div>

    <!-- Chat Area -->
    <div class="chat-area" id="chatArea">
        <div class="message ai">Sweetheart, 今日もお疲れ様！週末は何して過ごす予定？[happy]</div>
    </div>

    <!-- Controls & Inputs -->
    <div class="controls">
        <div class="quick-replies" id="quickReplies">
            <button class="quick-btn" onclick="sendQuickReply('会いたかったよ！')">💕 会いたかったよ！</button>
            <button class="quick-btn" onclick="sendQuickReply('ちょっと疲れたな…')">🥺 ちょっと疲れたな…</button>
            <button class="quick-btn" onclick="sendQuickReply('お風呂に入ってくるね')">♨️ お風呂に入ってくるね</button>
        </div>
        <div class="input-group">
            <input type="text" id="userInput" placeholder="メッセージを入力..." onkeypress="handleKeyPress(event)">
            <button class="btn-mic" onclick="toggleVoiceInput()">🎙️</button>
            <button class="btn-send" onclick="sendMessage()">送信</button>
        </div>
    </div>

    <!-- 📞 Call Mode Modal (手順1適用版) -->
    <div class="call-modal" id="callModal">
        <div class="call-header">
            <h2 id="callCharName">Leo</h2>
            <div class="call-timer" id="callTimer">📞 通話中... 00:00</div>
        </div>
        
        <div class="call-avatar-wrap">
            <img src="https://via.placeholder.com/160/ff6b81/ffffff?text=Leo" id="callAvatarImg" class="call-avatar" alt="Call Avatar">
        </div>

        <!-- 通話モードのチャット履歴（自動最下部スクロール） -->
        <div class="call-chat-history" id="callChatHistory"></div>

        <!-- 通話モード用ヒントエリア -->
        <div class="call-hints">
            <div style="font-size: 12px; color: #38bdf8; margin-bottom: 4px;">💡 返答ヒント (タップで入力)</div>
            <div id="callQuickReplies" class="quick-replies" style="margin: 0;">
                <button class="quick-btn" onclick="sendQuickReply('See you in a bit!')">See you in a bit! (また後でね！)</button>
            </div>
        </div>

        <!-- 操作ボタン群（コンパクト配置） -->
        <div class="call-controls">
            <div class="call-btn-row">
                <button class="call-btn btn-voice" onclick="toggleVoiceInput()">🎤 音声入力</button>
                <button class="call-btn btn-clear" onclick="clearInput()">🗑 削除</button>
                <button class="call-btn btn-call-send" onclick="sendMessage()">📩 送信</button>
            </div>
            <div class="call-btn-row">
                <button class="call-btn btn-repeat" onclick="repeatVoice()">🔊 もう一度聞く</button>
                <button class="call-btn btn-normal" onclick="endCallMode()">通常表示に戻す</button>
                <button class="call-btn btn-hangup" onclick="endCallMode()">切断して閉じる</button>
            </div>
        </div>
    </div>
</div>

<script>
    let currentCharacter = 'leo';
    let isBirthdayMode = false;
    let callTimerInterval = null;
    let secondsElapsed = 0;
    let isProcessing = false;
    let chatHistoryData = [];

    const characters = {
        leo: {
            name: "Leo",
            avatarBase: "https://via.placeholder.com/120/ff6b81/ffffff?text=Leo+",
            expressions: { default: "Default", happy: "Happy😊", blush: "Blush😳", sad: "Sad🥺", surprised: "Surprised😲" }
        },
        noah: {
            name: "Noah",
            avatarBase: "https://via.placeholder.com/120/70a1ff/ffffff?text=Noah+",
            expressions: { default: "Default", happy: "Happy😊", blush: "Blush😳", sad: "Sad🥺", surprised: "Surprised😲" }
        },
        liam: {
            name: "Liam",
            avatarBase: "https://via.placeholder.com/120/2ed573/ffffff?text=Liam+",
            expressions: { default: "Default", happy: "Happy😊", blush: "Blush😳", sad: "Sad🥺", surprised: "Surprised😲" }
        }
    };

    // 自動最下部スクロール
    function scrollToBottom() {
        const chatArea = document.getElementById('chatArea');
        const callChatHistory = document.getElementById('callChatHistory');
        if (chatArea) chatArea.scrollTop = chatArea.scrollHeight;
        if (callChatHistory) callChatHistory.scrollTop = callChatHistory.scrollHeight;
    }

    function syncCallHistory() {
        const callChatHistory = document.getElementById('callChatHistory');
        const chatArea = document.getElementById('chatArea');
        callChatHistory.innerHTML = chatArea.innerHTML;
        scrollToBottom();
    }

    function sendMessage() {
        if (isProcessing) return;
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if (!text) return;

        appendMessage('user', text);
        input.value = '';
        isProcessing = true;

        // バックエンド（/api/chat）連携処理
        fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                character: currentCharacter,
                message: text,
                step: 1,
                history: chatHistoryData
            })
        })
        .then(res => res.json())
        .then(data => {
            appendMessage('ai', data.reply, data.translation);
            if (data.hints) updateHints(data.hints);
            isProcessing = false;
        })
        .catch(err => {
            // フォールバック（API未設定時のローカル応答）
            setTimeout(() => {
                generateAIResponse(text);
                isProcessing = false;
            }, 800);
        });
    }

    function sendQuickReply(text) {
        document.getElementById('userInput').value = text;
        sendMessage();
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') sendMessage();
    }

    function clearInput() {
        document.getElementById('userInput').value = '';
    }

    function appendMessage(sender, text, translation = '') {
        const chatArea = document.getElementById('chatArea');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${sender}`;
        
        let html = text;
        if (translation) html += `<div class="translation">${translation}</div>`;
        msgDiv.innerHTML = html;

        chatArea.appendChild(msgDiv);
        chatHistoryData.push({ sender, text });
        syncCallHistory();
    }

    function updateHints(hints) {
        const quickReplies = document.getElementById('quickReplies');
        const callQuickReplies = document.getElementById('callQuickReplies');
        let html = '';
        hints.forEach(h => {
            html += `<button class="quick-btn" onclick="sendQuickReply('${h.en}')">${h.en} (${h.jp})</button>`;
        });
        quickReplies.innerHTML = html;
        callQuickReplies.innerHTML = html;
    }

    function generateAIResponse(userText) {
        let rawResponse = "";
        if (isBirthdayMode) {
            rawResponse = "Happy Birthday!! [blush] 今日は特別な日だね！";
        } else if (userText.includes("風呂")) {
            rawResponse = "Take a warm bath and relax! See you later! [happy]";
        } else if (userText.includes("疲れた")) {
            rawResponse = "Take it easy... [sad] I'm always here for you.";
        } else {
            rawResponse = "I'm so happy to talk with you! [happy]";
        }

        const match = rawResponse.match(/\[(happy|blush|sad|surprised|default)\]/);
        const exp = match ? match[1] : 'default';
        const cleanText = rawResponse.replace(/\[.*?\]/g, '');

        updateAvatarExpression(exp);
        appendMessage('ai', cleanText);
    }

    function updateAvatarExpression(exp) {
        const char = characters[currentCharacter];
        const expLabel = char.expressions[exp] || char.expressions.default;
        const imgUrl = `${char.avatarBase}${expLabel}`;
        
        document.getElementById('avatarImg').src = imgUrl;
        document.getElementById('callAvatarImg').src = imgUrl;
    }

    function changeCharacter(charKey) {
        currentCharacter = charKey;
        const char = characters[charKey];
        updateAvatarExpression('default');
        appendMessage('ai', `（${char.name}に切り替わりました）`);
    }

    function startCallMode() {
        const modal = document.getElementById('callModal');
        document.getElementById('callCharName').innerText = characters[currentCharacter].name;
        modal.classList.add('active');
        syncCallHistory();

        secondsElapsed = 0;
        document.getElementById('callTimer').innerText = "📞 通話中... 00:00";
        if (callTimerInterval) clearInterval(callTimerInterval);
        callTimerInterval = setInterval(() => {
            secondsElapsed++;
            const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
            const secs = String(secondsElapsed % 60).padStart(2, '0');
            document.getElementById('callTimer').innerText = `📞 通話中... ${mins}:${secs}`;
        }, 1000);
    }

    function endCallMode() {
        const modal = document.getElementById('callModal');
        modal.classList.remove('active');
        if (callTimerInterval) clearInterval(callTimerInterval);
    }

    function toggleVoiceInput() {
        alert("🎤 音声入力を開始します");
    }

    function repeatVoice() {
        alert("🔊 最後の発言を再生します");
    }

    function toggleBirthday(enabled) {
        isBirthdayMode = enabled;
    }
</script>
</body>
</html>
