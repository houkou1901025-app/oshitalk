<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Oshitalk English - 推し活×英会話</title>
<style>
:root {
  --bg-color: #0f172a;
  --card-bg: rgba(30, 41, 59, 0.85);
  --text-main: #f8fafc;
  --text-sub: #94a3b8;
  --accent-leo: #f59e0b;
  --accent-noah: #8b5cf6;
  --accent-liam: #10b981;
  --accent-color: var(--accent-leo);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 12px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background-color: var(--bg-color);
  color: var(--text-main);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.container {
  width: 100%;
  max-width: 480px;
  background: var(--card-bg);
  backdrop-filter: blur(12px);
  border-radius: 20px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  padding: 14px;
  box-shadow: 0 15px 25px rgba(0, 0, 0, 0.5);
  position: relative;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}

.header h1 {
  margin: 0;
  font-size: 1.35rem;
  font-weight: 700;
  background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.header-btns { display: flex; gap: 6px; }

.btn-prem {
  background: linear-gradient(135deg, #f59e0b, #ec4899);
  color: #fff;
  border: none;
  padding: 6px 12px;
  border-radius: 14px;
  font-size: 0.85rem;
  font-weight: bold;
  cursor: pointer;
}

.btn-call-trigger {
  background: #2ed573;
  color: #fff;
  border: none;
  padding: 6px 12px;
  border-radius: 14px;
  font-size: 0.85rem;
  font-weight: bold;
  cursor: pointer;
}

/* キャラクター選択 */
.char-selector { display: flex; gap: 6px; margin-bottom: 8px; }

.char-card {
  flex: 1;
  background: rgba(15, 23, 42, 0.6);
  border: 2px solid transparent;
  border-radius: 12px;
  padding: 6px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s ease;
}

.char-card.active {
  border-color: var(--accent-color);
  background: rgba(255, 255, 255, 0.08);
}

.char-card img {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid rgba(255, 255, 255, 0.2);
  transition: transform 0.2s ease;
}

.char-card .name { font-weight: 700; font-size: 0.88rem; }

/* 設定パネル */
.control-panel {
  background: rgba(15, 23, 42, 0.5);
  border-radius: 10px;
  padding: 8px 12px;
  margin-bottom: 8px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  font-size: 0.82rem;
}

.control-row { display: flex; justify-content: space-between; align-items: center; }
.step-btns { display: flex; gap: 4px; }

.step-btn {
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: #fff;
  padding: 3px 8px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.78rem;
}

.step-btn.active {
  background: var(--accent-color);
  color: #0f172a;
  font-weight: bold;
}

select, input[type="date"] {
  background: #1e293b;
  color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 4px;
  padding: 2px 6px;
  font-size: 0.78rem;
}

/* チャットエリア */
.chat-area {
  height: 200px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 8px;
  padding-right: 2px;
  scroll-behavior: smooth;
}

.msg-row { display: flex; gap: 6px; align-items: flex-start; }
.msg-row.user { flex-direction: row-reverse; }

.msg-row img {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  object-fit: cover;
  flex-shrink: 0;
  cursor: pointer;
  transition: transform 0.2s ease;
}

.bubble-container { max-width: 82%; display: flex; flex-direction: column; gap: 2px; }

.bubble {
  padding: 8px 12px;
  border-radius: 12px;
  font-size: 0.95rem;
  line-height: 1.4;
}

.msg-row.ai .bubble {
  background: rgba(255, 255, 255, 0.1);
  border-top-left-radius: 2px;
}

.msg-row.user .bubble {
  background: var(--accent-color);
  color: #0f172a;
  font-weight: 600;
  border-top-right-radius: 2px;
}

.jp-sub { font-size: 0.8rem; color: #cbd5e1; margin-top: 2px; }

.english-tip {
  font-size: 0.78rem;
  background: rgba(0, 0, 0, 0.4);
  border-left: 3px solid var(--accent-color);
  padding: 4px 8px;
  border-radius: 0 4px 4px 0;
  color: #e2e8f0;
  margin-top: 3px;
}

.replay-btn {
  align-self: flex-start;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: #fff;
  border-radius: 10px;
  padding: 2px 8px;
  font-size: 0.75rem;
  cursor: pointer;
  margin-top: 3px;
}

/* クイック発言 */
.quick-toggle-container {
  margin-bottom: 8px;
  background: rgba(15, 23, 42, 0.6);
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  overflow: hidden;
}

.quick-toggle-header {
  padding: 6px 10px;
  font-size: 0.82rem;
  font-weight: bold;
  background: rgba(255, 255, 255, 0.05);
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  color: var(--accent-color);
}

.quick-categories {
  display: flex;
  gap: 4px;
  overflow-x: auto;
  padding: 6px;
  scrollbar-width: none;
  background: rgba(0,0,0,0.2);
}

.quick-categories::-webkit-scrollbar { display: none; }

.cat-tab {
  padding: 3px 8px;
  border-radius: 8px;
  font-size: 0.78rem;
  white-space: nowrap;
  cursor: pointer;
  background: rgba(255, 255, 255, 0.08);
  color: var(--text-main);
}

.cat-tab.active {
  background: var(--accent-color);
  color: #0f172a;
  font-weight: bold;
}

.quick-phrase-list {
  display: none;
  padding: 6px;
  gap: 4px;
  overflow-x: auto;
  scrollbar-width: none;
  background: rgba(15, 23, 42, 0.8);
  border-top: 1px solid rgba(255,255,255,0.05);
}

.quick-phrase-list.open { display: flex; }

.quick-btn {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.15);
  color: var(--text-main);
  padding: 5px 10px;
  border-radius: 12px;
  font-size: 0.8rem;
  white-space: nowrap;
  cursor: pointer;
  flex-shrink: 0;
}

/* 入力エリア */
.input-area { display: flex; gap: 4px; }

.input-area input {
  flex: 1;
  background: rgba(15, 23, 42, 0.85);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 14px;
  padding: 8px 12px;
  color: #fff;
  font-size: 0.9rem;
  outline: none;
}

.btn {
  background: var(--accent-color);
  border: none;
  color: #0f172a;
  font-weight: bold;
  padding: 0 12px;
  border-radius: 14px;
  cursor: pointer;
  font-size: 0.88rem;
}

.btn-mic {
  background: rgba(255, 255, 255, 0.1);
  color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.2);
  width: 40px;
}

/* モーダル Popup */
.modal-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  background: rgba(15, 23, 42, 0.92);
  backdrop-filter: blur(12px);
  display: flex;
  justify-content: center;
  align-items: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
  z-index: 999;
}

.modal-overlay.active { opacity: 1; pointer-events: auto; }

.modal-card {
  width: 85%;
  max-width: 340px;
  background: rgba(30, 41, 59, 0.95);
  border: 2px solid var(--accent-color);
  border-radius: 18px;
  padding: 18px;
  text-align: center;
}

.modal-card img {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid var(--accent-color);
  margin-bottom: 8px;
}

.modal-name { font-size: 1.15rem; font-weight: bold; color: var(--accent-color); margin-bottom: 4px; }
.modal-text-en { font-size: 0.98rem; font-weight: 600; line-height: 1.4; margin-bottom: 6px; }
.modal-text-jp { font-size: 0.85rem; color: #cbd5e1; margin-bottom: 12px; }
.modal-btns { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }

.modal-btn {
  background: var(--accent-color);
  color: #0f172a;
  border: none;
  padding: 8px 16px;
  border-radius: 16px;
  font-weight: bold;
  cursor: pointer;
  font-size: 0.85rem;
}

.modal-btn.sec { background: rgba(255,255,255,0.15); color: #fff; }

/* 通話モード */
.call-modal {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  background: linear-gradient(180deg, #0f172a 0%, #0369a1 100%);
  z-index: 1000;
  flex-direction: column;
  justify-content: space-between;
  padding: 12px 14px;
  box-sizing: border-box;
  color: white;
  overflow-y: auto;
}

.call-modal.active { display: flex; }
.call-header { text-align: center; margin-top: 2px; }
.call-timer { font-size: 0.85rem; color: #38bdf8; font-weight: bold; }

.call-avatar-wrap { text-align: center; margin: 8px 0; }

/* ★要件③：アイコンサイズを30mm相当（約115px）に設定 */
.call-avatar {
  width: 115px;
  height: 115px;
  border-radius: 50%;
  border: 4px solid var(--accent-color);
  object-fit: cover;
  animation: oshiPulse 3s infinite ease-in-out;
  transition: all 0.3s ease;
}

@keyframes oshiPulse {
  0% { transform: scale(1); box-shadow: 0 0 12px var(--accent-color); }
  50% { transform: scale(1.04); box-shadow: 0 0 24px var(--accent-color); }
  100% { transform: scale(1); box-shadow: 0 0 12px var(--accent-color); }
}

/* ★要件②：表情アニメーション（回転とバウンス効果） */
.pop-animation {
  animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

@keyframes popIn {
  0% { transform: scale(0.7) rotate(-8deg); opacity: 0.5; }
  60% { transform: scale(1.1) rotate(4deg); opacity: 1; }
  100% { transform: scale(1) rotate(0deg); opacity: 1; }
}

.call-chat-history {
  min-height: 110px;
  max-height: 160px;
  overflow-y: auto;
  background: rgba(15, 23, 42, 0.65);
  border-radius: 10px;
  padding: 8px;
  margin: 4px 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.call-hint-box {
  background: rgba(15, 23, 42, 0.85);
  border: 1px solid var(--accent-color);
  border-radius: 8px;
  padding: 6px 8px;
  margin-bottom: 6px;
}

.call-hint-title { font-size: 0.78rem; font-weight: bold; color: var(--accent-color); margin-bottom: 4px; }
.call-hint-list { display: flex; flex-direction: column; gap: 4px; }

.call-hint-item {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 6px;
  padding: 5px 8px;
  font-size: 0.82rem;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.call-hint-en { font-weight: 600; color: #fff; }
.call-hint-jp { font-size: 0.75rem; color: #cbd5e1; }

.call-quick-container {
  margin-bottom: 6px;
  background: rgba(15, 23, 42, 0.7);
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.1);
}

.call-input-container { display: flex; gap: 4px; margin-bottom: 6px; }
.call-input-container input {
  flex: 1;
  background: rgba(15, 23, 42, 0.9);
  border: 1px solid var(--accent-color);
  border-radius: 10px;
  padding: 8px 10px;
  color: #fff;
  font-size: 0.88rem;
  outline: none;
}

.call-controls { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
.call-btn-row { display: flex; gap: 4px; }

.call-btn {
  flex: 1;
  padding: 9px 4px;
  border: none;
  border-radius: 8px;
  font-size: 0.78rem;
  font-weight: bold;
  cursor: pointer;
  text-align: center;
}

.btn-voice-a { background-color: #10b981; color: white; }
.btn-voice-b { background-color: #f59e0b; color: #0f172a; }
.btn-clear { background-color: #64748b; color: white; }
.btn-call-send { background-color: #2563eb; color: white; }
.btn-repeat { background-color: #3b82f6; color: white; }
.btn-normal { background-color: #06b6d4; color: white; }
.btn-hangup { background-color: #ef4444; color: white; }
#img-upload-input { display: none; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Oshitalk English</h1>
    <div class="header-btns">
      <button class="btn-prem" onclick="openPremiumModal()">プレミアム</button>
      <button class="btn-call-trigger" onclick="startCallMode()">通話モード</button>
    </div>
  </div>

  <div class="char-selector">
    <div class="char-card active" onclick="selectChar('leo')" id="card-leo">
      <img id="avatar-leo" src="leo.jpg" onerror="this.src='https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=100&h=100&fit=crop'" alt="Leo">
      <div class="name">Leo</div>
    </div>
    <div class="char-card" onclick="selectChar('noah')" id="card-noah">
      <img id="avatar-noah" src="noah.jpg" onerror="this.src='https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100&h=100&fit=crop'" alt="Noah">
      <div class="name">Noah</div>
    </div>
    <div class="char-card" onclick="selectChar('liam')" id="card-liam">
      <img id="avatar-liam" src="liam.jpg" onerror="this.src='https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=100&h=100&fit=crop'" alt="Liam">
      <div class="name">Liam</div>
    </div>
  </div>

  <!-- 設定パネル（★要件①：Step別文量の表記明記） -->
  <div class="control-panel">
    <div class="control-row">
      <span>会話Step:</span>
      <div class="step-btns">
        <button class="step-btn" id="step-1" onclick="setStep(1)">Step 1 (1~2文)</button>
        <button class="step-btn active" id="step-2" onclick="setStep(2)">Step 2 (3~4文)</button>
        <button class="step-btn" id="step-3" onclick="setStep(3)">Step 3 (5文~)</button>
      </div>
    </div>
    <div class="control-row">
      <span>あなたの誕生日: 🎂</span>
      <input type="date" id="user-birthday" onchange="saveBirthdaySetting(this.value)">
    </div>
    <div class="control-row">
      <span>🖼 画像変更:</span>
      <button class="step-btn" onclick="triggerImageUpload('user')">自アイコン 👤</button>
      <button class="step-btn" onclick="triggerImageUpload('oshi')">推しアイコン 💖</button>
    </div>
  </div>

  <div class="chat-area" id="chat-area"></div>

  <!-- 10×10 クイック発言トピック -->
  <div class="quick-toggle-container">
    <div class="quick-toggle-header" onclick="toggleQuickPanel('normal')">
      <span>10×10 トピック別フレーズ 💬</span>
      <span id="toggle-icon-normal">▲</span>
    </div>
    <div class="quick-categories" id="quick-cats-normal"></div>
    <div class="quick-phrase-list open" id="quick-phrase-list-normal"></div>
  </div>

  <div class="input-area">
    <button class="btn btn-mic" id="mic-btn" onclick="toggleSpeech('normal_auto')">🎤</button>
    <input type="text" id="user-input" placeholder="英語でメッセージを入力..." onkeypress="handleKey(event, 'normal')">
    <button class="btn" onclick="sendMessage('normal')">送信</button>
  </div>
</div>

<input type="file" id="img-upload-input" accept="image/*" onchange="handleImageUpload(event)">

<!-- Popup モーダル -->
<div class="modal-overlay" id="oshi-modal" onclick="closeModal()">
  <div class="modal-card" onclick="event.stopPropagation()">
    <img id="modal-img" src="leo.jpg" onerror="this.src='https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=200&h=200&fit=crop'" alt="Oshi">
    <div class="modal-name" id="modal-name">Leo</div>
    <div class="modal-text-en" id="modal-text-en"></div>
    <div class="modal-text-jp" id="modal-text-jp"></div>
    <div class="modal-btns">
      <button class="modal-btn sec" onclick="replayCurrentModalVoice()">もう一度聞く</button>
      <button class="modal-btn" onclick="closeModal()">閉じる</button>
    </div>
  </div>
</div>

<!-- プレミアム課金モーダル -->
<div class="modal-overlay" id="prem-modal" onclick="closePremModal()">
  <div class="modal-card" onclick="event.stopPropagation()">
    <div class="modal-name" style="color: #f59e0b;">Oshitalk Premium</div>
    <p style="font-size: 0.88rem; line-height: 1.4; color: #cbd5e1; margin: 10px 0;">
      プレミアムプランに加入すると、推しとの通話時間が無制限になり、AIからの超詳細レッスン動画・フルボイス機能が解放されます!
    </p>
    <div class="modal-btns">
      <button class="modal-btn" onclick="alert('プレミアム機能の決済画面へ移動します (デモ)')">月額980円で登録</button>
      <button class="modal-btn sec" onclick="closePremModal()">閉じる</button>
    </div>
  </div>
</div>

<!-- 通話モード Modal -->
<div class="call-modal" id="callModal">
  <div class="call-header">
    <h2 id="callCharName" style="margin: 0; font-size: 1.2rem;">Leo</h2>
    <div class="call-timer" id="callTimer">通話中... 00:00</div>
  </div>

  <div class="call-avatar-wrap">
    <!-- ★要件③：アイコンサイズ30mm化 -->
    <img src="leo.jpg" id="callAvatarImg" class="call-avatar" onerror="this.src='https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=300&h=300&fit=crop'" alt="Call Avatar">
  </div>

  <div class="call-chat-history" id="callChatHistory"></div>

  <div class="quick-toggle-container call-quick-container">
    <div class="quick-toggle-header" onclick="toggleQuickPanel('call')">
      <span>10×10 トピックフレーズから選ぶ</span>
      <span id="toggle-icon-call">▼</span>
    </div>
    <div class="quick-categories" id="quick-cats-call" style="display: none;"></div>
    <div class="quick-phrase-list" id="quick-phrase-list-call"></div>
  </div>

  <div class="call-hint-box">
    <div class="call-hint-title">返事Hint (タップで即送信)</div>
    <div class="call-hint-list" id="callHintList"></div>
  </div>

  <div class="call-input-container">
    <input type="text" id="call-user-input" placeholder="音声入力またはテキスト編集..." onkeypress="handleKey(event, 'call')">
  </div>

  <div class="call-controls">
    <div class="call-btn-row">
      <button class="call-btn btn-voice-a" id="btn-mic-a" onclick="toggleSpeech('call_auto')">A (4秒自動)</button>
      <button class="call-btn btn-voice-b" id="btn-mic-b" onclick="toggleSpeech('call_manual')">B (手動送信)</button>
      <button class="call-btn btn-clear" onclick="clearCallInput()">削除</button>
      <button class="call-btn btn-call-send" onclick="sendMessage('call')">送信</button>
    </div>
    <div class="call-btn-row">
      <button class="call-btn btn-repeat" onclick="replayCurrentModalVoice()">もう一度聞く</button>
      <button class="call-btn btn-normal" onclick="endCallMode()">通常表示に戻す</button>
      <button class="call-btn btn-hangup" onclick="endCallMode()">切断して閉じる</button>
    </div>
  </div>
</div>

<script>
const DEFAULT_AVATARS = {
  leo: 'https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=300&h=300&fit=crop',
  noah: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=300&h=300&fit=crop',
  liam: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=300&h=300&fit=crop'
};

/* ★要件②：感情差分画像パスの設定（normal, smile=喜, sad=悲, pout=すね, shy=照れ） */
const CHARS = {
  leo: {
    name: 'Leo',
    avatars: { 
      normal: 'leo.jpg', 
      smile: 'leo_smile.jpg', 
      sad: 'leo_sad.jpg', 
      pout: 'leo_pout.jpg', 
      shy: 'leo_shy.jpg' 
    },
    color: '#f59e0b', pitch: 0.75, rate: 0.95,
    greet: 'Good morning, sweetheart. I missed you so much today.',

let currentChar = 'leo';
let currentEmotion = 'normal';
let currentStep = 2;
let currentCat = 'life';
let isQuickOpenNormal = true;
let isQuickOpenCall = false;
let chatHistories = { leo: [], noah: [], liam: [] };
let isRecording = false;
let recognition = null;
let silenceTimer = null;
let lastAIText = '';
let currentSpeechMode = 'call_auto';
let userAvatarUrl = 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&h=100&fit=crop';

let callTimerInterval = null;
let secondsElapsed = 0;

window.onload = () => {
  loadSettings();
  loadHistories();
  selectChar(currentChar);
  setupSpeechRecognition();
  initQuickPanel('normal');
  initQuickPanel('call');
};

function getCharAvatarUrl(charKey, emotion = 'normal') {
  const char = CHARS[charKey];
  if (!char) return DEFAULT_AVATARS.leo;
  return char.avatars[emotion] || char.avatars['normal'] || DEFAULT_AVATARS[charKey];
}

function loadSettings() {
  const savedStep = localStorage.getItem('oshitalk_step');
  if (savedStep) {
    currentStep = parseInt(savedStep);
    document.querySelectorAll('.step-btn').forEach(btn => btn.classList.remove('active'));
    const btn = document.getElementById(`step-${currentStep}`);
    if (btn) btn.classList.add('active');
  }
  const savedBday = localStorage.getItem('oshitalk_birthday');
  if (savedBday) document.getElementById('user-birthday').value = savedBday;
  const savedUserImg = localStorage.getItem('oshitalk_user_avatar');
  if (savedUserImg) userAvatarUrl = savedUserImg;
}

function setStep(s) {
  currentStep = s;
  localStorage.setItem('oshitalk_step', s);
  document.querySelectorAll('.step-btn').forEach(btn => btn.classList.remove('active'));
  const btn = document.getElementById(`step-${s}`);
  if (btn) btn.classList.add('active');
  updateCallHints(lastAIText);
}

function saveBirthdaySetting(val) { localStorage.setItem('oshitalk_birthday', val); }

function triggerImageUpload(target) {
  uploadTarget = target;
  document.getElementById('img-upload-input').click();
}

function handleImageUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (event) => {
    const base64 = event.target.result;
    if (uploadTarget === 'user') {
      userAvatarUrl = base64;
      localStorage.setItem('oshitalk_user_avatar', base64);
    } else {
      CHARS[currentChar].avatars.normal = base64;
      document.getElementById(`avatar-${currentChar}`).src = base64;
      document.getElementById('callAvatarImg').src = base64;
    }
    renderChatHistory();
  };
  reader.readAsDataURL(file);
}

function initQuickPanel(target = 'normal') {
  const catContainer = document.getElementById(`quick-cats-${target}`);
  if (!catContainer) return;
  catContainer.innerHTML = '';
  Object.keys(QUICK_DATA).forEach(key => {
    const cat = QUICK_DATA[key];
    const btn = document.createElement('div');
    btn.className = `cat-tab ${key === currentCat ? 'active' : ''}`;
    btn.innerText = cat.title;
    btn.onclick = (e) => selectCategory(key, e, target);
    catContainer.appendChild(btn);
  });
  renderPhrases(target);
}

function selectCategory(key, event, target) {
  currentCat = key;
  document.querySelectorAll(`#quick-cats-${target} .cat-tab`).forEach(tab => tab.classList.remove('active'));
  if (event && event.target) event.target.classList.add('active');
  renderPhrases('normal');
  renderPhrases('call');
}

function renderPhrases(target = 'normal') {
  const list = document.getElementById(`quick-phrase-list-${target}`);
  if (!list) return;
  list.innerHTML = '';
  QUICK_DATA[currentCat].phrases.forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'quick-btn';
    btn.innerText = p.jp;
    btn.onclick = () => sendQuick(p.en);
    list.appendChild(btn);
  });
}

function toggleQuickPanel(target = 'normal') {
  if (target === 'normal') {
    isQuickOpenNormal = !isQuickOpenNormal;
    document.getElementById('quick-phrase-list-normal').classList.toggle('open', isQuickOpenNormal);
    document.getElementById('quick-cats-normal').style.display = isQuickOpenNormal ? 'flex' : 'none';
    document.getElementById('toggle-icon-normal').innerText = isQuickOpenNormal ? '▲' : '▼';
  } else {
    isQuickOpenCall = !isQuickOpenCall;
    document.getElementById('quick-phrase-list-call').classList.toggle('open', isQuickOpenCall);
    document.getElementById('quick-cats-call').style.display = isQuickOpenCall ? 'flex' : 'none';
    document.getElementById('toggle-icon-call').innerText = isQuickOpenCall ? '▲' : '▼';
  }
}

function selectChar(key) {
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  currentChar = key;
  currentEmotion = 'normal';
  const char = CHARS[key];
  document.querySelectorAll('.char-card').forEach(card => card.classList.remove('active'));
  document.getElementById(`card-${key}`).classList.add('active');
  document.documentElement.style.setProperty('--accent-color', char.color);
  renderChatHistory();
  document.getElementById('callCharName').innerText = char.name;
  updateAvatarDisplay(getCharAvatarUrl(currentChar, currentEmotion));
}

/* ★要件②：表情アニメーション連動 */
function updateAvatarDisplay(newSrc) {
  const callAvatar = document.getElementById('callAvatarImg');
  if (callAvatar) {
    callAvatar.classList.remove('pop-animation');
    void callAvatar.offsetWidth; // リフローを発生させてアニメーション再トリガー
    callAvatar.classList.add('pop-animation');
    callAvatar.src = newSrc;
  }
}

function renderChatHistory() {
  const chatArea = document.getElementById('chat-area');
  chatArea.innerHTML = '';
  const history = chatHistories[currentChar];
  if (!history || history.length === 0) {
    const char = CHARS[currentChar];
    addBubble('ai', char.greet, char.greetJp, char.greetTip, false, false, false, 'normal');
  } else {
    history.forEach(item => {
      addBubble(item.sender, item.text, item.subText, item.tipText, false, false, false, item.emotion || 'normal');
    });
  }
}

function addBubble(sender, text, subText = '', tipText = '', showPopup = true, save = true, autoSpeak = true, emotion = 'normal') {
  const chatArea = document.getElementById('chat-area');
  const row = document.createElement('div');
  row.className = `msg-row ${sender}`;
  const char = CHARS[currentChar];
  const fallbackUrl = DEFAULT_AVATARS[currentChar] || DEFAULT_AVATARS.leo;
  const avatarUrl = sender === 'ai' ? getCharAvatarUrl(currentChar, emotion) : userAvatarUrl;
  const isAI = sender === 'ai';

  if (isAI) {
    lastAIText = text;
    currentEmotion = emotion;
    updateAvatarDisplay(getCharAvatarUrl(currentChar, emotion));
  }

  const cleanText = text.replace(/'/g, "\\'");
  row.innerHTML = `
    <img src="${avatarUrl}" onerror="this.src='${fallbackUrl}'" onclick="openModal('${avatarUrl}', '${char.name}', '${cleanText}', '${subText}')">
    <div class="bubble-container">
      <div class="bubble">${text}</div>
      ${subText ? `<span class="jp-sub">${subText}</span>` : ''}
      ${tipText ? `<div class="english-tip"><strong>${char.name}'s Lesson:</strong> ${tipText}</div>` : ''}
      ${isAI ? `<button class="replay-btn" onclick="speakText('${cleanText}')">もう一度聞く</button>` : ''}
    </div>
  `;

  chatArea.appendChild(row);
  scrollToBottom();

  if (save) {
    if (!chatHistories[currentChar]) chatHistories[currentChar] = [];
    chatHistories[currentChar].push({ sender, text, subText, tipText, emotion, time: Date.now() });
    saveHistories();
  }

  if (isAI) {
    if (autoSpeak) speakText(text);
    if (showPopup && !document.getElementById('callModal').classList.contains('active')) {
      openModal(avatarUrl, char.name, text, subText);
    }
    updateCallHints(text);
  }
}

function scrollToBottom() {
  const chatArea = document.getElementById('chat-area');
  const callChatHistory = document.getElementById('callChatHistory');
  if (chatArea) chatArea.scrollTop = chatArea.scrollHeight;
  if (callChatHistory) {
    callChatHistory.innerHTML = chatArea.innerHTML;
    callChatHistory.scrollTop = callChatHistory.scrollHeight;
  }
}

function setupSpeechRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) return;
  recognition = new SpeechRecognition();
  recognition.lang = 'en-US';
  recognition.interimResults = true;
  recognition.continuous = true;

  recognition.onstart = () => { isRecording = true; };

  recognition.onresult = (event) => {
    let transcript = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      transcript += event.results[i][0].transcript;
    }
    const targetInputId = (currentSpeechMode === 'normal_auto') ? 'user-input' : 'call-user-input';
    document.getElementById(targetInputId).value = transcript;

    clearTimeout(silenceTimer);
    if (currentSpeechMode === 'call_auto' || currentSpeechMode === 'normal_auto') {
      silenceTimer = setTimeout(() => {
        const textVal = document.getElementById(targetInputId).value.trim();
        if (textVal) {
          stopSpeech();
          sendMessage(currentSpeechMode === 'normal_auto' ? 'normal' : 'call');
        }
      }, 4000);
    }
  };

  recognition.onerror = () => stopSpeech();
  recognition.onend = () => { if (isRecording && currentSpeechMode === 'call_manual') stopSpeech(); };
}

function toggleSpeech(mode) {
  if (!recognition) {
    alert("お使いのブラウザは音声認識機能に対応していません。");
    return;
  }
  if (isRecording) {
    stopSpeech();
  } else {
    currentSpeechMode = mode;
    const targetInputId = (mode === 'normal_auto') ? 'user-input' : 'call-user-input';
    document.getElementById(targetInputId).value = '';
    
    if (mode === 'call_auto') document.getElementById('btn-mic-a').style.background = '#ef4444';
    else if (mode === 'call_manual') document.getElementById('btn-mic-b').style.background = '#ef4444';
    else document.getElementById('mic-btn').style.background = '#ef4444';

    recognition.start();
  }
}

function stopSpeech() {
  isRecording = false;
  clearTimeout(silenceTimer);
  document.getElementById('mic-btn').style.background = 'rgba(255, 255, 255, 0.1)';
  document.getElementById('btn-mic-a').style.background = '#10b981';
  document.getElementById('btn-mic-b').style.background = '#f59e0b';
  if (recognition) recognition.stop();
}

async function sendMessage(source = 'normal') {
  const inputId = source === 'normal' ? 'user-input' : 'call-user-input';
  const input = document.getElementById(inputId);
  const text = input.value.trim();
  if (!text) return;
  addBubble('user', text, '', '', false, true, false);
  input.value = '';
  await getAIReply(text);
}

function sendQuick(text) {
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  addBubble('user', text, '', '', false, true, false);
  setTimeout(async () => { await getAIReply(text); }, 300);
}

function clearCallInput() { document.getElementById('call-user-input').value = ''; }

async function getAIReply(userText) {
  try {
    const history = (chatHistories[currentChar] || []).slice(-5);
    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        character: currentChar,
        message: userText,
        step: currentStep,
        history: history
      })
    });
    const data = await response.json();
    if (data.reply) {
      addBubble('ai', data.reply, data.translation || '', data.tip || '', true, true, true, data.emotion || 'smile');
    }
  } catch (e) {
    /* ★要件①・②：デモ用のStep別文章量および感情（smile, shy, sad, pout等）演出の擬似応答 */
    let demoReply = "";
    let demoTrans = "";
    let demoTip = "";
    let demoEmotion = "smile";

    if (currentStep === 1) {
      // Step 1: 1〜2文 (初級)
      demoReply = "I'm so glad to hear your voice! Talking with you brightens my day.";
      demoTrans = "声が聞けてすごく嬉しいよ！君とおしゃべりすると一日がパッと明るくなるね。";
      demoTip = "「brighten one's day」で「〜の一日を明るく幸せにする」という意味になるよ！";
      demoEmotion = "smile"; // 喜
    } else if (currentStep === 2) {
      // Step 2: 3〜4文 (中級)
      demoReply = "I was thinking about you all day today. Seeing your message right now makes my heart race. Are you having a good day so far? I really wish I could stay by your side forever.";
      demoTrans = "今日は一日中君のことを考えていたんだ。今こうしてメッセージを見られてドキドキしているよ。素敵な一日を過ごせてる？ずっと君のそばにいられたらいいのにな。";
      demoTip = "「make one's heart race」で「（胸を）ドキドキさせる」という胸キュン表現だよ！";
      demoEmotion = "shy"; // 照れ
    } else {
      // Step 3: 5文以上 (長文)
      demoReply = "I was honestly waiting for you to talk to me all day. Whenever we talk like this, I feel so deeply relaxed and happy. No matter how busy or tired I am, your words instantly refresh my mind. I hope I can give you the exact same comfort and energy in return. Thank you so much for being here with me today.";
      demoTrans = "正直、一日中君が話しかけてくれるのを待っていたんだ。こうしてお話しできると心がすごく落ち着くし幸せだよ。どれだけ忙しくて疲れていても、君の言葉ですぐに元気になれるんだ。僕も君に同じくらいの癒やしと元気をあげられたらいいな。今日も一緒にいてくれて本当にありがとう。";
      demoTip = "「in return」で「お返しに・見返りとして」という意味になる便利な接続表現だよ！";
      demoEmotion = "smile"; // 喜
    }

    addBubble('ai', demoReply, demoTrans, demoTip, true, true, true, demoEmotion);
  }
}

function speakText(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const uttr = new SpeechSynthesisUtterance(text);
  const char = CHARS[currentChar];
  uttr.lang = 'en-US';
  uttr.pitch = char.pitch;
  uttr.rate = char.rate;
  window.speechSynthesis.speak(uttr);
}

function replayCurrentModalVoice() { if (lastAIText) speakText(lastAIText); }

function openModal(imgSrc, name, enText, jpText) {
  document.getElementById('modal-img').src = imgSrc;
  document.getElementById('modal-name').innerText = name;
  document.getElementById('modal-text-en').innerText = enText;
  document.getElementById('modal-text-jp').innerText = jpText || '';
  document.getElementById('oshi-modal').classList.add('active');
}

function closeModal() { document.getElementById('oshi-modal').classList.remove('active'); }
function openPremiumModal() { document.getElementById('prem-modal').classList.add('active'); }
function closePremModal() { document.getElementById('prem-modal').classList.remove('active'); }

function saveHistories() { localStorage.setItem('oshitalk_histories', JSON.stringify(chatHistories)); }
function loadHistories() {
  const data = localStorage.getItem('oshitalk_histories');
  if (data) chatHistories = JSON.parse(data);
}

function handleKey(e, source) { if (e.key === 'Enter') sendMessage(source); }

function startCallMode() {
  const modal = document.getElementById('callModal');
  const char = CHARS[currentChar];
  document.getElementById('callCharName').innerText = char.name;
  updateAvatarDisplay(getCharAvatarUrl(currentChar, currentEmotion));
  updateCallHints(lastAIText);
  modal.classList.add('active');
  scrollToBottom();
  secondsElapsed = 0;
  document.getElementById('callTimer').innerText = "通話中... 00:00";
  if (callTimerInterval) clearInterval(callTimerInterval);
  callTimerInterval = setInterval(() => {
    secondsElapsed++;
    const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
    const secs = String(secondsElapsed % 60).padStart(2, '0');
    document.getElementById('callTimer').innerText = `通話中... ${mins}:${secs}`;
  }, 1000);
}

function endCallMode() {
  const modal = document.getElementById('callModal');
  modal.classList.remove('active');
  if (callTimerInterval) clearInterval(callTimerInterval);
}
</script>
