<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OshiTalk English - 推し活×英会話</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f111a;
            --card-bg: rgba(255, 255, 255, 0.06);
            --card-border: rgba(255, 255, 255, 0.12);
            --accent-leo: #f59e0b;
            --accent-noah: #3b82f6;
            --accent-liam: #10b981;
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
            --heart-red: #ec4899;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Zen Maru Gothic', 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(245, 158, 11, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 540px;
            background: rgba(20, 24, 38, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header-title h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-title p {
            font-size: 12px;
            color: var(--text-sub);
            margin-top: 2px;
        }

        .settings-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: #fff;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .settings-btn:hover { background: rgba(255, 255, 255, 0.15); }

        .char-tabs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }

        .tab-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .tab-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            object-fit: cover;
            background: #1e293b;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 2px solid transparent;
        }

        .tab-name { font-size: 14px; font-weight: 700; }

        .tab-btn[data-char="leo"].active { border-color: var(--accent-leo); background: rgba(245, 158, 11, 0.15); }
        .tab-btn[data-char="leo"].active .tab-avatar { border-color: var(--accent-leo); }
        .tab-btn[data-char="leo"] .tab-name { color: var(--accent-leo); }

        .tab-btn[data-char="noah"].active { border-color: var(--accent-noah); background: rgba(59, 130, 246, 0.15); }
        .tab-btn[data-char="noah"].active .tab-avatar { border-color: var(--accent-noah); }
        .tab-btn[data-char="noah"] .tab-name { color: var(--accent-noah); }

        .tab-btn[data-char="liam"].active { border-color: var(--accent-liam); background: rgba(16, 185, 129, 0.15); }
        .tab-btn[data-char="liam"].active .tab-avatar { border-color: var(--accent-liam); }
        .tab-btn[data-char="liam"] .tab-name { color: var(--accent-liam); }

        .profile-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 16px;
        }

        .profile-main {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 10px;
        }

        .profile-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            object-fit: cover;
            background: #1e293b;
            border: 2px solid #fff;
            flex-shrink: 0;
        }

        .profile-info h2 { font-size: 15px; font-weight: 700; }
        .profile-info h2 span { font-size: 11px; color: var(--text-sub); margin-left: 6px; font-weight: normal; }
        .profile-info p { font-size: 12px; color: #d1d5db; margin-top: 2px; }

        .love-section {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.25);
            padding: 8px 12px;
            border-radius: 12px;
        }

        .love-badge {
            font-size: 11px;
            font-weight: bold;
            color: var(--heart-red);
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        .love-bar-bg {
            flex: 1;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .love-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #f43f5e, #ec4899);
            border-radius: 4px;
            transition: width 0.4s ease;
        }

        .love-level-text {
            font-size: 11px;
            font-weight: bold;
            color: #f3f4f6;
            min-width: 55px;
            text-align: right;
        }

        .chat-box {
            background: rgba(15, 17, 26, 0.5);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            height: 280px;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 16px;
        }

        .msg-row { display: flex; gap: 10px; align-items: flex-start; }
        .msg-row.user { flex-direction: row-reverse; }

        .msg-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            background: #1e293b;
            flex-shrink: 0;
        }

        .msg-user-icon {
            width: 36px; height: 36px; border-radius: 50%;
            background: #4f46e5; color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 11px; font-weight: bold; flex-shrink: 0;
        }

        .msg-content { max-width: 80%; }
        .bubble {
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 13.5px;
            line-height: 1.5;
        }

        .msg-row.user .bubble { background: #3b82f6; color: #fff; border-bottom-right-radius: 4px; }
        .msg-row.char .bubble {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f3f4f6;
            border-bottom-left-radius: 4px;
        }

        .jp-trans {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 4px;
            padding-top: 4px;
            border-top: 1px dashed rgba(255, 255, 255, 0.1);
        }

        .speak-btn {
            background: none; border: none; color: #9ca3af;
            cursor: pointer; font-size: 12px; margin-top: 6px;
            display: inline-flex; align-items: center; gap: 4px;
            transition: color 0.2s;
        }
        .speak-btn:hover { color: #60a5fa; }

        .typing-indicator {
            font-size: 12px;
            color: var(--text-sub);
            font-style: italic;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .quick-section { margin-bottom: 12px; }
        .quick-label { font-size: 11px; color: var(--text-sub); margin-bottom: 6px; }
        .quick-btns { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; }
        .quick-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: #e5e7eb; padding: 6px 12px;
            border-radius: 20px; font-size: 11px;
            cursor: pointer; white-space: nowrap; transition: all 0.2s;
            flex-shrink: 0;
        }
        .quick-btn:hover { background: rgba(255, 255, 255, 0.15); border-color: #60a5fa; }

        .input-form { display: flex; gap: 6px; align-items: center; }
        .input-field {
            flex: 1; background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--card-border);
            border-radius: 14px; padding: 12px 14px;
            color: #fff; font-size: 13px; outline: none;
        }
        .input-field:focus { border-color: #60a5fa; }

        .lang-switch-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--card-border);
            color: #38bdf8; font-size: 11px; font-weight: bold;
            padding: 10px 8px; border-radius: 12px; cursor: pointer;
            white-space: nowrap; transition: all 0.2s;
        }

        .mic-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #fff; border: 1px solid var(--card-border);
            border-radius: 14px; padding: 10px 12px;
            font-size: 15px; cursor: pointer; transition: all 0.2s;
        }
        .mic-btn.recording { background: #ef4444; animation: pulse 1.2s infinite; }
        @keyframes pulse { 0%{transform:scale(1);} 50%{transform:scale(1.05);} 100%{transform:scale(1);} }

        .send-btn {
            background: #f3f4f6; color: #111827;
            border: none; border-radius: 14px;
            padding: 10px 16px; font-weight: bold;
            font-size: 13px; cursor: pointer;
        }

        .modal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(8px);
            border-radius: 24px; display: none; justify-content: center;
            align-items: center; z-index: 100; padding: 20px;
        }
        .modal-overlay.active { display: flex; }

        .modal-content {
            background: #181c2b; border: 1px solid var(--card-border);
            border-radius: 20px; padding: 20px; width: 100%; max-width: 400px;
        }
        .modal-content h3 { font-size: 16px; margin-bottom: 14px; text-align: center; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-sub); margin-bottom: 6px; }
        .form-group input {
            width: 100%; background: rgba(0,0,0,0.3);
            border: 1px solid var(--card-border);
            border-radius: 10px; padding: 10px; color: #fff; font-size: 13px;
        }
        .modal-btns { display: flex; gap: 10px; margin-top: 18px; }
        .modal-btn {
            flex: 1; padding: 10px; border-radius: 10px; border: none;
            font-weight: bold; font-size: 13px; cursor: pointer;
        }
        .btn-save { background: #3b82f6; color: #fff; }
        .btn-cancel { background: rgba(255,255,255,0.1); color: #ccc; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="header-title">
            <h1>OshiTalk English</h1>
            <p>推しと話しながら、自然な英語を学ぼう</p>
        </div>
        <button class="settings-btn" onclick="openModal()">⚙️ 設定</button>
    </div>

    <!-- キャラ切り替えタブ -->
    <div class="char-tabs">
        <button class="tab-btn active" data-char="leo" onclick="switchChar('leo')">
            <img class="tab-avatar" id="tabAvatarLeo" src="./leo.jpg" onerror="tryNextExt(this, 'leo')" alt="Leo">
            <span class="tab-name">Leo</span>
        </button>
        <button class="tab-btn" data-char="noah" onclick="switchChar('noah')">
            <img class="tab-avatar" id="tabAvatarNoah" src="./noah.jpg" onerror="tryNextExt(this, 'noah')" alt="Noah">
            <span class="tab-name">Noah</span>
        </button>
        <button class="tab-btn" data-char="liam" onclick="switchChar('liam')">
            <img class="tab-avatar" id="tabAvatarLiam" src="./liam.jpg" onerror="tryNextExt(this, 'liam')" alt="Liam">
            <span class="tab-name">Liam</span>
        </button>
    </div>

    <!-- プロフィール ＆ 親密度 -->
    <div class="profile-card">
        <div class="profile-main">
            <img id="profileAvatar" class="profile-avatar" src="./leo.jpg" onerror="tryNextExt(this, 'leo')" alt="Leo">
            <div class="profile-info">
                <h2 id="profileName">Leo <span>24歳・若手俳優</span></h2>
                <p id="profileDesc">君の英語、僕が一番近くで聞いていたい。</p>
            </div>
        </div>
        <div class="love-section">
            <div class="love-badge">💖 Love Level</div>
            <div class="love-bar-bg">
                <div class="love-bar-fill" id="loveBarFill"></div>
            </div>
            <div class="love-level-text" id="loveLevelText">Lv.1 (0%)</div>
        </div>
    </div>

    <!-- チャット表示エリア -->
    <div class="chat-box" id="chatBox"></div>

    <!-- クイックボタン -->
    <div class="quick-section">
        <div class="quick-label">日常会話クイック発言（タップで自動送信）</div>
        <div class="quick-btns">
            <button class="quick-btn" onclick="sendQuick('Good morning!')">🌅 朝の挨拶</button>
            <button class="quick-btn" onclick="sendQuick('What is your favorite food?')">🍔 好きな食べ物</button>
            <button class="quick-btn" onclick="sendQuick('Do you have a piano?')">🎹 ピアノ持ってる？</button>
            <button class="quick-btn" onclick="sendQuick('Do you have a car?')">🚗 車持ってる？</button>
            <button class="quick-btn" onclick="sendQuick('I am feeling tired today.')">😴 疲れたとき</button>
            <button class="quick-btn" onclick="sendQuick('You look cool today!')">✨ 褒める</button>
            <button class="quick-btn" onclick="sendQuick('Good night!')">🌙 おやすみ</button>
        </div>
    </div>

    <!-- 入力フォーム ＆ 音声認識 -->
    <form class="input-form" id="chatForm">
        <input type="text" id="userInput" class="input-field" placeholder="メッセージを入力またはマイクをON..." autocomplete="off">
        <button type="button" class="lang-switch-btn" id="langSwitchBtn" onclick="toggleInputLang()">🎤 EN</button>
        <button type="button" class="mic-btn" id="micBtn" onclick="toggleSpeechRecognition()" title="音声入力">🎙️</button>
        <button type="submit" class="send-btn" id="sendBtn">送信</button>
    </form>

    <!-- 設定モーダル -->
    <div class="modal-overlay" id="customModal">
        <div class="modal-content">
            <h3>⚙️ ユーザー設定 & カスタマイズ</h3>
            <div class="form-group">
                <label>あなたの名前（表示名）</label>
                <input type="text" id="userNameInput" value="You">
            </div>
            <div class="form-group">
                <label>推しからの呼ばれ方 (呼称)</label>
                <input type="text" id="userNicknameInput" placeholder="例: sweetheart, princess">
            </div>
            <div class="modal-btns">
                <button class="modal-btn btn-cancel" onclick="closeModal()">キャンセル</button>
                <button class="modal-btn btn-save" onclick="saveSettings()">保存する</button>
            </div>
        </div>
    </div>
</div>

<script>
    /* 画像読み込みエラー時に拡張子やパスを自動切替 */
    function tryNextExt(img, name) {
        if (!img.dataset.tried) {
            img.dataset.tried = "png";
            img.src = "./" + name + ".png";
        } else if (img.dataset.tried === "png") {
            img.dataset.tried = "JPEG";
            img.src = "./" + name + ".JPEG";
        } else if (img.dataset.tried === "JPEG") {
            img.dataset.tried = "PNG";
            img.src = "./" + name + ".PNG";
        } else if (img.dataset.tried === "PNG") {
            img.dataset.tried = "done";
            img.src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%233b82f6'/><text x='50%' y='55%' font-size='36' fill='white' text-anchor='middle' dominant-baseline='middle' font-family='sans-serif'>" + name.charAt(0).toUpperCase() + "</text></svg>";
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    let userConfig = { name: "You", nickname: "sweetheart" };
    let inputLang = 'en-US';

    const CHARS = {
        leo: {
            name: "Leo", age: 24, job: "若手俳優",
            desc: "君の英語、僕が一番近くで聞いていたい。",
            avatar: "./leo.jpg", pitch: 1.1, rate: 1.0,
            loveExp: 0, loveLevel: 1,
            greeting: "Good morning, {NICKNAME}. Did you sleep well? I was hoping you'd come talk to me today.",
            greetingJp: "おはよう！よく眠れた？今日も君が話しに来てくれるのを待ってたんだ。"
        },
        noah: {
            name: "Noah", age: 21, job: "アイドル",
            desc: "別に、お前と話したいわけじゃない。……でも、来ないとつまらない。",
            avatar: "./noah.jpg", pitch: 0.75, rate: 0.88,
            loveExp: 0, loveLevel: 1,
            greeting: "You're late. ...Oh, you're here. So, what are we talking about today?",
            greetingJp: "遅い。…あ、来た。で、今日は何話すの？"
        },
        liam: {
            name: "Liam", age: 28, job: "IT Specialist",
            desc: "英語が上手く話せなくても大丈夫。俺には、ちゃんと伝わってるよ。",
            avatar: "./liam.jpg", pitch: 0.9, rate: 0.95,
            loveExp: 0, loveLevel: 1,
            greeting: "Hey, good morning {NICKNAME}. Take your time and talk to me slowly.",
            greetingJp: "やあ、おはよう！焦らずゆっくり話そうね。"
        }
    };

    let currentCharKey = 'leo';
    let chatHistories = { leo: [], noah: [], liam: [] };
    let recognition = null;
    let isRecording = false;
    let autoSendTimer = null;
    let availableVoices = [];

    function loadVoices() {
        if ('speechSynthesis' in window) availableVoices = window.speechSynthesis.getVoices();
    }
    if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = loadVoices;
        loadVoices();
    }

    function getSmartReply(charKey, userText) {
        const text = userText.toLowerCase();
        
        if (text.includes("food") || text.includes("eat") || text.includes("like to eat")) {
            if (charKey === 'leo') return { en: "I love pasta and Italian food! How about you, {NICKNAME}?", jp: "パスタやイタリアンが大好きなんだ！君は何が好き？" };
            if (charKey === 'noah') return { en: "Spicy ramen. I eat it whenever our music lessons end.", jp: "激辛ラーメン。レッスンが終わった後は絶対これ。" };
            if (charKey === 'liam') return { en: "I enjoy making homemade curry on weekends. It's really relaxing.", jp: "週末にスパイスからカレーを作るのが好きなんだ。落ち着くよ。" };
        }
        if (text.includes("piano")) {
            if (charKey === 'leo') return { en: "Yes, I do! I practice playing the piano for my acting roles.", jp: "うん、持ってるよ！俳優の役作りのためにピアノを練習してるんだ。" };
            if (charKey === 'noah') return { en: "Yeah, there's a grand piano at our music studio. I play it sometimes.", jp: "ああ、スタジオにグランドピアノがあるよ。たまに弾くけど。" };
            if (charKey === 'liam') return { en: "I don't have a real piano, but I have an electric keyboard at home.", jp: "本物のピアノはないけど、家に電子キーボードならあるよ。" };
        }
        if (text.includes("car")) {
            if (charKey === 'leo') return { en: "I do! I love driving on weekends. Want to go for a drive with me?", jp: "持ってるよ！週末ドライブに行くのが好きなんだ。一緒に行く？" };
            if (charKey === 'noah') return { en: "No, our manager drives us around. I don't really need a car right now.", jp: "ううん、移動はマネージャーの車だから。今は別にいらないかな。" };
            if (charKey === 'liam') return { en: "Yes, I have a simple SUV. It's very convenient for trips.", jp: "うん、シンプルなSUVに乗ってるよ。遠出にすごく便利なんだ。" };
        }
        if (text.includes("tired")) {
            if (charKey === 'leo') return { en: "You worked so hard today. Please rest well, {NICKNAME}.", jp: "今日はすごく頑張ったね。ゆっくり休んでね。" };
            if (charKey === 'noah') return { en: "Don't push yourself too hard. Go to sleep early tonight.", jp: "無理しすぎんなよ。今夜は早く寝な。" };
            if (charKey === 'liam') return { en: "Sounds like a long day. Take it easy tonight, okay?", jp: "大変な一日だったみたいだね。今夜は気楽に過ごそう。" };
        }
        if (text.includes("hello") || text.includes("hi") || text.includes("hey")) {
            if (charKey === 'leo') return { en: "Hey there, {NICKNAME}! I'm so happy to talk with you.", jp: "やあ！話せてすごく嬉しいよ。" };
            if (charKey === 'noah') return { en: "Hey. What's up?", jp: "やあ。どうしたの？" };
            if (charKey === 'liam') return { en: "Hello! How is your day going so far?", jp: "こんにちは！今日はどんな日を過ごしてる？" };
        }

        if (charKey === 'leo') return { en: "That's very interesting! Tell me more about it, {NICKNAME}.", jp: "すごく興味深いね！もっと詳しく教えて？" };
        if (charKey === 'noah') return { en: "Huh, is that so? Well, it's not bad talking about that with you.", jp: "へえ、そうなの？まあ、あんたとこういう話するのも悪くないけど。" };
        return { en: "I see! I really enjoy chatting with you like this.", jp: "なるほどね！こうやって君と喋るの、本当に楽しいよ。" };
    }

    function openModal() {
        document.getElementById('userNameInput').value = userConfig.name;
        document.getElementById('userNicknameInput').value = userConfig.nickname;
        document.getElementById('customModal').classList.add('active');
    }
    function closeModal() { document.getElementById('customModal').classList.remove('active'); }

    function saveSettings() {
        const nameVal = document.getElementById('userNameInput').value.trim();
        const nickVal = document.getElementById('userNicknameInput').value.trim();
        if (nameVal) userConfig.name = nameVal;
        if (nickVal) userConfig.nickname = nickVal;
        closeModal();
        renderChat();
    }

    function addLoveExp(amount) {
        const char = CHARS[currentCharKey];
        char.loveExp += amount;
        const newLevel = Math.floor(char.loveExp / 100) + 1;
        if (newLevel > char.loveLevel) {
            char.loveLevel = newLevel;
            alert(`🎉 ${char.name}との親密度レベルが上がりました！ [Lv.${char.loveLevel}]`);
        }
        updateLoveUI();
    }

    function updateLoveUI() {
        const char = CHARS[currentCharKey];
        const currentExpProgress = char.loveExp % 100;
        document.getElementById('loveBarFill').style.width = `${currentExpProgress}%`;
        document.getElementById('loveLevelText').innerText = `Lv.${char.loveLevel} (${currentExpProgress}%)`;
    }

    function speakText(text, isUser = false) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';

            if (!isUser) {
                const char = CHARS[currentCharKey];
                if (availableVoices.length === 0) availableVoices = window.speechSynthesis.getVoices();
                const maleVoice = availableVoices.find(v => 
                    v.lang.startsWith('en') && 
                    (v.name.includes('Male') || v.name.includes('Guy') || v.name.includes('David') || v.name.includes('George') || v.name.includes('Alex'))
                );
                if (maleVoice) utterance.voice = maleVoice;
                utterance.pitch = char.pitch;
                utterance.rate = char.rate;
            }
            window.speechSynthesis.speak(utterance);
        }
    }

    function toggleInputLang() {
        const btn = document.getElementById('langSwitchBtn');
        if (inputLang === 'en-US') {
            inputLang = 'ja-JP';
            btn.innerText = '🎙️ JP';
            btn.style.color = '#f43f5e';
        } else {
            inputLang = 'en-US';
            btn.innerText = '🎤 EN';
            btn.style.color = '#38bdf8';
        }
    }

    function toggleSpeechRecognition() {
        const micBtn = document.getElementById('micBtn');
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) return alert('お使いのブラウザは音声入力に対応していません。');

        if (isRecording) return stopSpeechRecognition();

        isRecording = true;
        micBtn.classList.add('recording');
        micBtn.innerText = '🔴 録音中...';

        recognition = new SpeechRecognition();
        recognition.lang = inputLang;
        recognition.continuous = false;
        recognition.interimResults = true;

        recognition.onresult = (event) => { 
            let transcript = '';
            for (let i = 0; i < event.results.length; ++i) transcript += event.results[i][0].transcript;
            document.getElementById('userInput').value = transcript;

            clearTimeout(autoSendTimer);
            autoSendTimer = setTimeout(() => {
                stopSpeechRecognition();
                submitUserText();
            }, 3000);
        };

        recognition.onerror = () => stopSpeechRecognition();
        recognition.onend = () => stopSpeechRecognition();
        try { recognition.start(); } catch(e) {}
    }

    function stopSpeechRecognition() {
        isRecording = false;
        clearTimeout(autoSendTimer);
        if (recognition) try { recognition.stop(); } catch(e) {}
        const micBtn = document.getElementById('micBtn');
        if (micBtn) { micBtn.classList.remove('recording'); micBtn.innerText = '🎙️'; }
    }

    window.onload = function() {
        Object.keys(CHARS).forEach(key => {
            const char = CHARS[key];
            const text = char.greeting.replace(/{NICKNAME}/g, userConfig.nickname);
            chatHistories[key].push({ sender: 'char', text: text, jp: char.greetingJp });
        });
        renderChat();

        // フォーム送信のイベントリスナー（テキスト入力から送信を確実に動かす設定）
        const form = document.getElementById('chatForm');
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            submitUserText();
        });
    };

    function switchChar(key) {
        currentCharKey = key;
        const char = CHARS[key];
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.toggle('active', btn.getAttribute('data-char') === key);
        });
        
        const profImg = document.getElementById('profileAvatar');
        profImg.dataset.tried = "";
        profImg.src = char.avatar;

        document.getElementById('profileName').innerHTML = `${char.name} <span>${char.age}歳・${char.job}</span>`;
        document.getElementById('profileDesc').innerText = char.desc;
        updateLoveUI();
        renderChat();
    }

    function handleSpeakClick(index) {
        const history = chatHistories[currentCharKey];
        if (history[index] && history[index].text) {
            speakText(history[index].text, history[index].sender === 'user');
        }
    }

    function renderChat(isTyping = false) {
        const chatBox = document.getElementById('chatBox');
        chatBox.innerHTML = '';
        const history = chatHistories[currentCharKey];

        history.forEach((msg, idx) => {
            const row = document.createElement('div');
            row.className = `msg-row ${msg.sender}`;

            if (msg.sender === 'user') {
                row.innerHTML = `
                    <div class="msg-user-icon">${escapeHtml(userConfig.name)}</div>
                    <div class="msg-content">
                        <div class="bubble">${escapeHtml(msg.text)}</div>
                    </div>
                `;
            } else {
                const char = CHARS[currentCharKey];
                let jpHtml = msg.jp ? `<div class="jp-trans">🇯🇵 ${escapeHtml(msg.jp)}</div>` : '';
                row.innerHTML = `
                    <img class="msg-avatar" src="${char.avatar}" onerror="tryNextExt(this, '${currentCharKey}')" alt="${char.name}">
                    <div class="msg-content">
                        <div class="bubble">
                            ${escapeHtml(msg.text)}
                            ${jpHtml}
                        </div>
                        <button class="speak-btn" onclick="handleSpeakClick(${idx})">🔊 もう一度聴く</button>
                    </div>
                `;
            }
            chatBox.appendChild(row);
        });

        if (isTyping) {
            const char = CHARS[currentCharKey];
            const typingRow = document.createElement('div');
            typingRow.className = 'msg-row char';
            typingRow.innerHTML = `
                <img class="msg-avatar" src="${char.avatar}" onerror="tryNextExt(this, '${currentCharKey}')" alt="${char.name}">
                <div class="msg-content">
                    <div class="bubble typing-indicator">💭 ${char.name}がメッセージを入力中...</div>
                </div>
            `;
            chatBox.appendChild(typingRow);
        }

        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function sendQuick(text) {
        document.getElementById('userInput').value = text;
        submitUserText();
    }

    function submitUserText() {
        stopSpeechRecognition();
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if (!text) return;

        chatHistories[currentCharKey].push({ sender: 'user', text: text });
        input.value = '';
        renderChat(true); // 返信考え中表示
        addLoveExp(8);

        processCharResponse(text);
    }

    async function processCharResponse(userText) {
        let replyEn = "";
        let replyJp = "";

        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: userText, character: currentCharKey }),
            });
            if (!response.ok) throw new Error();
            const data = await response.json();
            replyEn = data.reply;
            replyJp = data.jp || "";
        } catch (error) {
            const matched = getSmartReply(currentCharKey, userText);
            replyEn = matched.en.replace(/{NICKNAME}/g, userConfig.nickname);
            replyJp = matched.jp;
        }

        /* 3秒（3000ms）待機してから返答 */
        setTimeout(() => {
            chatHistories[currentCharKey].push({
                sender: 'char',
                text: replyEn,
                jp: replyJp
            });
            renderChat(false);
            speakText(replyEn);
        }, 3000);
    }
</script>
